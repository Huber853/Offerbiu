c\":{\"ssrContent\":\"<div class=\\\"for-seo\\\" data-type=\\\"PageLayout\\\"><div  data-type=\\\"TabFlippableCardList\\\"><span>应届生招聘</span>\\n          <span>挑战前沿难题</span><span>使用前沿技术帮助客户解决最具挑战性的问题，成就客户成就自己</span><img src=\\\"https://sf-atsx-tob.larksuite.com/obj/static-atsx-online-sg-ee-tob-mycis/50ce8906cf67749d16685cb9bbdd23e0/c0620cd4c32c0609b320f00142a4e9e454633366026a27adcc18dd4d53184178.png\\\" alt=\\\"\\\" />\\n          <img src=\\\"https://sf-atsx-tob.larksuite.com/obj/static-atsx-online-sg-ee-tob-mycis/50ce8906cf67749d16685cb9bbdd23e0/918964d16623500244c93bfd2fdcd92329e0b4da0a9d464cebed7f2f37898296.png\\\" alt=\\\"\\\" />\\n        \\n          <span>与牛人同行</span><span>与 10000+ 全球各地优秀的同事、领先的合作企业共事，一同成长</span><img src=\\\"https://sf-atsx-tob.larksuite.com/obj/static-atsx-online-sg-ee-tob-mycis/50ce8906cf67749d16685cb9bbdd23e0/34ff829514dd4ff84f76fbf2d8e6a266890baa380c79f5944ae228a74554588b.png\\\" alt=\\\"\\\" />\\n          <img src=\\\"https://sf-atsx-tob.larksuite.com/obj/static-atsx-online-sg-ee-tob-mycis/50ce8906cf67749d16685cb9bbdd23e0/ce125e3006a8ff6d3f35f9760c3b1d18947289dac52aaeeac9a6dde40b6dac00.png\\\" alt=\\\"\\\" />\\n        \\n          <span>创造行业标准</span><span>在数字技术的开发和应用上的前沿，创造标准</span><img src=\\\"https://sf-atsx-tob.larksuite.com/obj/static-atsx-online-sg-ee-tob-mycis/50ce8906cf67749d16685cb9bbdd23e0/092123ddb14f7687aafac77d250d0611ed7de4605097e7bf0e3033e8af96754b.png\\\" alt=\\\"\\\" />\\n          <img src=\\\"https://sf-atsx-tob.larksuite.com/obj/static-atsx-online-sg-ee-tob-mycis/50ce8906cf67749d16685cb9bbdd23e0/4b6c4c73960b3c89587316d6067421a72bf69bcd9b761990622d30659e3855c6.png\\\" alt=\\\"\\\" />\\n        \\n          <span>发挥无限才能</span><span>不同文化背景下的沟通，提倡集思广益，让你面对广大可能性和成长空间</span><img src=\\\"https://sf-atsx-tob.larksuite.com/obj/static-atsx-online-sg-ee-tob-mycis/50ce8906cf67749d16685cb9bbdd23e0/fbb617450290a162e3f77800d157ef19711d5d7608b60db35a00d8f5a552a14c.png\\\" alt=\\\"\\\" />\\n          <img src=\\\"https://sf-atsx-tob.larksuite.com/obj/static-atsx-online-sg-ee-tob-mycis/50ce8906cf67749d16685cb9bbdd23e0/2e676c0e8a3a1dc78e467aae561598334a86cf781ebd2de92a8456f5badc4d80.png\\\" alt=\\\"\\\" />\\n        <span>实习生招聘</span>\\n          <span>挑战前沿难题</span><span>使用前沿技术帮助客户解决最具挑战性的问题，成就客户成就自己</span><img src=\\\"https://sf-atsx-tob.larksuite.com/obj/static-atsx-online-sg-ee-tob-mycis/50ce8906cf67749d16685cb9bbdd23e0/42b556f0a1a01c3238074d305613dc14daba71011f2cf464cf305626faad9a68.png\\\" alt=\\\"\\\" />\\n          <img src=\\\"https://sf-atsx-tob.larksuite.com/obj/static-atsx-online-sg-ee-tob-mycis/50ce8906cf67749d16685cb9bbdd23e0/84bc973fb22fc8c0c4123ca88da006247775c082430778c37a1503fb14737b58.png\\\" alt=\\\"\\\" />\\n        \\n          <span>与牛人同行</span><span>与 10000+ 全球各地优秀的同事、领先的合作企业共事，一同成长</span><img src=\\\"https://sf-atsx-tob.larksuite.com/obj/static-atsx-online-sg-ee-tob-mycis/50ce8906cf67749d16685cb9bbdd23e0/b5ce175b75cd607f90a5c85d93c187b65a60fdb92f819ef36b0f40a3b375a0af.png\\\" alt=\\\"\\\" />\\n          <img src=\\\"https://sf-atsx-tob.larksuite.com/obj/static-atsx-online-sg-ee-tob-mycis/50ce8906cf67749d16685cb9bbdd23e0/5f302e901dfc270cf136a550452913c0bd0636f9a875ae12f95edf6550c33a0a.png\\\" alt=\\\"\\\" />\\n        \\n          <span>创造行业标准</span><span>在数字技术的开发和应用上的前沿，创造标准</span><img src=\\\"https://sf-atsx-tob.larksuite.com/obj/static-atsx-online-sg-ee-tob-mycis/50ce8906cf67749d16685cb9bbdd23e0/8af1f4a5066856082d2f61af695b5abed82e83ed873475cc588d492439348142.png\\\" alt=\\\"\\\" />\\n          <img src=\\\"https://sf-atsx-tob.larksuite.com/obj/static-atsx-online-sg-ee-tob-mycis/50ce8906cf67749d16685cb9bbdd23e0/028bd18c1ee0ece2c2e2a45cbbc22668883f856c7b9750eae07541830832ea67.png\\\" alt=\\\"\\\" />\\n        \\n          <span>发挥无限才能</span><span>不同文化背景下的沟通，提倡集思广益，让你面对广大可能性和成长空间</span><img src=\\\"https://sf-atsx-tob.larksuite.com/obj/static-atsx-online-sg-ee-tob-mycis/50ce8906cf67749d16685cb9bbdd23e0/e4987830a7d5e722773614bf7b518842bbc951dbaf61457339c288643dfa4168.png\\\" alt=\\\"\\\" />\\n          <img src=\\\"https://sf-atsx-tob.larksuite.com/obj/static-atsx-online-sg-ee-tob-mycis/50ce8906cf67749d16685cb9bbdd23e0/2cf6a60e29af2dfb594427eaef36d01276d451d3b28796ea76cdc50db5c9baba.png\\\" alt=\\\"\\\" />\\n        </div><div  data-type=\\\"Section\\\"><span  data-type=\\\"Text\\\"><span>关于技术人才项目的招聘信息，请前往项目页面了解\\n</span></span></div><div  data-type=\\\"QAndA\\\"><span>关于应届生招聘</span>\\n          <span>投递时间：2026 年 8 月至 2027 年 5 月 31 日止\\\\n\\n笔试时间：即日起\\\\n\\n面试时间：即日起，根据招聘进展灵活开展\\\\n\\nOffer 发放时间：面试通过后，灵活沟通发放</span><span>字节跳动 2027 校园招聘的时间安排是什么？</span>\\n        \\n          <span>在 2026 年 9 月至 2027 年 8 月期间毕业（中国大陆地区以毕业证为准，非中国大陆地区以学位证为准），且最高学历毕业后无全职工作经验的学生。\\n\\\\n*不满足以上毕业时间的同学可以考虑投递社会招聘或实习岗位</span><span>字节跳动 2027 校园招聘的招聘对象是？</span>\\n        \\n          <span>前沿技术领域人才校招，是字节跳动面向全球优秀技术人才推出的招聘项目，招聘对象为 2027 届及以后毕业的同学。\\n\\\\n字节跳动针对前沿技术领域优秀应届生和实习生的招聘，今年统一放在“前沿技术领域人才校招”项目中，不再设立“筋斗云人才计划”。\\n\\\\n“用人看本质”是字节跳动重要的人才理念，我们看重人才潜力、不看资历。同时，我们一直坚持“以能定级，以级定薪”，会直接根据候选人的能力，给予相应的定级和领先行业的薪酬回报。\\n\\\\n随着字节跳动在各技术领域的不断探索，公司正面临 AI 时代新的机遇，需要更多优秀人才和我们一起去做超越常规的突破。未来，字节跳动将持续加大对人才的投入，为优秀人才提供行业最好的发展空间和回报。</span><span>“前沿技术领域人才校招”与此前的“筋斗云人才计划”是什么关系？</span>\\n        \\n          <span>岗位方向有所不同，Seed 大模型人才校招岗位主要包括基础大模型、机器学习系统、视觉智能、语音智能、大模型 AI 搜索、模型个性化、具身智能等方向。前沿技术领域人才校招岗位主要包括大模型应用、搜索/推荐/广告、计算机体系结构与系统优化、安全/AI Safety、硬件、AI Coding、AIGC、视频架构、AI for Science等方向。</span><span>Seed 大模型人才校招与字节跳动前沿技术领域人才校招有何不同？ </span>\\n        \\n          <span>我们坚持用人看本质、看重你的潜力和能力，不唯背景和资历，欢迎不同背景的优秀人才加入。比起学历和专业，兴趣和能力是否匹配更重要，你可以在具体职位描述中进一步查看和了解岗位的详细信息。</span><span>招聘对学历和所学专业有限制吗？ </span>\\n        \\n          <span>字节跳动 2027 校园招聘全年开放投递，共计4次投递机会（ 2026 年 8 月 3 日 - 2026 年 12 月 31 日有两次投递机会； 2027 年 1 月1 日刷新两次投递机会，2026 年和 2027 年投递机会独立）。\\n\\\\n如果你投递的职位未被录用，HR 有可能会根据你的简历情况，再次邀请你进入其他校招岗位流程。你的申请职位及招聘进度随之更新，请留意相关邮件及短信通知。\\n\\\\n\\n\\\\n在字节跳动社会招聘和实习生招聘中，每人不限投递次数，可以尽情选择心仪的职位。考虑到应聘效率，也建议同学在投递时区分优先级，优先投递意向度最高的岗位。</span><span>每人可以投递几个职位？</span>\\n        \\n          <span>两个职位彼此独立且不限制投递时间，我们会默认优先处理较早投递的职位。当然，你可以选择只投递一个职位，或在第一个职位流程结束后再投递第二个职位。但请注意，已成功投递的职位不能修改更换。</span><span>每年可投递的两个职位之间有什么关系？</span>\\n        \\n          <span>在投递次数限制内，可以再次投递。</span><span>如果已经投递了实习（ByteIntern/日常实习）或社招职位，还可以投递校招职位吗？</span>\\n        \\n          <span>字节跳动校园招聘官网为本次校园招聘简历投递的唯一入口，在电脑及手机上均可进行投递。\\n\\\\n字节跳动校园招聘官网网址：jobs.bytedance.com/campus ，勾选“正式”，解锁所有在招岗位。\\n </span><span>如何投递简历？</span>\\n        \\n          <span>不可以修改投递职位。</span><span>职位投递成功后，还可以修改投递职位吗？</span>\\n        \\n          <span>如需修改简历内容，请登录字节跳动校园招聘官网，进入个人中心-我的简历模块进行修改。\\n\\\\n但请注意，已投递的职位是无法同步更新展示新简历内容的；在修改简历后新投递的职位，会展示新简历内容。</span><span>职位投递成功后，还可以修改简历内容吗？</span>\\n        \\n          <span>登录字节跳动校园招聘官网，页面右上角「应聘记录」可实时查看招聘进展。同时我们也会通过邮件、短信等方式同步后续安排，请确保投递时填写正确的手机号及邮箱。 </span><span>如何知道我的招聘进展？</span>\\n        \\n          <span>只有简历状态显示【流程终止】说明流程结束，其他状态请耐心等待后续通知。</span><span>如果简历状态已经停留在某一个阶段很久了（超过 10 个工作日），说明流程已经结束了吗？</span>\\n        \\n          <span>是的，说明你在当前投递的职位下暂无后续安排。</span><span>如果简历状态显示【流程终止】，说明流程已经结束了吗？ </span>\\n        \\n          <span>在职实习生需要走实习生转正流程，具体可以联系你的 HR。已离职实习生可以投递校招职位。</span><span>我是在职实习生，我可以投递校招职位么？</span>\\n        \\n          <span>所有校招职位均可参加内推。若通过内推投递校招职位，简历将获得优先筛选资格。更重要的是，可以通过内推人更深入地了解公司和部门。</span><span>字节跳动 2027 校园招聘可以内推吗？参加内推有什么作用？</span>\\n        \\n          <span>通过校招内推码参加内推。联系字节跳动在职同学获取校招内推链接/内推码（正式员工和实习生都有内推码），点击链接进行投递或在投递页面输入内推码，投递成功即代表内推成功。</span><span>怎么样可以参加校招内推？</span>\\n        \\n          <span>投递完成之后不可以再补充内推码或重新通过内推链接投递。</span><span>我在投递的时候，没有填写内推码或使用内推链接投递，还能再次通过内推投递吗？</span>\\n        \\n          <span>投递之后不可以再修改内推码。</span><span>我用 A 的内推码完成了投递，同时我又收到了 B 的内推码，我可以修改吗？</span>\\n        \\n          <span>可以，每位同学最多有两次投递的机会，可以使用同一个内推码，或分别使用不同的内推码参加内推。</span><span>我内推投递了一个职位，但流程已经被结束，我还可以再次通过内推投递吗？</span>\\n        \\n          <span>不需要！字节跳动不会以任何形式进行付费内推，也绝不会以任何名义向应聘者收取任何费用，请谨防受骗！</span><span>内推需要付费吗？</span>\\n        \\n          <span>不同部门及岗位的校招流程会有差异性。 HR 会根据你的简历与岗位的匹配度判断是否需要笔试，请以实际安排为准，届时将通过邮件和短信等形式提前 1-3 个工作日进行通知。</span><span>所有职位都会安排笔试吗？</span>\\n        \\n          <span>如若投递职位有笔试安排，将采取在线笔试的形式，请耐心等待邮件和短信通知。笔试根据投递时间顺序先后发放，具体笔试时间以收到的通知为准。</span><span>笔试采取什么形式？是什么时候？</span>\\n        \\n          <span>建议大家收到笔试通知后，尽量按时参与。如果未及时参加笔试，且投递职位仍有需求，你将有机会再次参与笔试，请耐心等待邮件和短信通知。</span><span>错过笔试，还能再参加笔试吗？</span>\\n        \\n          <span>需要，笔试是根据投递岗位进行邀约的。岗位类型和方向不同，考察的范围也不同。</span><span>之前做过校招笔试，本次收到笔试邀约后还需要作答吗？</span>\\n        \\n          <span>不同职位的笔试完成期限、笔试时长也相应不同，请以邮件中的实际安排为准。</span><span>笔试的作答时长多久？</span>\\n        \\n          <span>我们正在对笔试结果进行评估，请耐心等待笔试结果。笔试结果作为应聘的参考维度，我们暂不开放笔试结果查询。</span><span>笔试之后，为什么简历状态一直为【笔试中】？如何查看笔试结果？</span>\\n        \\n          <span>Step1 查看自己投递简历时填写的邮箱及电话是否有误；\\n         \\\\nStep2 查看简历投递邮箱的垃圾箱；\\n       \\\\nStep3 如果确认没有收到笔试通知，可前往“候选人体验反馈平台”candidatefeedback.bytedance.com，发送详细信息说明情况，会有 HR 在五个工作日内回复。如需反馈，请参考以下内容：\\n   \\\\n【招聘流程类型】校园招聘\\n   \\\\n【反馈内容类型】咨询\\n   \\\\n  标题：官网状态笔试中，未收到笔试邀请\\n   \\\\n  内容：至少包含个人姓名，手机号，投递职位名称，投递邮箱以及可以接收邮件的正确邮箱。\\n   \\\\n\\n    \\\\n *简历状态为【笔试中】不足一周时间，且未收到任何笔试通知，此时HR正在安排笔试，请耐心等待笔试通知。</span><span>简历状态为【笔试中】超过一周，但一直没有收到笔试通知怎么办？或者只收到了手机短信，没有收到笔试邀请怎么办？</span>\\n        \\n          <span>在线初评用于信息收集与初步评估，包含在线问答和 AI 能力测评，以 AI 形式进行。部分岗位有在线初评环节，若你收到邀约，建议认真参与并如实作答，这将有助于团队更全面地了解你的情况。</span><span>在线初评是什么？是否一定要参加？</span>\\n        \\n          <span>如你已经进入面试中还未收到面试通知，请留意邮件及手机短信，我们会在面试前与你沟通。</span><span>我的简历状态显示【面试中】，但却未收到任何通知，是什么原因？</span>\\n        \\n          <span>简历投递后，HR 会根据你的过往经历来决定是否邀请你参与投递岗位面试，也可能邀请至其他合适的岗位面试，如果不想参与其他岗位的面试，可以直接拒绝。</span><span>为什么投递的岗位和被邀请面试的岗位不一致？</span>\\n        \\n          <span>请尽量按时参与面试。如果临时有事或因不可抗力无法参加，不要着急，请直接联系面试邀请邮件中的 HR 说明情况，并让 HR 帮忙修改。\\n  \\\\n若因特殊情况无法联系上 HR ，可前往“候选人体验反馈平台” candidatefeedback.bytedance.com，发送详细信息说明情况，会有 HR 在五个工作日内回复。如需反馈，请参考以下内容：\\n   \\\\n【招聘流程类型】校园招聘\\n   \\\\n【反馈内容类型】咨询\\n   \\\\n  标题：调整面试时间\\n   \\\\n  内容：至少包含个人姓名，手机号，投递职位名称，需要修改的面试时间和可面试的时间段。</span><span>我想调整面试时间或面试形式，应该联系谁呢？</span>\\n        \\n          <span>登录字节跳动校园招聘官网，页面右上角「应聘记录」可实时查看招聘进展。【流程终止】外的其他状态请耐心等待后续通知。  </span><span>面试后多长时间可以收到结果？</span>\\n        \\n          <span>\\\\n- 挑战更高的目标：在 AI 时代有很多机会和挑战，我们希望不断攀登新的技术和业务高峰，持续探索，并在这一过程中鼓励新人大胆创新，做有价值、有难度、有高度的事，天花板足够高。\\n\\\\n- 充足的做事空间：我们相信人才潜力并充分授权，不论资排辈，新人也能主导重要项目，有潜力的人可以大胆想象，放手做事。同时，我们为校招生配备 Mentor 、开放的学习资源，让你获得成长所需要的支持。\\n\\\\n- 行业领先的回报发展：我们将为优秀人才提供领先行业头部的薪酬和激励，同时鼓励拉开激励区分度，让优秀的人得到充分的认可和回报。</span><span>选择加入字节跳动，你将有怎样的成长与收获？</span>\\n        \\n          <span>字节跳动关注大家的成长，为 ByteDancer 准备了开放的学习资源，为不同成长阶段提供所需要的支持。\\\\n\\n \\\\n\\n- 新员工必修课程为你开启职场第一课。通过学习，你可以全面了解公司文化、政策、办公系统等，快速融入公司；\\\\n\\n- 明确的成长计划帮你快速融入。入职后，Leader 和 Mentor为你制定成长计划、明晰发展路径，帮助你更好地熟悉业务、融入团队，从校招小白快速成长为独当一面的职场人；\\\\n\\n- 开放的学习资源和平台，持续积累持续提升。知识库沉淀丰富的内部优秀实践；ByteLearning 提供丰富的学习资源，随时在线学习。技术新人还可以参加各类业务技术培训，和技术大牛零距离交流，了解字节跳动技术全景，提升专业技能，开拓技术视野。</span><span>针对新员工，字节跳动有哪些培养资源及培训计划助力？</span>\\n        \\n          <span>请点击校招官网【成长体验】页面查看字节跳动的员工福利，工作环境和更多企业相关信息。</span><span>字节跳动有什么员工福利呢？</span>\\n        \\n          <span>如果以上问题都没有解答你的疑惑，可发送详细信息至候选人体验反馈平台 candidatefeedback.bytedance.com 说明情况，我们会在五个工作日内回复。\\n\\\\n欢迎关注【字节跳动招聘】公众号，第一时间获取最新校招动态。</span><span>若想咨询更多信息，如何联系？</span>\\n        <span>关于实习生招聘</span>\\n          <span>全年进行招聘，具体职位信息以官网为准。</span><span>字节跳动 2026 年实习生招聘的时间安排是什么？</span>\\n        \\n          <span> ByteIntern：面向 2027 届毕业生（2026 年 9 月 - 2027 年 8 月期间毕业），通过该项目投递，所有岗位都有转正机会（转正率达55%！）\\n\\\\n日常实习：面向全体在校生，为符合岗位要求的同学提供为期3个月及以上的项目实践机会。</span><span>ByteIntern 和日常实习生的区别是什么？</span>\\n        \\n          <span>我们坚持用人看本质、多元兼容的人才观，不唯背景和资历，欢迎不同背景的优秀人才加入。比起学历和专业，兴趣和能力是否匹配更重要，你可以在具体职位描述中进一步查看和了解岗位的详细信息。</span><span>招聘对学历和所学专业有限制吗？</span>\\n        \\n          <span>在字节跳动实习生招聘中，每人不限投递次数哦，可以尽情选择心仪的职位。</span><span>每人可以投递几个职位？</span>\\n        \\n          <span>每个职位彼此独立且不限制投递时间，我们会默认优先处理较早投递的职位。当然，你可以选择只投递一个职位，或在一个职位流程结束后再投递下一个职位。但请注意，已成功投递的职位不能修改更换。</span><span>投递的多个职位之间有什么关系？</span>\\n        \\n          <span>可以。但是我们会优先处理较早投递的日常实习职位，如果你投递的日常实习未被录用，HR 有可能会根据你投递的ByteIntern职位再次邀请你进入招聘流程。</span><span>如果已经投递了日常实习或社招职位，还可以投递ByteIntern职位吗？</span>\\n        \\n          <span>字节跳动校园招聘官网为本次校园招聘简历投递的唯一入口，在电脑及手机上均可进行投递。\\n\\\\n字节跳动校园招聘官网网址：jobs.bytedance.com/campus</span><span>如何投递简历？</span>\\n        \\n          <span>不可以修改投递职位。</span><span>职位投递成功后，还可以修改投递职位吗？</span>\\n        \\n          <span>如需修改简历内容，请登录字节跳动校园招聘官网，进入个人中心-我的简历模块进行修改。但请注意，已投递的职位是无法同步更新展示新简历内容的；在修改简历后新投递的职位，会展示新简历内容。</span><span>职位投递成功后，还可以修改简历内容吗？</span>\\n        \\n          <span>登录字节跳动校园招聘官网，页面右上角「应聘记录」可实时查看招聘进展。同时我们也会通过邮件、短信等方式同步后续安排，请确保投递时填写的手机号及邮箱正确。</span><span>如何知道我的招聘进展？</span>\\n        \\n          <span>只有简历状态显示【流程终止】说明流程结束，其他状态请耐心等待后续通知。</span><span>如果简历状态已经停留在某一个阶段很久了（超过 10 个工作日），说明流程已经结束了吗？</span>\\n        \\n          <span>是的，说明你在当前投递的职位下暂无后续安排。</span><span>如果简历状态显示【流程终止】，说明流程已经结束了吗？</span>\\n        \\n          <span>目前在招岗位以官网为主，实习岗位会在校招官网持续更新，同学可以随时关注官网动态以及字节跳动招聘公众号。</span><span>后续还会开放其他实习职位吗？什么时候开放？</span>\\n        \\n          <span>所有实习职位均可参加内推。若通过内推投递实习职位，简历将获得优先筛选资格。更重要的是，可以通过内推人更深入地了解公司和部门。</span><span>字节跳动实习生招聘可以内推吗？参加内推有什么作用？</span>\\n        \\n          <span>通过校招内推链接/内推码参加内推。联系字节跳动在职同学获取校招内推链接/内推码（正式员工和实习生均有内推码），点击链接进行投递或在投递页面输入内推码，投递成功即代表内推成功。</span><span>怎么样可以参加实习内推？</span>\\n        \\n          <span>投递完成之后不可以再补充内推码或重新通过内推链接投递。</span><span>我在投递的时候，没有填写内推码或使用内推链接投递，还能再次通过内推投递吗？</span>\\n        \\n          <span>投递之后不可以再修改内推码。</span><span>我用 A 的内推码完成了投递，同时我又收到了 B 的内推码，我可以修改吗？</span>\\n        \\n          <span>可以，每位同学有多次投递机会，可以使用同一个内推码，或分别使用不同的内推码参加内推。</span><span>我内推投递了一个职位，但流程已经被结束，我还可以再次通过内推投递吗？</span>\\n        \\n          <span>不需要！字节跳动不会以任何形式进行付费内推，也绝不会以任何名义向应聘者收取任何费用，请谨防受骗！</span><span>内推需要付费吗？</span>\\n        \\n          <span>不同部门及岗位的校招流程会有差异性。HR会根据你的简历与岗位的匹配度判断是否需要笔试，请以实际安排为准，届时将通过邮件和短信等形式提前1-3个工作日进行通知。</span><span>所有职位都会安排笔试吗？</span>\\n        \\n          <span>如若投递职位有笔试安排，将采取在线笔试的形式，请耐心等待邮件和短信通知。笔试根据投递时间顺序先后发放，具体笔试时间以收到的通知为准。</span><span>笔试采取什么形式？是什么时候？</span>\\n        \\n          <span>建议大家收到笔试通知后，尽量按时参与。如果未及时参加笔试，且投递职位仍有需求，你将有机会再次参与笔试，请耐心等待邮件和短信通知。</span><span>错过笔试，还能再参加笔试吗？</span>\\n        \\n          <span>需要，笔试是根据投递岗位进行邀约的。岗位类型和方向不同，考察的范围也不同。</span><span>之前做过校招笔试，本次收到笔试邀约后还需要作答吗？</span>\\n        \\n          <span>不同职位的笔试完成期限、笔试时长也相应不同，请以邮件中的实际安排为准。</span><span>笔试的作答时长多久？</span>\\n        \\n          <span>我们正在对笔试结果进行评估，请耐心等待笔试结果。笔试结果作为应聘的参考维度，我们暂不开放笔试结果查询。</span><span>笔试之后，为什么简历状态一直为【笔试中】？如何查看笔试结果？</span>\\n        \\n          <span>Step1 查看自己投递简历时填写的邮箱及电话是否有误；\\n \\\\nStep2 查看简历投递邮箱的垃圾箱；\\n \\\\nStep3 如果确认没有收到笔试通知，可前往“候选人体验反馈平台”candidatefeedback.bytedance.com，发送详细信息说明情况，会有 HR 在五个工作日内回复。如需反馈，请参考以下内容：\\n\\\\n\\n  \\\\n【招聘流程类型】校园招聘\\n  \\\\n【反馈内容类型】咨询\\n  \\\\n标题：官网状态笔试中，未收到笔试邀请\\n  \\\\n内容：至少包含个人姓名，手机号，投递职位名称，投递邮箱以及可以接收邮件的正确邮箱。\\n\\\\n\\n\\\\n\\n\\\\n*简历状态为【笔试中】不足一周时间，且未收到任何笔试通知，此时HR正在安排笔试，请耐心等待笔试通知。</span><span>简历状态为【笔试中】超过一周，但一直没有收到笔试通知怎么办？或者只收到了手机短信，没有收到笔试邀请怎么办？</span>\\n        \\n          <span>如你已经进入面试中还未收到面试通知，请留意邮件及手机短信，我们会在面试前与你沟通。</span><span>我的简历状态显示【面试中】，但却未收到任何通知，是什么原因？</span>\\n        \\n          <span>简历投递后，HR会根据你的过往经历来决定是否邀请你参与投递岗位面试，也可能邀请至其他合适的岗位面试，如果不想参与其他岗位的面试，可以直接拒绝。</span><span>为什么投递的岗位和被邀请面试的岗位不一致？</span>\\n        \\n          <span>请尽量按时参与面试。如果临时有事或因不可抗力无法参加，不要着急，请提前联系面试邀请邮件中的 HR 说明情况，并让 HR 帮忙修改。\\n \\\\n\\n \\\\n若因特殊情况无法联系上 HR ，可前往“候选人体验反馈平台” candidatefeedback.bytedance.com，发送详细信息说明情况，会有 HR 在五个工作日内回复。如需反馈，请参考以下内容：\\n \\\\n【招聘流程类型】校园招聘\\n \\\\n【反馈内容类型】咨询\\n \\\\n标题：调整面试时间\\n \\\\n内容：至少包含个人姓名，手机号，投递职位名称，需要修改的面试时间和可面试的时间段。</span><span>我想调整面试时间或面试形式，应该联系谁呢？</span>\\n        \\n          <span>登录字节跳动校园招聘官网，页面右上角「应聘记录」可实时查看招聘进展。【流程终止】外的其他状态请耐心等待后续通知。</span><span>面试后多长时间可以收到结果？</span>\\n        \\n          <span> \\\\n- 挑战更高的目标：在 AI 时代有很多机会和挑战，我们希望不断攀登新的技术和业务高峰，持续探索，并在这一过程中鼓励新人大胆创新，做有价值、有难度、有高度的事，天花板足够高。\\n \\\\n- 充足的做事空间：我们相信人才潜力并充分授权，不论资排辈，新人也能主导重要项目，有潜力的人可以大胆想象，放手做事。同时，我们为校招生配备 Mentor 、开放的学习资源，让你获得成长所需要的支持。\\n \\\\n- 行业领先的回报发展：我们将为优秀人才提供领先行业头部的薪酬和激励，同时鼓励拉开激励区分度，让优秀的人得到充分的认可和回报。</span><span>选择加入字节跳动，你将有怎样的成长与收获？</span>\\n        \\n          <span>字节跳动关注大家的成长，为 ByteDancer 准备了开放的学习资源，为不同成长阶段提供所需要的支持。\\n \\\\n\\n\\\\n- 新员工必修课程为你开启职场第一课。通过学习，你可以全面了解公司文化、政策、办公系统等，快速融入公司；\\n\\\\n- 明确的成长计划帮你快速融入。入职后，Leader 和Mentor为你制定成长计划、明晰发展路径，帮助你更好地熟悉业务、融入团队，从校招小白快速成长为独当一面的职场人；\\n\\\\n- 开放的学习资源和平台，持续积累持续提升。知识库沉淀丰富的内部优秀实践；ByteLearning 提供丰富的学习资源，随时在线学习。技术新人还可以参加各类业务技术培训，和技术大牛零距离交流，了解字节跳动技术全景，提升专业技能，开拓技术视野。</span><span>针对新员工，字节跳动有哪些培养资源及培训计划助力？</span>\\n        \\n          <span>请点击校招官网【成长体验】页面查看字节跳动的员工福利，工作环境和更多企业相关信息。</span><span>字节跳动有什么员工福利呢？</span>\\n        \\n          <span>如果以上问题都没有解答你的疑惑，可发送详细信息至候选人体验反馈平台 candidatefeedback.bytedance.com 说明情况，我们会在五个工作日内回复。\\n\\\\n\\n\\\\n欢迎关注【字节跳动招聘】公众号，第一时间获取最新校招动态。</span><span>若想咨询更多信息，如何联系？</span>\\n        </div><div  data-type=\\\"Section\\\"><span  data-type=\\\"Text\\\"><h4>校园活动资讯</h4></span></div><div  data-type=\\\"Section\\\"><div  data-type=\\\"IconItem\\\"></div><span  data-type=\\\"Text\\\"><span>字节跳动校园计划鼓励高校大学生提升技术能力、不断创新，通过训练营、奖学金等丰富的活动和机会，让同学发挥技术的价值，用创新方式解决问题。\\n</span></span><div  data-type=\\\"Image\\\"><img src=\\\"https://lf3-atsx-byte.feishucdn.com/obj/static-atsx-online-byte/50ce8906cf67749d16685cb9bbdd23e0/53b0d24873fba35c23a8cf3214b5dcf983e68721fa5fb53c5678925bdb83cab9.png\\\" alt=\\\"\\\" /><span>Add Image Caption Here</span></div><div  data-type=\\\"Image\\\"><img src=\\\"https://sf-atsx-tob.larksuite.com/obj/static-atsx-online-sg-ee-tob-mycis/50ce8906cf67749d16685cb9bbdd23e0/5a3f5d5b9952d6018576bb80fa544b34d6cb9630234c584942ce9b25357a5265.png\\\" alt=\\\"\\\" /><span>Add Image Caption Here</span></div><span  data-type=\\\"Text\\\"><h6>字节跳动奖学金</h6><span>「字节跳动奖学金 ByteDance Scholarship」是自 2021 年起发起的一年一期的人才培养项目。2026 年，项目首次面向全球高校在校生开放申请，并同步增加奖励名额，旨在支持青年人才在 AI 时代坚持真正重要的问题，做有长期价值的研究，鼓励他们向未至处，探索智能边界。\\n</span></span><div  data-type=\\\"Image\\\"><img src=\\\"https://lf3-atsx-byte.feishucdn.com/obj/static-atsx-online-byte/50ce8906cf67749d16685cb9bbdd23e0/6c8fed08d2677dcccde2eb4b79b2ec16e0c2d4a3b6b43422677eeaf69a5cc5ab.png\\\" alt=\\\"\\\" /><span>Add Image Caption Here</span></div><div  data-type=\\\"BasicGraphics\\\"></div><span  data-type=\\\"Text\\\"><h6>字节跳动技术训练营</h6></span><span  data-type=\\\"Text\\\"><span>字节跳动自2018年起举办技术训练营活动，旨在提高在校学生在计算机领域的专业度，完善从了解业界基础生产环境到熟悉技术产品应用的全流程能力，实现能力跃迁。\\n</span></span><div  data-type=\\\"Button\\\"><a href=\\\"https://scholarship.bytedance.com/\\\" target=\\\"_self\\\">点击了解详情</a></div></div><div  data-type=\\\"Section\\\"><div  data-type=\\\"IconItem\\\"></div><span  data-type=\\\"Text\\\"><span>字节跳动校园计划开设了校企联合培养课程、求职辅导等活动，帮助同学更好地了解行业资讯，学习求职干货，提升求职竞争力。\\n</span></span><div  data-type=\\\"Image\\\"><img src=\\\"https://lf3-atsx-byte.feishucdn.com/obj/static-atsx-online-byte/50ce8906cf67749d16685cb9bbdd23e0/68e0b5154b84617574294288ab93fec254fa68ca6e5ac8cc88fcf523c9056a0e.png\\\" alt=\\\"\\\" /><span>Add Image Caption Here</span></div><div  data-type=\\\"Image\\\"><img src=\\\"https://lf3-atsx-byte.feishucdn.com/obj/static-atsx-online-byte/50ce8906cf67749d16685cb9bbdd23e0/d364e3983d4a74b7d871694a8dcba624727760e7003c0b1e76074c20706a4c14.png\\\" alt=\\\"\\\" /><span>Add Image Caption Here</span></div><span  data-type=\\\"Text\\\"><h6>校企联合培养课程</h6><span>字节跳动针对高校研发专业学生开展的一系列合作课程，将目前企业中已有的成熟技术及案例与高校计算机课程体系相结合，通过讲授、实践作业、小学期项目实践、毕业设计等方式方法做到产学联合培养。\\n</span></span><span  data-type=\\\"Text\\\"><h6>求职技能分享活动</h6><span>字节跳动积极与学校合作开展求职辅导课程和活动，通过简历辅导、模拟面试、职业发展讲座等形式，为在校生提供切实有效的求职经验分享，帮助高校大学生更好地了解职业机会，提升求职竞争力。\\n</span></span><div  data-type=\\\"BasicGraphics\\\"></div><div  data-type=\\\"Image\\\"><img src=\\\"https://lf3-atsx-byte.feishucdn.com/obj/static-atsx-online-byte/50ce8906cf67749d16685cb9bbdd23e0/6fa8b9760873bf8a18e827d1ff4fff0c580bf9154a2fd9eff2ddbf3deda71a5e.png\\\" alt=\\\"\\\" /><span>Add Image Caption Here</span></div></div><div  data-type=\\\"Section\\\"><div  data-type=\\\"IconItem\\\"></div><span  data-type=\\\"Text\\\"><span>字节跳动校园计划为高校大学生提供多样化的职业体验机会，同学可以参与Open Day、校园大使等项目，近距离接触职场和企业。\\n</span></span><div  data-type=\\\"Image\\\"><img src=\\\"https://sf-atsx-tob.larksuite.com/obj/static-atsx-online-sg-ee-tob-mycis/50ce8906cf67749d16685cb9bbdd23e0/e4636b24aa39e4a145ae856bdce66ddf61d074274d7a444763ab50396cd6316f.png\\\" alt=\\\"\\\" /><span>Add Image Caption Here</span></div><div  data-type=\\\"Image\\\"><img src=\\\"https://sf-atsx-tob.larksuite.com/obj/static-atsx-online-sg-ee-tob-mycis/50ce8906cf67749d16685cb9bbdd23e0/45f0ba95c0a0dc821c7b6d5f82578c542ee7c76a9c2b55ffccbd9341e22e2086.png\\\" alt=\\\"\\\" /><span>Add Image Caption Here</span></div><span  data-type=\\\"Text\\\"><h6>校园合伙人</h6><span>字节跳动校园合伙人是公司和学校的桥梁，协助进行校园招聘和学生活动的宣传及落地工作，提升个人职场竞争力。\\n</span></span><div  data-type=\\\"Image\\\"><img src=\\\"https://lf3-atsx-byte.feishucdn.com/obj/static-atsx-online-byte/50ce8906cf67749d16685cb9bbdd23e0/6c8fed08d2677dcccde2eb4b79b2ec16e0c2d4a3b6b43422677eeaf69a5cc5ab.png\\\" alt=\\\"\\\" /><span>Add Image Caption Here</span></div><div  data-type=\\\"BasicGraphics\\\"></div><span  data-type=\\\"Text\\\"><h6>企业开放日 Open Day</h6></span><span  data-type=\\\"Text\\\"><span>通过参观公司、与业务进行近距离接触和沟通、现场实践等方式加深校企合作，帮助师生近距离体验字节跳动工作环境与氛围。\\n</span></span></div><div  data-type=\\\"Section\\\"></div><div  data-type=\\\"Section\\\"><div  data-type=\\\"SocialIcon\\\"><img src=\\\"https://lf3-atsx-byte.feishucdn.com/obj/static-atsx-online-byte/50ce8906cf67749d16685cb9bbdd23e0/252e24801052ac979bf06ea4e0d3ddc4ec2859d04b87669a9d40b3dcbd7f45d3.png\\\" alt=\\\"\\\" /><img src=\\\"https://lf3-atsx-byte.feishucdn.com/obj/static-atsx-online-byte/50ce8906cf67749d16685cb9bbdd23e0/3399bf1a5f2b11d9401fb3bb966bd418a844811672553e4410e323ba9eb1188e.png\\\" alt=\\\"\\\" /><img src=\\\"https://lf3-atsx-byte.feishucdn.com/obj/static-atsx-online-byte/50ce8906cf67749d16685cb9bbdd23e0/b2f991d2ec1a9dd2e960a3f7b0e952a1c13c5346c3e0ce4229a0b2c62b98ebab.png\\\" alt=\\\"\\\" /><img src=\\\"https://lf3-atsx-byte.feishucdn.com/obj/static-atsx-online-byte/50ce8906cf67749d16685cb9bbdd23e0/005fd1d48c52248ac61666ddc9eab9d0bc2fe9c92382a28dacdb347fd0e1d23a.png\\\" alt=\\\"\\\" /></div><span  data-type=\\\"Text\\\"><span>联系我们</span></span><span  data-type=\\\"Text\\\"><span>相关网站</span></span><div  data-type=\\\"Button\\\"><a href=\\\"https://candidatefeedback.bytedance.com/
