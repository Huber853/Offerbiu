<!doctype html><html><head><meta charset="utf-8"><meta name="format-detection" content="telephone=no"><meta http-equiv="x-ua-compatible" content="ie=edge, chrome=1"><meta name="viewport" content="width=device-width,minimum-scale=1,maximum-scale=1,initial-scale=1,user-scalable=no"><meta name="description" content="字节跳动在全球推出了多款有影响力的产品，包括今日头条、抖音、西瓜视频、飞书等。业务覆盖150个国家和地区，旗下产品全球月活跃用户数超19亿。加入我们，和优秀的人，做有挑战的事！"><meta name="keywords" content="校招、校园招聘、字节跳动、字节跳动校招、字节校招、招聘、秋招、春招、实习生招聘、笔试、面试、校园"><link rel="icon" href="https://lf-package-cn.feishucdn.com/obj/atsx-throne/hire-fe-prod/portal/campus/favicon.ico"><script>window.gfdatav1={"env":"prod","envName":"prod","runtime":"node","ver":"1.0.0.1095","canary":2396505,"idc":"lq","region":"cn","vdc":"lq","vregion":"China-North","extra":{"canaryType":2}}</script><script id="js-websiteInfo" type="text/json">{"tenant_info":{"application_success":"//lf3-cdn-tos.bytescm.com/obj/eden-cn/lprupeh7nupfuhsbd/school/success_with_logo.png","disable_douyin_live":"true","disabledFacebook":"false","filter_extra_desc":"{\"project,7194661126919358757\":{\"title\":\"项目说明\",\"desc\":\"面向 2027 届毕业生，提供转正机会\"},\"project,7194661644654577981\":{\"title\":\"项目说明\",\"desc\":\"面向全体在校生，提供积累实践经验机会\"},\"type,2\":{\"title\":\"招聘范围\",\"desc\":\"2024 年 9 月 - 2025 年 8 月期间毕业的学生\"},\"type,3\":{\"title\":\"招聘范围\",\"desc\":\"全部在校生\"}}","follow_public":"//lf3-cdn-tos.bytescm.com/obj/eden-cn/lswtlheh7vinulk/campus/fllow_public.png","isSupportTopSeed":"true","jindouyunConfig":"{\"pageConfig\": {\"domainModuleConfig\": {\"moduleTitle\": \"八大领域前沿课题等你挑战\",\"btnText\": \"查看详情\",\"applicationBtnText\": \"报名\",\"domainList\": [{\"domain\": \"AI应用\",\"direction\": [{\"title\": \"基于多Sensor、多模态的大模型应用探索\",\"tagImgSrc\": \"https://lf3-static.bytednsdoc.com/obj/eden-cn/bvfnuloguloz/jindouyun/icon/基于多Sensor、多模态的大模型应用探索.png\",\"desc\": \"<b>课题介绍</b><br/><br/><br/>多sensor、多模态信息的表征、推断、挖掘与融合运用。探索移动设备的多种不同sensor、短视频领域不同模态信息的表征、深层信息的推断与不同问题域特征的高效融合运用，提升个性化水平。<br/><br/><br/>基于大模型，融合个性化技术到用户画质评估和对应的视频、图像处理能力中，提升用户观看体验。\",\"keywords\": \"算法工程师-抖音体验-筋斗云人才计划\"},{\"title\": \"对话机器人模型预训练方法研究\",\"tagImgSrc\": \"https://lf3-static.bytednsdoc.com/obj/eden-cn/bvfnuloguloz/jindouyun/icon/抖音大模型-抖音直播、抖音游戏.png\",\"desc\": \"<b>课题介绍</b><br/><br/><br/>在角色机器人实际落地中，业务场景经常会对模型结果有非常高的要求，如要求输出结果需要符合复杂的人物设定、不能在人物相关客观事实问题上有错误回答和幻觉等；另一方面又需要基于对话历史、知识库、检索结果等原始数据快速大批量的产出角色模型。<br/><br/><br/>为了能够同时兼顾高质量和高产量，我们希望能够建设角色机器人预训练模型，以及与之配套的数据清洗、检索等算法能力，能够让下游快速低成本的产出高质量聊天角色机器人模型。<br/><br/><br/><b>研究方向</b><br/><br/><br/>研究从小说、聊天历史记录、视频多模态数据、检索数据等数据来源中有效抽取角色机器人预训练数据的方法；<br/><br/><br/>建设角色机器人预训练模型，为下游多样的聊天机器人应用提供一个更强的基座模型；<br/><br/><br/>建设角色机器人对话能力的质量评估数据集和评估方法，建设自动评估的算法能力。\",\"keywords\": \"NLP算法工程师-抖音智能对话-筋斗云人才计划\"},{\"title\": \"大语言模型在应用构建及应用交互中的研究\",\"keywords\": \"大模型应用框架研发工程师-Flow-筋斗云人才计划\",\"tagImgSrc\": \"https://lf3-static.bytednsdoc.com/obj/eden-cn/bvfnuloguloz/jindouyun/icon/大语言模型在应用构建及应用交互中的研究.png\",\"desc\": \"<b>课题介绍</b><br/><br/><br/>随着AI技术的不断进步，大语言模型的生成、多模态理解以及规划能力为应用的构建以及交互方式带来了新的机遇。我们希望设计一套AI应用框架，探索如何使用大模型提升AI应用构建效率、为用户带来更自然和智能的交互体验。<br/><br/><br/>本课题旨在利用大模型技术开发智能应用交互框架，研究内容包括：围绕大模型设计应用框架，利用大模型提升应用构建效率，如代码生成、UI生成等；设计一门跨平台、高性能、大模型便于理解和生成的编程语言；使用大模型来理解应用的多模态context及用户意图，进行意图规划及推理执行，完成用户交互；通过该课题的研究，我们希望实现更加智能、便捷和高效的应用框架，推动AI驱动的应用交互的普及与发展。\"}]},{\"domain\": \"搜索、推荐、广告\",\"direction\": [{\"title\": \"推荐领域的大模型探索\",\"tagImgSrc\": \"https://lf3-static.bytednsdoc.com/obj/eden-cn/bvfnuloguloz/jindouyun/icon/推荐领域的大模型探索.png\",\"desc\": \"<b>课题介绍</b><br/><br/><br/>本项目旨在探索推荐领域下的大模型方案，改变现在持续了较长时间的推荐模型结构和Infra的基本范式，且效果大幅好于现在的模型，在抖音短视频/直播等多个业务场景上得到应用。推荐领域的大模型是比较有挑战的事情，推荐对工程效率的要求更高，且用户的推荐体验上是个性化的，本课题会以下多个方向来做深入的研究，探索和建设推荐场景的大模型。<br/><br/><br/><b>研究方向</b><br/><br/><br/> 基于内容理解和用户行为的表征学习；<br/><br/><br/>探索推荐模型下的参数和算例scaling up；<br/><br/><br/>超长序列建模；<br/><br/><br/> 生成式推荐模型。\",\"keywords\": \"推荐算法工程师-抖音推荐技术-筋斗云人才计划\"},{\"title\": \"交互式推荐\",\"keywords\": \"大模型算法工程师（推荐大模型）-抖音-筋斗云人才计划\",\"tagImgSrc\": \"https://lf3-static.bytednsdoc.com/obj/eden-cn/bvfnuloguloz/jindouyun/icon/交互式推荐.png\",\"desc\": \"<b>课题介绍</b><br/><br/><br/>大语言模型成熟后，基于LLM作为人和推荐系统的沟通桥梁，去突破现在的交互形式，让用户在被推荐的过程中和推荐系统主动交互，提供更多的输入信息开始有更多可能性。本课题的目的是在抖音的产品上探索交互式的推荐产品形态，且从推荐能力上做好跨模态的对齐和学习，对产品的交互式能力做好承接，探索交互方式上的突破。<br/><br/><br/><b>研究方向</b><br/><br/><br/>跨模态的对齐和统一表征学习（推荐、内容多模态、自然语言）；<br/><br/><br/>内容理解多模态技术以及推荐的应用；<br/><br/><br/>LLM以及多轮对话。\"},{\"title\": \"跨域兴趣迁移：内容兴趣到电商兴趣\",\"keywords\": \"推荐算法工程师-抖音电商-筋斗云人才计划\",\"tagImgSrc\": \"https://lf3-static.bytednsdoc.com/obj/eden-cn/bvfnuloguloz/jindouyun/icon/跨域兴趣迁移：内容兴趣到电商兴趣.png\",\"desc\": \"<b>课题介绍</b><br/><br/><br/>跨域兴趣映射机制：研究如何建立从内容消费行为到电商兴趣的高效映射模型。这包括识别用户在非电商内容中的潜在购物信号，如对特定产品、品牌或生活方式的偏好，并将其转化为电商领域可操作的兴趣标签。<br/><br/><br/>多模态内容分析与兴趣细化：利用视频、图文等多种内容形式中的视觉、听觉及上下文信息，深入挖掘用户的细致兴趣点。结合自然语言处理和计算机视觉技术，提升对用户兴趣的多维度理解与细分，为电商推荐提供更为丰富的用户画像。<br/><br/><br/>动态兴趣迁移模型：开发能够实时追踪并适应用户兴趣变化的模型，特别是在用户从内容浏览转向电商购买决策的动态过程中。该模型应能捕捉兴趣的短期波动与长期趋势，确保推荐内容与用户当前最相关的需求保持同步。<br/><br/><br/>个性化推荐策略优化：结合跨域兴趣迁移成果，优化电商推荐策略，实现内容兴趣与商品推荐的个性化平衡。探索如何在维持内容消费体验的同时，无缝融入电商元素，提高推荐的精准度与用户满意度。\"},{\"title\": \"多模态内容理解在短视频领域应用探索\",\"keywords\": \"多模态算法工程师-抖音内容理解-筋斗云人才计划\",\"tagImgSrc\": \"https://lf3-static.bytednsdoc.com/obj/eden-cn/bvfnuloguloz/jindouyun/icon/多模态内容理解在短视频领域应用探索.png\",\"desc\": \"<b>课题介绍</b><br/><br/><br/>抖音承载了大量用户生成的多模态数据，如抖音视频多模态（包括视频、音频、文本、评论交互等模态）、头条图文多模态（长短文本、多图片、评论交互）、评论上下文（结合视频和图文内容的评论对话session）。各个业务的产品形态、数据分布、用户交互行为都有不同的特点。<br/><br/><br/>为了能够利用好抖音集团国内诸多业务的数据优势，同时也为了能够低成本高质量的解决各个业务上的内容相关的业务需求，需要对这些多模态的数据有一个统一的表征学习方法，最终做到在下游的内容相关算法流程中能够提升算法效果、降低流程和机器成本。<br/><br/><br/><b>研究方向</b><br/><br/><br/>对差异极大的不同业务线、不同数据分布的多模态内容的统一内容表征学习，探索CV、文本、音频以及各类业务信息的融合建模方式；<br/><br/><br/>结合业务的数据特点，设计更好的模型结构、训练方法；<br/><br/><br/>推动多模态内容理解在下游各场景的落地应用；<br/><br/><br/>探索表征学习和LLM与训练的结合。\"},{\"title\": \"基于用户全域意图的多模态内容分发\",\"keywords\": \"推荐算法工程师-抖音直播-筋斗云人才计划\",\"tagImgSrc\": \"https://lf3-static.bytednsdoc.com/obj/eden-cn/bvfnuloguloz/jindouyun/icon/基于用户全域意图的多模态内容分发.png\",\"desc\": \"<b>课题介绍</b><br/><br/><br/>传统的多模态内容理解技术，更多侧重对内容本身的内容与结构语义层面的理解。而推荐分发技术，更多侧重对用户行为/反馈的学习与协同。内容理解与推荐，二者既存在语义表示层面的gap，又存在任务目标task层面的gap。而真正满足用户丰富多元化意图的推荐分发技术，需要比较精细化的解决多模态内容理解+用户行为反馈的联合学习与任务对齐，或者把用户的意图/行为反馈也当做一类模态，融入到整体的建模与学习的任务中。<br/><br/><br/><b>研究方向</b><br/><br/><br/>用户全域意图&兴趣的统一表示与学习；<br/><br/><br/>跨搜索与推荐的用户显式意图与隐私意图的个性化表示与匹配；<br/><br/><br/>基于多模态大模型的内容理解推荐分发技术；<br/><br/><br/>统一搜索&推荐任务的分发基础模型。\"},{\"title\": \"面向广告场景的生成式推荐大模型\",\"keywords\": \"算法工程师-商业化产品与技术-Ads Core-筋斗云人才计划\",\"tagImgSrc\": \"https://lf3-static.bytednsdoc.com/obj/eden-cn/bvfnuloguloz/jindouyun/icon/面向广告场景的生成式推荐大模型.png\",\"desc\": \"<b>课题介绍</b><br/><br/><br/>广告推荐算法是互联网商业变现的核心驱动力，我们希望借鉴生成式AI的成功思路，探索在广告推荐算法和架构上的颠覆性创新，解锁更大的算法效果提升空间。<br/><br/><br/><b>研究方向</b><br/><br/><br/>基于类Transformer结构的生成式推荐大模型技术，验证广告推荐场景的Scaling Law，探索面向大模型的特征工程以及算法建模范式；<br/><br/><br/>算法和工程协同设计与优化，提升海量数据、超大参数背景下的训练与推理效率。\"},{\"title\": \"LLM 技术在广告模型研究与应用\",\"keywords\": \"LLM广告算法工程师-国际商业产品与技术-筋斗云人才计划\",\"tagImgSrc\": \"https://lf3-static.bytednsdoc.com/obj/eden-cn/bvfnuloguloz/jindouyun/icon/LLM 技术在广告模型研究与应用.png\",\"desc\": \"<b>课题介绍</b><br/><br/><br/>1、面向大规模广告系统的分布式机器学习算法 ，针对海量广告数据，设计高效的分布式广告CTR/CVR预估模型训练算法，探索 LLM 技术在广告算法中的应用；<br/><br/><br/>2、广告系统隐私计算与安全防护，联邦学习在广告点击/转化预估中的研究与应用；<br/><br/><br/>3、探索 AIGC 技术在国际化短视频理解和素材生成的研究与利用。\"},{\"title\": \"因果建模&最优化决策\",\"keywords\": \"算法工程师-用户增长（User Growth）-筋斗云人才计划\",\"tagImgSrc\": \"https://lf3-static.bytednsdoc.com/obj/eden-cn/bvfnuloguloz/jindouyun/icon/因果建模&最优化决策.png\",\"desc\": \"<b>课题介绍</b><br/><br/><br/>团队的核心目标是个性化的对每个用户施加不同的干预行为（包括投放、金币激励等），在给定业务目标下（包括DAU、功能渗透等），最优化相同成本下撬动目标提升的效率。作为一个比较新的工业界算法方向，我们面临大量具有挑战的技术和研究性问题。<br/><br/><br/>因果建模如何从少量的离散的干预行为转为大量的甚至连续的干预行为，或者更进一步从庞大的干预行为空间选择最有效的干预行为组合。<br/><br/><br/>与强化学习的思路结合，优化探索和利用的平衡，通过利用线上观测数据(Observations)降低探索成本，提高对不稳定因果关系的建模能力。<br/><br/><br/>在被决策群体分布不稳定的情况下，构建灵活、稳定且快速的大规模运筹决策算法。\"},{\"title\": \"下一代AI驱动的视频搜索引擎\",\"keywords\": \"算法工程师-搜索-筋斗云人才计划\",\"desc\": \"<b>课题介绍</b><br/><br/><br/>随着LLM的飞速发展，LLM与搜索引擎的结合成为了提升搜索体验和效率的重要方向，用户的需求表达也从纯文本向多模态发展。我们的研究将聚焦于AI在视频搜索引擎中的两大应用方向：<br/><br/><br/>研究方向一：基于RAG的AI搜索<br/><br/><br/>随着Perplexity/GPT等基于Retrieval-Augmented Generation (RAG) 技术的搜索产品崛起，我们看到AI搜索展示出了前所未有的潜力。这类产品利用LLM准确理解用户的自然语言与多模态的需求表达，结合语义与多模态理解能力，利用大模型自身的知识库及对海量索引知识库进行摘要总结，支持多轮交互式搜索。<br/><br/><br/>研究方向二：AI在视频搜索引擎上的应用<br/><br/><br/>搜索引擎在面对复杂的用户需求和海量的信息时，如何提升搜索结果的精确度一直是个挑战。作为领先的视频搜索平台，我们探索通用的、兼顾效果和效率的多模态预训练范式，来大幅提升搜索引擎的多模态理解能力和排序模型的表现。研究内容包括多模态理解、数据增强、训练与推理效率优化等。\"},{\"title\": \"字节电商搜索大规模个性化排序系统\",\"keywords\": \"算法工程师-搜索-筋斗云人才计划\",\"desc\": \"<b>课题介绍</b><br/><br/><br/>字节跳动电商搜索业务覆盖内容电商、货架电商等多种场景，随着用户行为的富集，业界多模态、大模型、图学习等技术的突破，如何在搜索系统中建模用户个性化需求成为一个有意思的课题。需要研究的方向包括：</b><br/><br/><br/>超长行为序列建模：对最长百万长度的内容行为、十万长度的电商行为进行理解和个性化建模。</b><br/><br/><br/>多模态理解：借助多模态大模型的能力，对直播、视频、商品等体裁进行理解，并应用于搜索。</b><br/><br/><br/>图学习：利用Graph Embedding技术，挖掘用户行为间的联系，提升搜索排序。</b><br/><br/><br/>大模型推荐：基于LLM大模型的训练范式，研究在推荐系统中的突破性应用方式。\"},{\"title\": \"超大规模多模态推荐系统\",\"keywords\": \"机器学习系统研发工程师-Data AML-筋斗云人才计划\",\"desc\": \"<b>课题介绍</b><br/><br/><br/>大规模推荐系统正在越来越多的应用到短视频、文本社区、图像等产品上，模态信息在推荐系统中的作用也越来越大。传统模态信息的引入更多是通过 Transfer Learning 等技术导入推荐模型。在字节的部分产品实践中，我们发现模态信息能够很好的作为泛化特征支持推荐等业务场景，端到端的超大规模多模态推荐系统的研究正在变得火热。<br/><br/><br/>在工程角度，挑战也是前所未有的，多模态模型和推荐模型的结合、样本存储、在线推理和离线训练系统的范式也会发生重大的变化。本课题旨在探索超大规模多模态推荐系统中的工程实践方法，研究方向包括：多模态样本的表征、基于 pytorch 框架的高性能多模态推理引擎、高性能多模态训练框架的构建、异构硬件在多模态推荐系统上的应用等。\"},{\"title\": \"基于大系统大算力的超大规模模型建模\",\"keywords\": \"大模型算法研究员（大系统＆大算力）-Data AML-筋斗云人才计划\",\"desc\": \"<b>课题介绍</b><br/><br/><br/>Scaling Law 中模型的性能与计算量、参数量和数据规模三者之间存在着幂律关系。本项目主要侧重算法和系统的CoDesign，对推荐广告模型进行Deep & Wider的超大规模复杂化，为技术长期演进做好准备。主要为设计合理的模型结构验证在2/7 billion参数量下的Scaling Law结论；设计高效的模型结构探索超长序列端到端建模的收益上限；借助Torch系统架构进行文本与ID表征对齐与协同建模；利用混合精度对模型进行极致效率优化，进行算法结合系统、训练结合推理的协同优化。\"}]},{\"domain\": \"AI Safety\",\"direction\": [{\"title\": \"大模型个人数据保护和隐私合规\",\"keywords\": \"隐私计算研究员-隐私创新实验室-筋斗云人才计划\",\"tagImgSrc\": \"https://lf3-static.bytednsdoc.com/obj/eden-cn/bvfnuloguloz/jindouyun/icon/大模型个人数据保护和隐私合规.png\",\"desc\": \"<b>课题介绍</b><br/><br/><br/>大模型的出现为个人数据保护和隐私合规带来了全新的挑战，基于大量的数据和算力资源，大模型吸纳了大量知识、展现智能的同时，也记忆了潜在的敏感数据，为数据安全和个人隐私引入了未知的风险，迫切需要在公认的合规框架下，度量隐私风险，优化大模型的性能、成本、合规之间的平衡。<br/><br/><br/><b>课题挑战</b><br/><br/><br/>目前，大模型相关的隐私风险度量框架缺乏行业和学界共识。现有大模型相关隐私增强训练技术，会对性能和成本带来显著的负面影响。大模型的新型应用，带来了新的合规要求，例如三方API接入的数据泄露保护，AIGC内容溯源、版权保护和三方追责等。\"},{\"title\": \"大模型安全与隐私\",\"keywords\": \"隐私计算研究员-安全与风控-筋斗云人才计划\",\"tagImgSrc\": \"https://lf3-static.bytednsdoc.com/obj/eden-cn/bvfnuloguloz/jindouyun/icon/大模型安全与隐私.png\",\"desc\": \"<b>课题介绍</b><br/><br/><br/>鲁棒与隐私保护的LLM服务：评估现有LLM服务框架中的安全风险，并帮助构建提高安全性和效率的系统。<br/><br/><br/>大模型内生安全的理论与方法：从内在机理与可解释角度，研究大模型隐私泄漏、幻觉、有害输出等行为的作用机制，并探索模型遗忘、主动增强、结构优化等内生安全增强手段。<br/><br/><br/>面向大模型的可实用密态计算：探索在大模型应用场景下，兼具效用与安全的可计算数据加密技术，实现数据资产保护。\"}]},{\"domain\": \"AI for Science\",\"direction\": [{\"title\": \"AI 制药\",\"keywords\": \"科学大模型研究员-ByteDance Research-筋斗云人才计划\",\"tagImgSrc\": \"https://lf3-static.bytednsdoc.com/obj/eden-cn/bvfnuloguloz/jindouyun/icon/AI 制药.png\",\"desc\": \"<b>课题介绍</b><br/><br/><br/>我们利用Al技术进行药物的自动发现和设计，大幅降低药物开发的成本，推动药物开发的范式转移。主要利用深度学习进行大分子药物的设计。<br/><br/><br/><b>课题优势</b><br/><br/><br/>团队在生成式蛋白质设计、蛋白质构象预测以及冷冻电镜解析等领域取得了业界瞩目的成果。<br/><br/><br/>在生成式蛋白质设计方面，团队研发了基于大规模蛋白质语言模型的序列设计方法LM-Design，大幅提高了蛋白质序列设计的准确度与效率；研发了结合扩散模型与语言模型的新一代蛋白质基础模型DPLM，首次全面统一了蛋白质建模、理解与生成；研发了基于偏好优化的抗体设计方法AbDPO，能够设计出同时满足多种性质和能量要求的抗体。<br/><br/><br/>在蛋白质动态构象预测方面，团队研发了ConfDiff等模型，准确预测了蛋白质的构象变化，加深了对蛋白质生物过程的理解，还为新药研发提供了可靠的理论基础。<br/><br/><br/>冷冻电镜解析方面，团队研发了CryoSTAR电镜解析工具，结合人工智能技术和高分辨率成像，极大地提升了生物大分子结构解析的速度和精度。这一技术有助于揭示复杂生物分子体系的构象特征和动态变化，为药物靶点的发现与设计提供了强有力的支持。<br/><br/><br/>团队的研究成果多次发表在ICML、NeurIPS、ICLR等顶级学术会议上，得到学术界和业界的广泛认可。\"},{\"title\": \"量子化学\",\"keywords\": \"AI科学计算研究员-ByteDance Research-筋斗云人才计划\",\"tagImgSrc\": \"https://lf3-static.bytednsdoc.com/obj/eden-cn/bvfnuloguloz/jindouyun/icon/量子化学.png\",\"desc\": \"<b>课题介绍</b><br/><br/><br/>我们使用深度学习、量子嵌入、量子计算等前沿方法对多电子系系统进行物理学第一性原理建模，精确计算分子及晶体的电子结构、以及其他物理化学特性，实现新一代的物理化学技技术。<br/><br/><br/><b>课题优势</b><br/><br/><br/>团队在多个前沿领域深耕多年，包括基于深度学习的第一性原理计算方法和基于量子嵌入的多尺度高精度计算方法。相关研究工作在领域内获得了广泛影响与认可，成果发表在《自然》子刊、Chemical Science、PRL、npj Comput. Mater等国际顶级期刊。团队氛围务实开放，既融入了学界自由讨论和探索的风气，又结合了业界快速迭代和追求极致的理念。我们与国内外多所科研院校紧密合作，共同探索量子科学的边界。\"},{\"title\": \"分子动力学（AML）\",\"keywords\": \"分子动力学/计算化学研究员-AML 科学计算-筋斗云人才计划\",\"tagImgSrc\": \"https://lf3-static.bytednsdoc.com/obj/eden-cn/bvfnuloguloz/jindouyun/icon/分子动力学(AML).png\",\"desc\": \"<b>课题介绍</b><br/><br/><br/>随着算力的指数级增长，复杂生物和材料体系的高精度量化计算和分子动力学模拟成为可能，相关的计算工具、方法快速发展，已经在诸如药物分子的亲和力预测、电解液关键性质预测等方向展现出强大的潜力。我们结合分子动力学模拟、量子化学计算和机器学习技术，寻求在生物、电池材料等科学领域的范式突破，也在实际应用中证明价值。<br/><br/><br/><b>课题挑战</b><br/><br/><br/>探索前沿的分子动力学模拟、增强采样、自由能和其他性质计算方法，并规模化应用在药物和材料发现中发挥作用；<br/><br/><br/>开发高精度的生物、材料力场，包括经验力场和机器学习力场，支持各种复杂体系的精确模拟；<br/><br/><br/>开发高效的DFT计算框架，解决更大和复杂体系的量化计算问题。<br/><br/><br/><b>课题优势</b><br/><br/><br/>利用先进的物理和化学计算方法，结合量子力学，经典力学和机器学习精确的模拟分子之间的相互作用，在药物发现和材料科学中有显著技术优势；<br/><br/><br/>团队成员来自于分子动力学模拟、量子化学、计算材料、高性能计算、机器学习等多样的领域，通过高效协作，融合不同领域知识解决挑战性问题；<br/><br/><br/>充足的计算资源和强大的工程能力，支持海量量化数据生成、方法开发调优、批量模拟应用。\"},{\"title\": \"Scaling AI for Biology and Material\",\"keywords\": \"机器学习研究员-AML 科学计算-筋斗云人才计划\",\"tagImgSrc\": \"https://lf3-static.bytednsdoc.com/obj/eden-cn/bvfnuloguloz/jindouyun/icon/分子动力学(AML).png\",\"desc\": \"<b>课题介绍</b><br/><br/><br/>深度学习正在深刻地影响科学领域，改变传统的科学研究形式。典型案例包括传统Docking工具到生物分子复合物结构预测、经验力场到机器学习力场的演化，筛选和生成模型加速药物发现等。近两年深度学习在不同领域的非凡表现已表明，模型、数据、适用体系的scaling在应对复杂挑战方面具有广泛的有效性。我们探索多维度scaling up来提升计算工具在科学研究中的作用，力求解决科学领域曾被认为无法克服的挑战。 <br/><br/><br/>我们重点关注生物、材料领域，解决其中的挑战性难题：<br/><br/><br/>覆盖多样的生物、材料体系的机器学习力场模型，结合实验数据和大量高精度量子化学数据，解决性质预测问题；<br/><br/><br/>生物场景蛋白、核酸、有机小分子等体系的通用模型，解决结构预测、构象生成、性质预测、药物设计等问题；<br/><br/><br/>结合大语言模型和多模态能力，解决生物、材料领域的实际挑战；<br/><br/><br/>在上述关键问题和技术路径之间寻找关联，探索构建统一模型的机会。<br/><br/><br/>团队成员来自于机器学习、分子动力学模拟、量子化学、计算材料、高性能计算等多样的领域，深入结合领域insight和机器学习，团队协作解决有挑战的真实问题；<br/><br/><br/>在分子建模、Docking、构象预测、机器学习力场等技术方向，以及制药、材料等应用方向上的持续积累；<br/><br/><br/>充足的计算资源和强大的工程能力，支持数据、模型的Scaling Up，追求极致效果。\"}]},{\"domain\": \"机器人\",\"direction\": [{\"title\": \"机器人研究\",\"keywords\": \"下一代智能机器人技术和新产品\",\"tagImgSrc\": \"https://lf3-static.bytednsdoc.com/obj/eden-cn/bvfnuloguloz/jindouyun/icon/机器人研究.png\",\"desc\": \"<b>课题介绍</b><br/><br/><br/>我们的使命是研究攻克下一代智能机器人最挑战的技术，重点聚焦在机器人基础模型、智能感知-操作-交互方面，研发业界最领先的技术，孵化下一代智能机器人系统。<br/><br/><br/><b>课题优势</b><br/><br/><br/>由世界顶尖的机器人科学家和工程师组成，面向下一代机器人研究最前沿、最关键的基础问题，并进行规模化应用拓展。团队在数据、算力和软硬件上具备优势，在机器人基础模型、智能感知-操作-交互上研发一系列世界级引领性技术，打造通用机器人和学习系统。我们期待对机器人研究有热情并有相关经验的优秀博士生加入。\"},{\"title\": \"机器人产业化\",\"keywords\": \"下一代智能机器人技术和新产品\",\"tagImgSrc\": \"https://lf3-static.bytednsdoc.com/obj/eden-cn/bvfnuloguloz/jindouyun/icon/量子化学.png\",\"desc\": \"<b>课题介绍</b><br/><br/><br/>我们聚焦于实现在实际场景中真正可用的机器人产品，通过实际业务驱动，在复杂的机器人与人共存的环境中，打造软硬件与算法领先的高智能机器人。<br/><br/><br/><b>课题优势</b><br/><br/><br/>完善的软硬件基础，包括且不限于感知，定位，重建，规划等全链条的机器人核心算法积累，在实际场景和数据中进行最新算法的探索。\"}]},{\"domain\": \"视频架构\",\"direction\": [{\"title\": \"基于多模态大模型的画质理解和增强\",\"keywords\": \"多模态大模型算法研究员（多媒体方向）-视频架构-筋斗云人才计划\",\"tagImgSrc\": \"https://lf3-static.bytednsdoc.com/obj/eden-cn/bvfnuloguloz/jindouyun/icon/游戏、云游戏引擎性能优化.png\",\"desc\": \"<b>课题介绍</b><br/><br/><br/>随着4K、HDR等技术成为主流标准，消费者对视频画质的要求日益提升。然而，视频在拍摄、传输和压缩过程中，画质往往受损，影响观看体验。此外，多模态大模型的快速发展为理解和生成高质量视频内容提供了新的思路，也提出了多项技术挑战。<br/><br/><br/>画质退化以及人眼感知：利用多模态大模型，深入分析视频内容的画质退化问题，研究人眼对色彩、帧率、清晰度等画质维度的感知能力，从而使得画质增强对退化的处理更为智能，增强的结果更符合人眼主观。<br/><br/><br/>生成式画质增强：利用生成式大模型的先验信息，大幅提升画质增强的效果天花板，并且解决生成伪像、生成保真度、生成稳定性等当前生成式算法存在的问题。<br/><br/><br/>视频时域任务：研究画质理解和增强在视频上的拓展，包括时域信息表征建模，时域退化理解，时域画质增强连续性，时域推理加速等。<br/><br/><br/>用户视角的验证：在大规模用户环境中，从用户的实际观看体验出发，验证画质增强算法的有效性和用户满意度。\"},{\"title\": \"新一代视频编码技术\",\"keywords\": \"视频编解码标准研究员-视频架构-筋斗云人才计划\",\"tagImgSrc\": \"https://lf3-static.bytednsdoc.com/obj/eden-cn/bvfnuloguloz/jindouyun/icon/新一代视频编码技术.png\",\"desc\": \"<b>课题介绍</b><br/><br/><br/>视频压缩编码技术是多媒体应用的核心。随着短视频应用的爆炸性增长，网络视频传输量激增，带宽压力倍增，视频压缩技术的重要性凸显。H.266/VVC已问世4年，但其压缩效率逐渐不能满足需求，对新一代编码技术的探索成为行业焦点。<br/><br/><br/>传统视频编码技术已有半个世纪的发展，编码工具非常成熟。H.266/VVC之后，提升编码效率变得极其困难，有人认为当前技术已接近传统框架的极限。如何在H.266/VVC的基础上，以可接受的复杂度进一步提高压缩效率是挑战。随着深度学习技术的发展，智能编码进入视频压缩领域。面对传统编码框架的瓶颈，有学者提出用深度学习进行视频压缩。智能编码一问世便受重视，部分场景下已超越H.266/VVC。然而，智能编码在许多应用场景下效率不如传统编码，运算复杂，缺乏跨平台兼容性和标准化等问题。因此，克服这些挑战，提高压缩效率，同时保持复杂度在可接受范围内是未来的重要研究方向。\"}]},{\"domain\": \"工程架构\",\"direction\": [{\"title\": \"面向LLM的下一代智能云基础架构\",\"keywords\": \"智能系统研究员 - 基础架构应用研究中心- 筋斗云人才计划\",\"tagImgSrc\": \"https://lf3-static.bytednsdoc.com/obj/eden-cn/bvfnuloguloz/jindouyun/icon/面向LLM的下一代智能云基础架构.png\",\"desc\": \"<b>课题介绍</b><br/><br/><br/>字节跳动应用研究中心致力于智能基础架构的创新研究和落地，主要包括两方面：一是自动化和智能化管理基础架构各系统生命周期，以提升系统性能、降低运行成本为主要目标，深度融合人工智能与基础架构关键系统，建设大规模工业级self-driving infra平台；二是构建下一代云计算和机器学习基础设施。<br/><br/><br/>针对新涌现的LLM应用场景，在基础架构各个领域进行前沿技术创新。并与字节工程团队密切合作，设计和开发高性价比且简单易用的下一代大模型基础架构，为火山引擎奠定技术与业务增长基础。\"}]},{\"domain\": \"隐私与安全、硬件\",\"direction\": [{\"title\": \"可信机密计算\",\"keywords\": \"机密计算研究员-安全与风控-筋斗云人才计划\",\"tagImgSrc\": \"https://lf3-static.bytednsdoc.com/obj/eden-cn/bvfnuloguloz/jindouyun/icon/可信机密计算.png\",\"desc\": \"<b>课题介绍</b><br/><br/><br/>可扩展、实用、可验证和可用的分布式机密计算：帮助开发包含异构设备/硬件（包括TEE和非TEE）的分布式机密计算框架，同时保持高性能和安全性。<br/><br/><br/>增强的TEE系统：帮助构建系统以解决现有TEE中的固有漏洞，例如侧信道攻击、I/O操作、回滚攻击等。<br/><br/><br/>Oblivious Dual RAM的理论与实践：简单、高效、通用的ORAM技术，防止访问模式泄漏，从而增强TEE的安全设计。<br/><br/><br/>隐私与机密数据库：结合系统优化和硬件加密以实现高性能和合规性，最大限度地减少对开发人员的代码侵入性。\"},{\"title\": \"大规模高性能隐私计算\",\"keywords\": \"隐私计算研究员-安全与风控-筋斗云人才计划\",\"tagImgSrc\": \"https://lf3-static.bytednsdoc.com/obj/eden-cn/bvfnuloguloz/jindouyun/icon/大规模高性能隐私计算.png\",\"desc\": \"<b>课题介绍</b><br/><br/><br/>大规模异步联邦学习：研究百亿～千亿级别样本的高性能、高可靠、可扩展异步联邦学习算法与框架。<br/><br/><br/>面向海量数据的高性能安全计算：探索百亿～千亿量级数据查询与学习场景中，时间、空间、通信最优的安全计算算法、范式以及系统框架（如存储、通信、调度等）。<br/><br/><br/>基于硬件的高性能密码算法与架构：探索结合加速硬件和可信硬件的密码算法与协议实现，构建新型信任模型，实现高性能安全密态计算。\"},{\"title\": \"AI 芯片的架构/物理实现和系统设计\",\"keywords\": \"芯片研发-筋斗云人才计划\",\"tagImgSrc\": \"https://lf3-static.bytednsdoc.com/obj/eden-cn/bvfnuloguloz/jindouyun/icon/AI芯片的架构和系统设计.png\",\"desc\": \"<b>课题介绍</b><br/><br/><br/>探索电路、SoC和算法的协同架构，负责创新架构和系统设计；与硬件设计团队合作，实现高协同的架构和系统设计。\"}]}]},\"mentors\": [{\"avatar\": \"https://lf3-static.bytednsdoc.com/obj/eden-cn/bvfnuloguloz/jindouyun/people/李航.png\",\"name\": \"李航\",\"story1\": \"字节跳动研究部门负责人。ACM Fellow, ACL Fellow, IEEE Fellow。京都大学毕业，东京大学博士。主要研究方向为自然语言处理、信息检索、机器学习、数据挖掘。\",\"notShowExpendBtn\": true},{\"avatar\": \"https://lf3-static.bytednsdoc.com/obj/eden-cn/bvfnuloguloz/jindouyun/people/吴烨.png\",\"name\": \"吴烨\",\"story1\": \"字节跳动安全研究团队负责人。博士毕业于美国 Stevens Institute of Technology 计算机科学系。主要研究领域包括隐私计算、可信计算、网络与系统安全、程序语言理论安全等。加入字节跳动前，曾担任业内头部公司主任架构师、创业公司联合创始人及首席科学家等职务。在学术界，曾先后兼任中国密码学会•大数据与人工智能安全专委会委员、中国中文信息学会•大数据安全与隐私计算专委会副主任委员、西安电子科技大学兼职教授、博士生导师，曾入选南京大学百位名师邀约计划等。\"},{\"avatar\": \"https://lf3-static.bytednsdoc.com/obj/eden-cn/bvfnuloguloz/jindouyun/people/孔涛.png\",\"name\": \"孔涛\",\"story1\": \"字节跳动机器人研究负责人，致力于研发孵化下一代智能机器人。博士毕业于清华大学计算机系，在机器人和人工智能领域发表论文50余篇，多篇论文入选Google Scholar Metrics Most Influential Papers，总引用超过1万次。开源算法被权威框架引入为标准算子，广泛影响了社区工作。曾获2023年中国自动化学会自然科学一等奖、2023年全球前2%顶尖科学家、2022年 Habitat 国际机器人导航大赛冠军以及2016年IROS机器人“自主抓取与操作”比赛冠军等荣誉。担任NeurIPS等会议的领域主席，CCF智能机器人专委常委。\"},{\"avatar\": \"https://lf3-static.bytednsdoc.com/obj/eden-cn/bvfnuloguloz/jindouyun/people/顾全全.png\",\"name\": \"顾全全\",\"story1\": \"字节跳动研究院人工智能药物设计部门负责人，加州大学洛杉矶分校计算机系副教授。研究领域涵盖人工智能和机器学习，主要关注非凸优化、深度学习、强化学习、大型语言模型和深度生成模型等。近期，持续关注利用人工智能推动生物学、医学、化学和公共卫生等领域的科学发现。清华大学学士、硕士，2014年，于伊利诺伊大学香槟分校获得计算机科学博士学位。曾获斯隆研究奖、美国国家科学基金会职业生涯奖、西蒙斯伯克利研究奖学金等多个重要研究奖项。他在 JMLR, COLT, ICML, NeurIPS, ICLR, AAAI等国际顶级机器学习会议上发表了200多篇论文。他长期担任 JMLR, 人工智能杂志, JAIR和 PLOSOne的编委，以及 COLT, ICML, NeurIPS, ICLR, AISTATS, UAI和AAAI 等国际顶级会议的（高级）领域主席。\"},{\"avatar\": \"https://lf3-static.bytednsdoc.com/obj/eden-cn/bvfnuloguloz/jindouyun/people/吕定顺.png\",\"name\": \"吕定顺\",\"story1\": \"清华大学交叉信息研究院博士，字节跳动ByteDance Research，量子计算化学研究员，在 Nature Physics, Nature Communication, PRX, PRLChemical Science, npj Comuputational Materials, JCTC, JPCLQST, PRA等国际知名期刊发表论文10余篇，在公司主导申请10+专利。研究领域包括量子计算化学，大规模量子化学模拟，复杂强关联体系模拟等。参与开源软件PySCF, IPIE 等相关模块的GPU优化和代码重构。\"},{\"avatar\": \"https://lf3-static.bytednsdoc.com/obj/eden-cn/bvfnuloguloz/jindouyun/people/任维络.png\",\"name\": \"任维络\",\"story1\": \"字节跳动研究院算法研究员，中国科学技术大学学士，斯坦福大学博士，专注于AI for Science领域。将人工智能方法运用于量子化学研究，成果发表于 \\\"Nature Machine Inteligence\\\" \\\"Nature Communications\\\" 等国际顶尖期刊。相关开源代码与工具也在领域内获得广泛关注与使用。\"},{\"avatar\": \"https://lf3-static.bytednsdoc.com/obj/eden-cn/bvfnuloguloz/jindouyun/people/陈建军.png\",\"name\": \"陈建军\",\"story1\": \"字节跳动基础设施系统实验室负责人，带领一支由顶尖研究人员和软件工程师组成的团队，致力于基础设施系统相关领域的前沿技术研究。他是经验丰富的数据库专家，拥有超过20年的研发和技术领导经验。于2001年，在威斯康星大学麦迪逊分校计算机科学系获得博士学位，师从David DeWitt教授，因在博士论文研究中开创性的可扩展连续查询处理工作，于2010年获得了SIGMOD十年时间考验奖。\"},{\"avatar\": \"https://lf3-static.bytednsdoc.com/obj/eden-cn/bvfnuloguloz/jindouyun/people/张铁赢.png\",\"name\": \"张铁赢\",\"story1\": \"字节跳动 AI for Infra 方向负责人。卡内基梅隆大学计算机系博士后研究员，研究方向为 AI for System 和 System for AI。在 SIGMOD, VLDB, ICDE, FAST 等数据和系统顶会发表了数十篇论文，是 USENIX ATC, VLDB, ICDE, ICDM（领域主席）等顶会的常年 PC，CCF 数据库专委和 CCF 大数据专委执行委员。\"},{\"avatar\": \"https://lf3-static.bytednsdoc.com/obj/eden-cn/bvfnuloguloz/jindouyun/people/颜文.png\",\"name\": \"颜文\",\"story1\": \"字节跳动AML科学计算团队研究员，负责量化/材料/生物方向结合的HPC算法、AI基础模型及分子动力学应用相关工作。清华大学学士，加州理工学院（Caltech）博士，长期从事凝聚态、软物质、生物物理、材料等方向的科学研究与HPC/AI算法开发工作。\"},{\"avatar\": \"https://lf3-static.bytednsdoc.com/obj/eden-cn/bvfnuloguloz/jindouyun/people/HaoyuYu.png\",\"name\": \"Haoyu Yu\",\"story1\": \"明尼苏达大学计算化学博士，在明尼苏达大学期间，他与导师Donald Truhlar共同开发了密度泛函方法MN15和MN15L，这些方法在各大计算化学软件中得到了广泛应用。他在计算化学相关期刊上发表了30余篇论文，总引用次数超过2500次。目前，在 AI for Science 组内带领团队开发小分子药物结合能预测平台。\"},{\"avatar\": \"https://lf3-static.bytednsdoc.com/obj/eden-cn/bvfnuloguloz/jindouyun/people/陈心诗.png\",\"name\": \"陈心诗\",\"story1\": \"美国佐治亚理工学院机器学习博士，2020 Google PhD Fellowship。博士期间在ICML、NeurIPS、ICLR等顶级会议上发表十余篇文章。毕业后加入字节跳动，深入生物方向的真实数据与实际场景，推动分子性质预测、分子对接、结构预测、构象生成等方向的前沿研究与技术落地。\"},{\"avatar\": \"https://lf3-static.bytednsdoc.com/obj/eden-cn/bvfnuloguloz/jindouyun/people/陈敬伍.png\",\"name\": \"陈敬伍 \",\"story1\": \"字节跳动AI产品推荐业务负责人，毕业于中科院计算所机器学习与数据挖掘实验室(MLDM)，现负责Flow AI产品、汽水音乐产品的推荐业务。ACM ICPC金牌选手，曾获国际数据挖掘竞赛冠军，在数据挖掘/信息检索领域顶会中发表多篇论文。2019年毕业加入字节跳动，先后在今日头条、西瓜视频、番茄小说、抖音、Flow等业务线负责重要产品和模块。率先在公司上线并推广UCB、Meta Init等冷启动技术方案，在各端多业务取得收益上线。\"}]}}","mobile_background":"https://lf3-cdn-tos.bytescm.com/obj/ttfe/atsx/Lark20190806-145804-ch_1568786794466.png","mobile_banner":"https://lf3-cdn-tos.bytescm.com/obj/eden-cn/lprupeh7nupfuhsbd/school/banner_mobile_ lvetica Neue', Helvetica, Arial, sans-serif, 'Roboto', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol'; color: #1f2329; word-wrap: break-word; white-space: pre-wrap;\\\"><p style=\\\"font-size: 14px; text-align: left;\\\">&nbsp;&nbsp;The base monthly pay range for this position in the selected city is \"},{\"type\":\"var\",\"value\":\"atsx_var_job_object_7581817186706426117\"},{\"type\":\"text\",\"value\":\" PLN to \"},{\"type\":\"var\",\"value\":\"atsx_var_job_object_7581817186706458885\"},{\"type\":\"text\",\"value\":\" PLN.<span>&#8203;</span></p><p style=\\\"font-size: 14px; text-align: left;\\\">&nbsp;&nbsp;Compensation may vary depending on a number of factors, including a candidate’s qualifications, skills, competencies and experience, and location. Base pay is one part of the Total Package that is provided to compensate and recognize employees for their work, and this role may be eligible for additional discretionary bonuses/incentives, and restricted stock units.<span>&#8203;</span></p><p style=\\\"font-size: 14px; text-align: left;\\\">&nbsp;&nbsp;In line with our company philosophy and commitment to equal treatment, our Total Rewards package in Poland is designed to ensure fairness, transparency, and employee wellbeing. The benefits offered are competitive within the local market, aligned with statutory requirements and best practices, and may vary depending on the nature of employment.<span>&#8203;</span></p><p style=\\\"font-size: 14px; text-align: left;\\\">&nbsp;&nbsp;As part of our benefits package, we offer comprehensive supplementary health insurance for you and your eligible dependants, covering the cost of private treatment for acute conditions. We also provide life cover which offers a lump-sum payment which will be a percentage of your gross monthly salary (depending on the nature of death) in the event of your death whilst in employment with ByteDance. In addition, our Employee Assistance Programme (EAP) offers 24/7 access to confiden ":{"type":"long_text_with_template","settings":{"disabled_by_switch":null,"display_config":{"config_type":1,"condition_list":[{"condition_type":3,"object_id":"7470145241187158290","value_list":["11","12"]}]},"long_text_template":"{\"type\":\"block\",\"value\":[{\"type\":\"text\",\"value\":\"<div class=\\\"editor-content\\\" style=\\\"font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif, 'Roboto', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol'; color: #1f2329; word-wrap: break-word; white-space: pre-wrap;\\\"><p style=\\\"font-size: 14px; text-align: left;\\\">Content that this role interacts with includes images, video, and text related to every-day life, but it can also include (but is not limited to) bullying; hate speech; child safety; depictions of harm to self and others, and harm to animals. Hence, it is possible that this role will be exposed to harmful content on a daily basis. <span>&#8203;</span></p><p style=\\\"font-size: 14px; text-align: left;\\\"><span>&#8203;</span></p><p style=\\\"font-size: 14px; text-align: left;\\\">TikTok recognises that keeping our platform safe for the TikTok communities is no ordinary job which can be both rewarding and psychologically demanding and emotionally taxing for some. This is why we are sharing the potential hazards, risks and implications in this unique line of work from the start, so our candidates are well informed before joining. <span>&#8203;</span></p><p style=\\\"font-size: 14px; text-align: left;\\\"><span>&#8203;</span></p><p style=\\\"font-size: 14px; text-align: left;\\\">We are committed to the wellbeing of all our employees and promise to provide comprehensive and evidence-based programs, to promote and support physical and mental wellbeing throughout each employee's journey with us. We believe that wellbeing is a relationship and that everyone has a part to play, so we work in collaboration and consultation with our employees and across our functions in order to ensure a truly person-centred, innovative and integrated approach.<span>&#8203;</span></p></div>\"}]}","front_end_long_text_template":"{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"attrs\":{\"align\":\"left\"},\"content\":[{\"type\":\"text\",\"text\":\"Content that this role interacts with includes images, video, and text related to every-day life, but it can also include (but is not limited to) bullying; hate speech; child safety; depictions of harm to self and others, and harm to animals. Hence, it is possible that this role will be exposed to harmful content on a daily basis. \"}]},{\"type\":\"paragraph\",\"attrs\":{\"align\":\"left\"}},{\"type\":\"paragraph\",\"attrs\":{\"align\":\"left\"},\"content\":[{\"type\":\"text\",\"text\":\"TikTok recognises that keeping our platform safe for the TikTok communities is no ordinary job which can be both rewarding and psychologically demanding and emotionally taxing for some. This is why we are sharing the potential hazards, risks and implications in this unique line of work from the start, so our candidates are well informed before joining. \"}]},{\"type\":\"paragraph\",\"attrs\":{\"align\":\"left\"}},{\"type\":\"paragraph\",\"attrs\":{\"align\":\"left\"},\"content\":[{\"type\":\"text\",\"text\":\"We are committed to the wellbeing of all our employees and promise to provide comprehensive and evidence-based programs, to promote and support physical and mental wellbeing throughout each employee's journey with us. We believe that wellbeing is a relationship and that everyone has a part to play, so we work in collaboration and consultation with our employees and across our functions in order to ensure a truly person-centred, innovative and integrated approach.\"}]}]}"}},"is_customized":true,"name":{"zh_cn":"Trust & Safety ","en_us":"Trust & Safety","i18n_name":"Trust & Safety "},"parent":"6893403892125206798","active_status":1,"permissions"  Xigua, ByteDance has made it easier and more fun for people to connect with, consume, and create content.<span>&#8203;</span></p><p style=\\\"font-size: 14px; text-align: left;\\\"><span>&#8203;</span></p><p style=\\\"font-size: 14px; text-align: left;\\\">ByteDance is a part of a global internet technology group operating a range of content platforms, including TikTok, that inform, educate, entertain and inspire people across languages, cultures and geographies.<span>&#8203;</span></p></div>\"}]}","front_end_long_text_template":"{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"attrs\":{\"align\":\"left\"},\"content\":[{\"type\":\"text\",\"text\":\"Founded in 2012, ByteDance's mission is to inspire creativity and enrich life. With a suite of more than a dozen products, including TikTok, Lemon8, CapCut and Pico as well as platforms specific to the China market, including Toutiao, Douyin, and Xigua, ByteDance has made it easier and more fun for people to connect with, consume, and create content.\"}]},{\"type\":\"paragraph\",\"attrs\":{\"align\":\"left\"}},{\"type\":\"paragraph\",\"attrs\":{\"align\":\"left\"},\"content\":[{\"type\":\"text\",\"text\":\"ByteDance is a part of a global internet technology group operating a range of content platforms, including TikTok, that inform, educate, entertain and inspire people across languages, cultures and geographies.\"}]}]}"}},"is_customized":true,"name":{"zh_cn":"About ByteDance Phillipines","en_us":"About ByteDance Phillipines","i18n_name":"About ByteDance Phillipines"},"parent":"6893403892125206798","active_status":1,"permissions":{"can_edit_required":false,"can_edit_order":true,"can_edit_name":true,"can_edit_active_status":true,"can_edit_select":false,"can_edit":true}},"children_list":null},{"object_id":"7470375955128207624","attributes":{"required":false,"visible":false,"field_type":{"type":"long_text_with_template","settings":{"disabled_by_switch":null,"display_config":{"config_type":1,"condition_list":[{"condition_type":3,"object_id":"7470145241187158290","value_list":["6","12"]}]},"long_text_template":"{\"type\":\"block\",\"value\":[{\"type\":\"text\",\"value\":\"<div class=\\\"editor-content\\\" style=\\\"font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif, 'Roboto', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol'; color: #1f2329; word-wrap: break-word; white-space: pre-wrap;\\\"><p style=\\\"font-size: 14px; text-align: left;\\\">TikTok USDS Joint Venture LLC is dedicated to the safety and security of millions of Americans who create, discover, and connect with what they love on the apps we operate. The Joint Venture has been established in compliance with the Executive Order signed by President Trump on September 25, 2025. Our foundation is a comprehensive data privacy and cybersecurity program we operate under defined safeguards to protect national security and secure U.S. user data, apps and the algorithm. We safeguard the U.S. content ecosystem, holding decision-making authority for trust and safety policies and moderation. USDS Joint Venture helps ensure Americans can continue to express their creativity, discover new hobbies and interests, and build thriving communities and businesses on a global scale.<span>&#8203;</span></p><p style=\\\"font-size: 14px; text-align: left;\\\"><span>&#8203;</span></p><p style=\\\"font-size: 14px; text-align: left;\\\">On-site presence across teams allows the company to operate with greater speed, alignment, and agility — especially in areas like real-time decision-making, team development, and integrated execution. As such, the company is shifting from a hybrid work model to a fully in-person schedule up to 5 days a week.<span>&#8203;</span></p></div>\"}]}","front_end_long_text_template":"{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"attrs\":{\"align\":\"left\"},\"content\":[{\"type\":\"text\",\"text\":\"TikTok USDS Joint Venture LLC is dedicated to the safety and security of millions of Americans who create, discover, and connect with what they love on the apps we operate. The Joint Venture has been established in compliance with the Executive Order signed by President Trump on September 25, 2025. Our foundation is a comprehensive data privacy and cybersecurity program we operate under defined safeguards to protect national security and secure U.S. user data, apps and the algorithm. We safeguard the U.S. content ecosystem, holding decision-making authority for trust and safety policies and moderation. USDS Joint Venture helps ensure Americans can continue to express their creativity, discover new hobbies and interests, and build thriving communities and businesses on a global scale.\"}]},{\"type\":\"paragraph\",\"attrs\":{\"align\":\"left\"}},{\"type\":\"paragraph\",\"attrs\":{\"align\":\"left\"},\"content\":[{\"type\":\"text\",\"text\":\"On-site presence across teams allows the company to operate with greater speed, alignment, and agility — especially in areas like real-time decision-making, team development, and integrated execution. As such, the company is shifting from a hybrid work model to a fully in-person schedule up to 5 days a week.\"}]}]}"}},"is_customized":true,"name":{"zh_cn":"About USDS","en_us":"About USDS","i18n_name":"About USDS"},"parent":"6893403892125206798","active_status":1,"permissions":{"can_edit_required":false,"can_edit_order":true,"can_edit_name":true,"can_edit_active_status":true,"can_edit_select":false,"can_edit":true}},"children_list":null},{"object_id":"7470375955128224008","attributes":{"required":false,"visible":false,"field_type":{"type":"long_text_with_template","settings":{"disabled_by_switch":null,"display_config":{"config_type":1,"condition_list":[{"condition_type":3,"object_id":"7470145241187158290","value_list":["7"]}]},"long_text_template":"{\"type\":\"block\",\"value\":[{\"type\":\"text\",\"value\":\"<div class=\\\"editor-content\\\" style=\\\"font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif, 'Roboto', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol'; color: #1f2329; word-wrap: break-word; white-space: pre-wrap;\\\"><p style=\\\"font-size: 14px; text-align: left;\\\">Established in 2023, the ByteDance Seed team is dedicated to pioneering new paths toward artificial general intelligence. We aspire to advance the frontier of intelligence to drive progress for both technology and society.<span>&#8203;</span></p><p style=\\\"font-size: 14px; text-align: left;\\\"><span>&#8203;</span></p><p style=\\\"font-size: 14px; text-align: left;\\\">With a long-term vision for the AI sector, the Seed team's research spans MLLM, GenMedia, AI for Science, and Robotics. We maintain a global presence with laboratories and career opportunities across China, Singapore, and the United States. To date, we have launched industry-leading general foundation models and cutting-edge multimodal capabilities. Our technology powers over 50 application scenarios — including Doubao, Jimeng, TRAE, Dola and Dreamnia — and serves enterprise customers through Volcano Engine and BytePlus. Third-party data shows that the Doubao App ranks first in user volume in the Chinese market, while Doubao foundation models lead the industry in average daily token consumption.<span>&#8203;</span></p></div>\"}]}","front_end_long_text_template":"{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"attrs\":{\"align\":\"left\"},\"content\":[{\"type\":\"text\",\"text\":\"Established in 2023, the ByteDance Seed team is dedicated to pioneering new paths toward artificial general intelligence. We aspire to advance the frontier of intelligence to drive progress for both technology and society.\"}]},{\"type\":\"paragraph\",\"attrs\":{\"align\":\"left\"}},{\"type\":\"paragraph\",\"attrs\":{\"align\":\"left\"},\"content\":[{\"type\":\"text\",\"text\":\"With a long-term vision for the AI sector, the Seed team's research spans MLLM, GenMedia, AI for Science, and Robotics. We maintain a global presence with laboratories and career opportunities across China, Singapore, and the United States. To date, we have launched industry-leading general foundation models and cutting-edge multimodal capabilities. Our technology powers over 50 application scenarios — including Doubao, Jimeng, TRAE, Dola and Dreamnia — and serves enterprise customers through Volcano Engine and BytePlus. Third-party data shows that the Doubao App ranks first in user volume in the Chinese market, while Doubao foundation models lead the industry in average daily token consumption.\"}]}]}"}},"is_customized":true,"name":{"zh_cn":"About Doubao (Seed)","en_us":"About Doubao (Seed)","i18n_name":"About Doubao (Seed)"},"parent":"6893403892125206798","active_status":1,"permissions":{"can_edit_required":false,"can_edit_order":true,"can_edit_name":true,"can_edit_active_status":true,"can_edit_select":false,"can_edit":true}},"children_list":null},{"object_id":"7470375955128240392","attributes":{"required":false,"visible":false,"field_type":{"type":"long_text_with_template","settings":{"disabled_by_switch":null,"display_config":{"config_type":1,"condition_list":[{"condition_type":3,"object_id":"7470145241187158290","value_list":["8"]}]},"long_text_template":"{\"type\":\"block\",\"value\":[{\"type\":\"text\",\"value\":\"<div class=\\\"editor-content\\\" style=\\\"font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif, 'Roboto', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol'; color: #1f2329; word-wrap: break-word; white-space: pre-wrap;\\\"><p style=\\\"font-size: 14px; text-align: left;\\\">Lemon8 is a social media platform that offers lifestyle-focused content spanning fashion, beauty, travel and more. It brings together we create value for our communities, inspire creativity and enrich life - a mission we work towards every day.<span>&#8203;</span></p><p style=\\\"font-size: 14px; text-align: left;\\\">As ByteDancers, we strive to do great things with great people. We lead with curiosity, humility, and a desire to make impact in a rapidly growing tech company. By constantly iterating and fostering an \\\"Always Day 1\\\" mindset, we achieve meaningful breakthroughs for ourselves, our Company, and our users. When we create and grow together, the possibilities are limitless. Join us.<span>&#8203;</span></p><p style=\\\"font-size: 14px; text-align: left;\\\">Diversity &amp; Inclusion<span>&#8203;</span></p><p style=\\\"font-size: 14px; text-align: left;\\\">ByteDance is committed to creating an inclusive space where employees are valued for their skills, experiences, and unique perspectives. Our platform connects people from across the globe and so does our workplace. At ByteDance, our mission is to inspire creativity and enrich life. To achieve that goal, we are committed to celebrating our diverse voices and to creating an environment that reflects the many communities we reach. We are passionate about this and hope you are too.<span>&#8203;</span></p></div>\"}]}","front_end_long_text_template":"{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"attrs\":{\"align\":\"left\"},\"content\":[{\"type\":\"text\",\"text\":\"Inspiring creativity is at the core of ByteDance's mission. Our innovative products are built to help people authentically express themselves, discover and connect – and our global, diverse teams make that possible. Together, we create value for our communities, inspire creativity and enrich life - a mission we work towards every day.\"}]},{\"type\":\"paragraph\",\"attrs\":{\"align\":\"left\"},\"content\":[{\"type\":\"text\",\"text\":\"As ByteDancers, we strive to do great things with great people. We lead with curiosity, humility, and a desire to make impact in a  limitless. Join us.<span>&#8203;</span></p><p style=\\\"font-size: 14px; text-align: left;\\\"><span>&#8203;</span></p><p style=\\\"font-size: 14px; text-align: left;\\\">Diversity &amp; Inclusion<span>&#8203;</span></p><p style=\\\"font-size: 14px; text-align: left;\\\">TikTok is committed to creating an inclusive space where employees are valued for their skills, experiences, and unique perspectives. Our platform connects people from across the globe and so does our workplace. At TikTok, our mission is to inspire creativity and bring joy. To achieve that goal, we are committed to celebrating our diverse voices and to creating an environment that reflects the many communities we reach. We are passionate about this and hope you are too.<span>&#8203;</span></p></div>\"}]}","front_end_long_text_template":"{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"attrs\":{\"align\":\"left\"},\"content\":[{\"type\":\"text\",\"text\":\"Inspiring creativity is at the core of TikTok's mission. Our innovative product is built to help people authentically express themselves, discover and connect – and our global, diverse teams make that possible. Together, we create value for our communities, inspire creativity and bring joy - a mission we work towards every day.\"}]},{\"type\":\"paragraph\",\"attrs\":{\"align\":\"left\"},\"content\":[{\"type\":\"text\",\"text\":\"We strive to do great things with great people. We lead with curiosity, humility, and a desire to make impact in a rapidly growing tech company. Every challenge is an opportunity to learn and innovate as one team. We're resilient and embrace challenges as they come. By constantly iterating and fostering an \\\"Always Day 1\\\" mindset, we achieve meaningful breakthroughs for ourselves, our company, and our users. When we create and grow together, the possibilities are limitless. Join us.\"}]},{\"type\":\"paragraph\",\"attrs\":{\"align\":\"left\"}},{\"type\":\"paragraph\",\"attrs\":{\"align\":\"left\"},\"content\":[{\"type\":\"text\",\"text\":\"Diversity & Inclusion\"}]},{\"type\":\"paragraph\",\"attrs\":{\"align\":\"left\"},\"content\":[{\"type\":\"text\",\"text\":\"TikTok is committed to creating an inclusive space where employees are valued for their skills, experiences, and unique perspectives. Our platform connects people from across the globe and so does our workplace. At TikTok, our mission is to inspire creativity and bring joy. To achieve that goal, we are committed to celebrating our diverse voices and to creating an environment that reflects the many communities we reach. We are passionate about this and hope you are too.\"}]}]}"}},"is_customized":true,"name":{"zh_cn":"Why Join Us","en_us":"Why Join Us","i18n_name":"Why Join Us"},"parent":"6893403892125206798","active_status":1,"permissions":{"can_edit_required":false,"can_edit_order":true,"can_edit_name":true,"can_edit_active_status":true,"can_edit_select":false,"can_edit":true}},"children_list":null},{"object_id":"7470407698154309896","attributes":{"required":false,"visible":false,"field_type":{"type":"long_text_with_template","settings":{"disabled_by_switch":null,"display_config":{"config_type":1,"condition_list":[{"condition_type":3,"object_id":"7470145241187158290","value_list":["10"]}]},"long_text_template":"{\"type\":\"block\",\"value\":[{\"type\":\"text\",\"value\":\"<div class=\\\"editor-content\\\" style=\\\"font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif, 'Roboto', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol'; color: #1f2329; word-wrap: break-word; white-space: pre-wrap;\\\"><p style=\\\"font-size: 14px; text-align: left;\\\">Content that this role interacts with includes images, video, and text related to every-day life, but it can also include (but is not limited to) bullying; hate speech; child safety; depictions of harm to self and others, and harm to animals. Hence, it is possible that this role will be exposed to harmful content on a daily basis.<span>&#8203;</span></p><p style=\\\"font-size: 14px; text-align: left;\\\"><span>&#8203;</span></p><p style=\\\"font-size: 14px; text-align: left;\\\">ByteDance recognises that keeping our platform safe for the ByteDance communities is no ordinary job which can be both rewarding and psychologically demanding and emotionally taxing for some. This is why we are sharing the potential hazards, risks and implications in this unique line of work from the start, so our candidates are well informed before joining.<span>&#8203;</span></p><p style=\\\"font-size: 14px; text-align: left;\\\"><span>&#8203;</span></p><p style=\\\"font-size: 14px; text-align: left;\\\">We are committed to the wellbeing of all our employees and promise to provide comprehensive and evidence-based programs, to promote and support physical and mental wellbeing throughout each employee's journey with us. We believe that wellbeing is a relationship and that everyone has a part to play, so we work in collaboration and consultation with our employees and across our functions in order to ensure a truly person-centred, innovative and integrated approach.<span>&#8203;</span></p></div>\"}]}","front_end_long_text_template":"{\"type\":\"doc\",\"content\":[{\"type\":\"paragraph\",\"attrs\":{\"align\":\"left\"},\"content\":[{\"type\":\"text\",\"text\":\"Content that this role interacts with includes images, video, and text related to every-day life, but it can also include (but is not limited to) bullying; hate speech; child safety; depictions of harm to self and others, and harm to animals. Hence, it is possible that this role will be exposed to harmful content on a daily basis.\"}]},{\"type\":\"paragraph\",\"attrs\":{\"align\":\"left\"}},{\"type\":\"paragraph\",\"attrs\":{\"align\":\"left\"},\"content\":[{\"type\":\"text\",\"text\":\"ByteDance recognises that keeping our platform safe for the ByteDance communities is no ordinary job which can be both rewarding and psychologically demanding and emotionally taxing for some. This is why we are sharing the potential hazards, risks and implications in this unique line of work from the start, so our candidates are well informed before joining.\"}]},{\"type\":\"paragraph\",\"attrs\":{\"align\":\"left\"}},{\"type\":\"paragraph\",\"attrs\":{\"align\":\"left\"},\"content\":[{\"type\":\"text\",\"text\":\"We are committed to the wellbeing of all our employees and promise to provide comprehensive and evidence-based programs, to promote and support physical and mental wellbeing throughout each employee's journey with us. We believe that wellbeing is a relationship and that everyone has a part to play, so we work in collaboration and consultation with our employees and across our functions in order to ensure a truly person-centred, innovative and integrated approach.\"}]}]}"}},"is_customized":true,"name":{"zh_cn":"Trust & Safety at ByteDance","en_us":"Trust & Safety at ByteDance","i18n_name":"Trust & Safety at ByteDance"},"parent":"6893403892125206798","active_status":1,"permissions":{"can_edit_required":false,"can_edit_order":true,"can_edit_name":true,"can_edit_active_status":true,"can_edit_select":false,"can_edit":true}},"children_list":null},{"object_id":"7470407698154326280","attributes":{"required":false,"visible":false,"field_type":{"type":"long_text_with_template","settings":{"disabled_by_switch":null,"display_config":{"config_type":1,"condition_list":[{"condition_type":3,"object_id":"7470145241187158290","value_list":["6","12"]},{"condition_type":3,"object_id":"6893403892125321486","value_list":["CT_100770","CT_100769","ST_1000028","ST_1000029","ST_1000030","ST_1000031","ST_1000032","ST_1000033","ST_1000034","ST_1000035","ST_1000036","ST_1000037","ST_1000038","ST_1000039","ST_1000040","ST_1000041","ST_1000042","ST_1000043","ST_1000044","ST_1000045","ST_1000046","ST_1000047","ST_1000048","ST_1000049","MDCY00068094","MDCY00068178","MDCY00042533","ST_1000309"," rontBgType\":\"image\",\"cardBackBgType\":\"image\",\"frontTitle\":\"创造行业标准\",\"backImage\":\"https://lf3-atsx-byte.feishucdn.com/obj/static-atsx-online-byte/50ce8906cf67749d16685cb9bbdd23e0/09949d8784bdc3f84c6e4ec0a0d52fe1f87a579c504df81161a29e6ae65a23dc.gif\",\"backTitle\":\"\",\"frontDescription\":\"在数字技术的开发和应用上的前沿，创造标准\",\"frontImage\":\"https://sf-atsx-tob.larksuite.com/obj/static-atsx-online-sg-ee-tob-mycis/50ce8906cf67749d16685cb9bbdd23e0/d328dc761be38728d4cc91f4e2e0ca8fb4dc116121071100cd37b7adcef3e5ba.png\",\"backDescription\":\"\"},{\"cardFrontBgType\":\"image\",\"cardBackBgType\":\"image\",\"frontTitle\":\"发挥无限才能\",\"backImage\":\"https://lf3-atsx-byte.feishucdn.com/obj/static-atsx-online-byte/50ce8906cf67749d16685cb9bbdd23e0/d8306acc5ae894b3e2193ba90f385ea5254a76218a77f38862cdc282ac23288f.gif\",\"backTitle\":\"\",\"frontDescription\":\"不同文化背景下的沟通，提倡集思广益，让你面对广大可能性和成长空间\",\"frontImage\":\"https://sf-atsx-tob.larksuite.com/obj/static-atsx-online-sg-ee-tob-mycis/50ce8906cf67749d16685cb9bbdd23e0/1620f8b2e8e95fba4d607b49089fb5211786b1b60ea62889ce4ba16294b94001.png\",\"backDescription\":\"\"}]}],\"_cardFrontImage\":{\"ratio\":\"16:9\"},\"height\":624,\"_sectionTitle\":{\"titleType\":\"text\",\"caption\":{\"text\":\"招聘流程\",\"textBold\":false,\"textHeading\":\"Heading 3\",\"fontSize\":\"var(--basic-fontSize-h3)\",\"animation\":\"\",\"textFontFamily\":\"HYYakuHei\"}}},\"children\":[]},{\"type\":\"Section\",\"id\":\"BOvLucfc2Y9LTswe_9\",\"props\":{\"gridStyle\":{\"--row-nums\":2},\"customType\":\"text\"},\"propsPhone\":{\"gridStyle\":{\"--row-nums\":5}},\"hasCustomGridChild\":true,\"children\":[{\"id\":\"KpPemH8D5AkeInkQ_11\",\"type\":\"Text\",\"props\":{\"content\":{\"0\":{\"ops\":[{\"attributes\":{\"hid\":\"L0mnyJhEhT4Q\",\"heading\":\"Paragraph-2\",\"align\":\"center\",\"lmkr\":\"1\"},\"insert\":\"*\"},{\"insert\":\"关于技术人才项目的招聘信息，请前往项目页面了解\\n\"}],\"zoneId\":\"0\",\"zoneType\":\"Z\"}},\"padding\":false,\"verticalAlign\":\"center\"},\"gridInfo\":{\"area\":{\"row\":[1,3],\"col\":[3,23]}},\"gridInfoPhone\":{\"area\":{\"row\":[1,5],\"col\":[2,8]}},\"propsPhone\":{\"content\":{\"0\":{\"ops\":[{\"insert\":\"*\",\"attributes\":{\"heading\":\"Paragraph-2\",\"hid\":\"L0mnyJhEhT4Q\",\"align\":\"center\",\"lmkr\":\"1\"}},{}],\"zoneId\":\"0\",\"zoneType\":\"Z\"}}},\"children\":[]}]},{\"id\":\"bOhAwm0D6flrsne3_232\",\"type\":\"QAndA\",\"props\":{\"background\":\"image\",\"sectionTitle\":true,\"isExpandAnswers\":true,\"sectionTabs\":true,\"isShowSpecifiedNums\":true,\"dataList\":[{\"id\":\"t2FXvmQBMDc9kteP_527\",\"name1\":true,\"name\":\"关于应届生招聘\",\"qaList\":[{\"question\":\"字节跳动 2027 校园招聘的时间安排是什么？\",\"answer\":\"投递时间：2026 年 8 月至 2027 年 5 月 31 日止\\\\n\\n笔试时间：即日起\\\\n\\n面试时间：即日起，根据招聘进展灵活开展\\\\n\\nOffer 发放时间：面试通过后，灵活沟通发放\"},{\"question\":\"字节跳动 2027 校园招聘的招聘对象是？\",\"answer\":\"在 2026 年 9 月至 2027 年 8 月期间毕业（中国大陆地区以毕业证为准，非中国大陆地区以学位证为准），且最高学历毕业后无全职工作经验的学生。\\n\\\\n*不满足以上毕业时间的同学可以考虑投递社会招聘或实习岗位\"},{\"question\":\"“前沿技术领域人才校招”与此前的“筋斗云人才计划”是什么关系？\",\"answer\":\"前沿技术领域人才校招，是字节跳动面向全球优秀技术人才推出的招聘项目，招聘对象为 2027 届及以后毕业的同学。\\n\\\\n字节跳动针对前沿技术领域优秀应届生和实习生的招聘，今年统一放在“前沿技术领域人才校招”项目中，不再设立“筋斗云人才计划”。\\n\\\\n“用人看本质”是字节跳动重要的人才理念，我们看重人才潜力、不看资历。同时，我们一直坚持“以能定级，以级定薪”，会直接根据候选人的能力，给予相应的定级和领先行业的薪酬回报。\\n\\\\n随着字节跳动在各技术领域的不断探索，公司正面临 AI 时代新的机遇，需要更多优秀人才和我们一起去做超越常规的突破。未来，字节跳动将持续加大对人才的投入，为优秀人才提供行业最好的发展空间和回报。\"},{\"question\":\"Seed 大模型人才校招与字节跳动前沿技术领域人才校招有何不同？ \",\"answer\":\"岗位方向有所不同，Seed 大模型人才校招岗位主要包括基础大模型、机器学习系统、视觉智能、语音智能、大模型 AI 搜索、模型个性化、具身智能等方向。前沿技术领域人才校招岗位主要包括大模型应用、搜索/推荐/广告、计算机体系结构与系统优化、安全/AI Safety、硬件、AI Coding、AIGC、视频架构、AI for Science等方向。\"},{\"question\":\"招聘对学历和所学专业有限制吗？ \",\"answer\":\"我们坚持用人看本质、看重你的潜力和能力，不唯背景和资历，欢迎不同背景的优秀人才加入。比起学历和专业，兴趣和能力是否匹配更重要，你可以在具体职位描述中进一步查看和了解岗位的详细信息。\"},{\"question\":\"每人可以投递几个职位？\",\"answer\":\"字节跳动 2027 校园招聘全年开放投递，共计4次投递机会（ 2026 年 8 月 3 日 - 2026 年 12 月 31 日有两次投递机会； 2027 年 1 月1 日刷新两次投递机会，2026 年和 2027 年投递机会独立）。\\n\\\\n如果你投递的职位未被录用，HR 有可能会根据你的简历情况，再次邀请你进入其他校招岗位流程。你的申请职位及招聘进度随之更新，请留意相关邮件及短信通知。\\n\\\\n\\n\\\\n在字节跳动社会招聘和实习生招聘中，每人不限投递次数，可以尽情选择心仪的职位。考虑到应聘效率，也建议同学在投递时区分优先级，优先投递意向度最高的岗位。\"},{\"question\":\"每年可投递的两个职位之间有什么关系？\",\"answer\":\"两个职位彼此独立且不限制投递时间，我们会默认优先处理较早投递的职位。当然，你可以选择只投递一个职位，或在第一个职位流程结束后再投递第二个职位。但请注意，已成功投递的职位不能修改更换。\"},{\"question\":\"如果已经投递了实习（ByteIntern/日常实习）或社招职位，还可以投递校招职位吗？\",\"answer\":\"在投递次数限制内，可以再次投递。\"},{\"question\":\"如何投递简历？\",\"answer\":\"字节跳动校园招聘官网为本次校园招聘简历投递的唯一入口，在电脑及手机上均可进行投递。\\n\\\\n字节跳动校园招聘官网网址：jobs.bytedance.com/campus ，勾选“正式”，解锁所有在招岗位。\\n \"},{\"question\":\"职位投递成功后，还可以修改投递职位吗？\",\"answer\":\"不可以修改投递职位。\"},{\"question\":\"职位投递成功后，还可以修改简历内容吗？\",\"answer\":\"如需修改简历内容，请登录字节跳动校园招聘官网，进入个人中心-我的简历模块进行修改。\\n\\\\n但请注意，已投递的职位是无法同步更新展示新简历内容的；在修改简历后新投递的职位，会展示新简历内容。\"},{\"question\":\"如何知道我的招聘进展？\",\"answer\":\"登录字节跳动校园招聘官网，页面右上角「应聘记录」可实时查看招聘进展。同时我们也会通过邮件、短信等方式同步后续安排，请确保投递时填写正确的手机号及邮箱。 \"},{\"question\":\"如果简历状态已经停留在某一个阶段很久了（超过 10 个工作日），说明流程已经结束了吗？\",\"answer\":\"只有简历状态显示【流程终止】说明流程结束，其他状态请耐心等待后续通知。\"},{\"question\":\"如果简历状态显示【流程终止】，说明流程已经结束了吗？ \",\"answer\":\"是的，说明你在当前投递的职位下暂无后续安排。\"},{\"question\":\"我是在职实习生，我可以投递校招职位么？\",\"answer\":\"在职实习生需要走实习生转正流程，具体可以联系你的 HR。已离职实习生可以投递校招职位。\"},{\"question\":\"字节跳动 2027 校园招聘可以内推吗？参加内推有什么作用？\",\"answer\":\"所有校招职位均可参加内推。若通过内推投递校招职位，简历将获得优先筛选资格。更重要的是，可以通过内推人更深入地了解公司和部门。\"},{\"question\":\"怎么样可以参加校招内推？\",\"answer\":\"通过校招内推码参加内推。联系字节跳动在职同学获取校招内推链接/内推码（正式员工和实习生都有内推码），点击链接进行投递或在投递页面输入内推码，投递成功即代表内推成功。\"},{\"question\":\"我在投递的时候，没有填写内推码或使用内推链接投递，还能再次通过内推投递吗？\",\"answer\":\"投递完成之后不可以再补充内推码或重新通过内推链接投递。\"},{\"question\":\"我用 A 的内推码完成了投递，同时我又收到了 B 的内推码，我可以修改吗？\",\"answer\":\"投递之后不可以再修改内推码。\"},{\"question\":\"我内推投递了一个职位，但流程已经被结束，我还可以再次通过内推投递吗？\",\"answer\":\"可以，每位同学最多有两次投递的机会，可以使用同一个内推码，或分别使用不同的内推码参加内推。\"},{\"question\":\"内推需要付费吗？\",\"answer\":\"不需要！字节跳动不会以任何形式进行付费内推，也绝不会以任何名义向应聘者收取任何费用，请谨防受骗！\"},{\"question\":\"所有职位都会安排笔试吗？\",\"answer\":\"不同部门及岗位的校招流程会有差异性。 HR 会根据你的简历与岗位的匹配度判断是否需要笔试，请以实际安排为准，届时将通过邮件和短信等形式提前 1-3 个工作日进行通知。\"},{\"question\":\"笔试采取什么形式？是什么时候？\",\"answer\":\"如若投递职位有笔试安排，将采取在线笔试的形式，请耐心等待邮件和短信通知。笔试根据投递时间顺序先后发放，具体笔试时间以收到的通知为准。\"},{\"question\":\"错过笔试，还能再参加笔试吗？\",\"answer\":\"建议大家收到笔试通知后，尽量按时参与。如果未及时参加笔试，且投递职位仍有需求，你将有机会再次参与笔试，请耐心等待邮件和短信通知。\"},{\"question\":\"之前做过校招笔试，本次收到笔试邀约后还需要作答吗？\",\"answer\":\"需要，笔试是根据投递岗位进行邀约的。岗位类型和方向不同，考察的范围也不同。\"},{\"question\":\"笔试的作答时长多久？\",\"answer\":\"不同职位的笔试完成期限、笔试时长也相应不同，请以邮件中的实际安排为准。\"},{\"question\":\"笔试之后，为什么简历状态一直为【笔试中】？如何查看笔试结果？\",\"answer\":\"我们正在对笔试结果进行评估，请耐心等待笔试结果。笔试结果作为应聘的参考维度，我们暂不开放笔试结果查询。\"},{\"question\":\"简历状态为【笔试中】超过一周，但一直没有收到笔试通知怎么办？或者只收到了手机短信，没有收到笔试邀请怎么办？\",\"answer\":\"Step1 查看自己投递简历时填写的邮箱及电话是否有误；\\n         \\\\nStep2 查看简历投递邮箱的垃圾箱；\\n       \\\\nStep3 如果确认没有收到笔试通知，可前往“候选人体验反馈平台”candidatefeedback.bytedance.com，发送详细信息说明情况，会有 HR 在五个工作日内回复。如需反馈，请参考以下内容：\\n   \\\\n【招聘流程类型】校园招聘\\n   \\\\n【反馈内容类型】咨询\\n   \\\\n  标题：官网状态笔试中，未收到笔试邀请\\n   \\\\n  内容：至少包含个人姓名，手机号，投递职位名称，投递邮箱以及可以接收邮件的正确邮箱。\\n   \\\\n\\n    \\\\n *简历状态为【笔试中】不足一周时间，且未收到任何笔试通知，此时HR正在安排笔试，请耐心等待笔试通知。\"},{\"question\":\"在线初评是什么？是否一定要参加？\",\"answer\":\"在线初评用于信息收集与初步评估，包含在线问答和 AI 能力测评，以 AI 形式进行。部分岗位有在线初评环节，若你收到邀约，建议认真参与并如实作答，这将有助于团队更全面地了解你的情况。\"},{\"question\":\"我的简历状态显示【面试中】，但却未收到任何通知，是什么原因？\",\"answer\":\"如你已经进入面试中还未收到面试通知，请留意邮件及手机短信，我们会在面试前与你沟通。\"},{\"question\":\"为什么投递的岗位和被邀请面试的岗位不一致？\",\"answer\":\"简历投递后，HR 会根据你的过往经历来决定是否邀请你参与投递岗位面试，也可能邀请至其他合适的岗位面试，如果不想参与其他岗位的面试，可以直接拒绝。\"},{\"question\":\"我想调整面试时间或面试形式，应该联系谁呢？\",\"answer\":\"请尽量按时参与面试。如果临时有事或因不可抗力无法参加，不要着急，请直接联系面试邀请邮件中的 HR 说明情况，并让 HR 帮忙修改。\\n  \\\\n若因特殊情况无法联系上 HR ，可前往“候选人体验反馈平台” candidatefeedback.bytedance.com，发送详细信息说明情况，会有 HR 在五个工作日内回复。如需反馈，请参考以下内容：\\n   \\\\n【招聘流程类型】校园招聘\\n   \\\\n【反馈内容类型】咨询\\n   \\\\n  标题：调整面试时间\\n   \\\\n  内容：至少包含个人姓名，手机号，投递职位名称，需要修改的面试时间和可面试的时间段。\"},{\"question\":\"面试后多长时间可以收到结果？\",\"answer\":\"登录字节跳动校园招聘官网，页面右上角「应聘记录」可实时查看招聘进展。【流程终止】外的其他状态请耐心等待后续通知。  \"},{\"question\":\"选择加入字节跳动，你将有怎样的成长与收获？\",\"answer\":\"\\\\n- 挑战更高的目标：在 AI 时代有很多机会和挑战，我们希望不断攀登新的技术和业务高峰，持续探索，并在这一过程中鼓励新人大胆创新，做有价值、有难度、有高度的事，天花板足够高。\\n\\\\n- 充足的做事空间：我们相信人才潜力并充分授权，不论资排辈，新人也能主导重要项目，有潜力的人可以大胆想象，放手做事。同时，我们为校招生配备 Mentor 、开放的学习资源，让你获得成长所需要的支持。\\n\\\\n- 行业领先的回报发展：我们将为优秀人才提供领先行业头部的薪酬和激励，同时鼓励拉开激励区分度，让优秀的人得到充分的认可和回报。\"},{\"question\":\"针对新员工，字节跳动有哪些培养资源及培训计划助力？\",\"answer\":\"字节跳动关注大家的成长，为 ByteDancer 准备了开放的学习资源，为不同成长阶段提供所需要的支持。\\\\n\\n \\\\n\\n- 新员工必修课程为你开启职场第一课。通过学习，你可以全面了解公司文化、政策、办公系统等，快速融入公司；\\\\n\\n- 明确的成长计划帮你快速融入。入职后，Leader 和 Mentor为你制定成长计划、明晰发展路径，帮助你更好地熟悉业务、融入团队，从校招小白快速成长为独当一面的职场人；\\\\n\\n- 开放的学习资源和平台，持续积累持续提升。知识库沉淀丰富的内部优秀实践；ByteLearning 提供丰富的学习资源，随时在线学习。技术新人还可以参加各类业务技术培训，和技术大牛零距离交流，了解字节跳动技术全景，提升专业技能，开拓技术视野。\"},{\"question\":\"字节跳动有什么员工福利呢？\",\"answer\":\"请点击校招官网【成长体验】页面查看字节跳动的员工福利，工作环境和更多企业相关信息。\"},{\"question\":\"若想咨询更多信息，如何联系？\",\"answer\":\"如果以上问题都没有解答你的疑惑，可发送详细信息至候选人体验反馈平台 candidatefeedback.bytedance.com 说明情况，我们会在五个工作日内回复。\\n\\\\n欢迎关注【字节跳动招聘】公众号，第一时间获取最新校招动态。\"}]},{\"id\":\"4C5SDmTSwCFnduyj_70\",\"name1\":true,\"name\":\"关于实习生招聘\",\"qaList\":[{\"question\":\"字节跳动 2026 年实习生招聘的时间安排是什么？\",\"answer\":\"全年进行招聘，具体职位信息以官网为准。\"},{\"question\":\"ByteIntern 和日常实习生的区别是什么？\",\"answer\":\" ByteIntern：面向 2027 届毕业生（2026 年 9 月 - 2027 年 8 月期间毕业），通过该项目投递，所有岗位都有转正机会（转正率达55%！）\\n\\\\n日常实习：面向全体在校生，为符合岗位要求的同学提供为期3个月及以上的项目实践机会。\"},{\"question\":\"招聘对学历和所学专业有限制吗？\",\"answer\":\"我们坚持用人看本质、多元兼容的人才观，不唯背景和资历，欢迎不同背景的优秀人才加入。比起学历和专业，兴趣和能力是否匹配更重要，你可以在具体职位描述中进一步查看和了解岗位的详细信息。\"},{\"question\":\"每人可以投递几个职位？\",\"answer\":\"在字节跳动实习生招聘中，每人不限投递次数哦，可以尽情选择心仪的职位。\"},{\"question\":\"投递的多个职位之间有什么关系？\",\"answer\":\"每个职位彼此独立且不限制投递时间，我们会默认优先处理较早投递的职位。当然，你可以选择只投递一个职位，或在一个职位流程结束后再投递下一个职位。但请注意，已成功投递的职位不能修改更换。\"},{\"question\":\"如果已经投递了日常实习或社招职位，还可以投递ByteIntern职位吗？\",\"answer\":\"可以。但是我们会优先处理较早投递的日常实习职位，如果你投递的日常实习未被录用，HR 有可能会根据你投递的ByteIntern职位再次邀请你进入招聘流程。\"},{\"question\":\"如何投递简历？\",\"answer\":\"字节跳动校园招聘官网为本次校园招聘简历投递的唯一入口，在电脑及手机上均可进行投递。\\n\\\\n字节跳动校园招聘官网网址：jobs.bytedance.com/campus\"},{\"question\":\"职位投递成功后，还可以修改投递职位吗？\",\"answer\":\"不可以修改投递职位。\"},{\"question\":\"职位投递成功后，还可以修改简历内容吗？\",\"answer\":\"如需修改简历内容，请登录字节跳动校园招聘官网，进入个人中心-我的简历模块进行修改。但请注意，已投递的职位是无法同步更新展示新简历内容的；在修改简历后新投递的职位，会展示新简历内容。\"},{\"question\":\"如何知道我的招聘进展？\",\"answer\":\"登录字节跳动校园招聘官网，页面右上角「应聘记录」可实时查看招聘进展。同时我们也会通过邮件、短信等方式同步后续安排，请确保投递时填写的手机号及邮箱正确。\"},{\"question\":\"如果简历状态已经停留在某一个阶段很久了（超过 10 个工作日），说明流程已经结束了吗？\",\"answer\":\"只有简历状态显示【流程终止】说明流程结束，其他状态请耐心等待后续通知。\"},{\"question\":\"如果简历状态显示【流程终止】，说明流程已经结束了吗？\",\"answer\":\"是的，说明你在当前投递的职位下暂无后续安排。\"},{\"question\":\"后续还会开放其他实习职位吗？什么时候开放？\",\"answer\":\"目前在招岗位以官网为主，实习岗位会在校招官网持续更新，同学可以随时关注官网动态以及字节跳动招聘公众号。\"},{\"question\":\"字节跳动实习生招聘可以内推吗？参加内推有什么作用？\",\"answer\":\"所有实习职位均可参加内推。若通过内推投递实习职位，简历将获得优先筛选资格。更重要的是，可以通过内推人更深入地了解公司和部门。\"},{\"question\":\"怎么样可以参加实习内推？\",\"answer\":\"通过校招内推链接/内推码参加内推。联系字节跳动在职同学获取校招内推链接/内推码（正式员工和实习生均有内推码），点击链接进行投递或在投递页面输入内推码，投递成功即代表内推成功。\"},{\"question\":\"我在投递的时候，没有填写内推码或使用内推链接投递，还能再次通过内推投递吗？\",\"answer\":\"投递完成之后不可以再补充内推码或重新通过内推链接投递。\"},{\"question\":\"我用 A 的内推码完成了投递，同时我又收到了 B 的内推码，我可以修改吗？\",\"answer\":\"投递之后不可以再修改内推码。\"},{\"question\":\"我内推投递了一个职位，但流程已经被结束，我还可以再次通过内推投递吗？\",\"answer\":\"可以，每位同学有多次投递机会，可以使用同一个内推码，或分别使用不同的内推码参加内推。\"},{\"question\":\"内推需要付费吗？\",\"answer\":\"不需要！字节跳动不会以任何形式进行付费内推，也绝不会以任何名义向应聘者收取任何费用，请谨防受骗！\"},{\"question\":\"所有职位都会安排笔试吗？\",\"answer\":\"不同部门及岗位的校招流程会有差异性。HR会根据你的简历与岗位的匹配度判断是否需要笔试，请以实际安排为准，届时将通过邮件和短信等形式提前1-3个工作日进行通知。\"},{\"question\":\"笔试采取什么形式？是什么时候？\",\"answer\":\"如若投递职位有笔试安排，将采取在线笔试的形式，请耐心等待邮件和短信通知。笔试根据投递时间顺序先后发放，具体笔试时间以收到的通知为准。\"},{\"question\":\"错过笔试，还能再参加笔试吗？\",\"answer\":\"建议大家收到笔试通知后，尽量按时参与。如果未及时参加笔试，且投递职位仍有需求，你将有机会再次参与笔试，请耐心等待邮件和短信通知。\"},{\"question\":\"之前做过校招笔试，本次收到笔试邀约后还需要作答吗？\",\"answer\":\"需要，笔试是根据投递岗位进行邀约的。岗位类型和方向不同，考察的范围也不同。\"},{\"question\":\"笔试的作答时长多久？\",\"answer\":\"不同职位的笔试完成期限、笔试时长也相应不同，请以邮件中的实际安排为准。\"},{\"question\":\"笔试之后，为什么简历状态一直为【笔试中】？如何查看笔试结果？\",\"answer\":\"我们正在对笔试结果进行评估，请耐心等待笔试结果。笔试结果作为应聘的参考维度，我们暂不开放笔试结果查询。\"},{\"question\":\"简历状态为【笔试中】超过一周，但一直没有收到笔试通知怎么办？或者只收到了手机短信，没有收到笔试邀请怎么办？\",\"answer\":\"Step1 查看自己投递简历时填写的邮箱及电话是否有误；\\n \\\\nStep2 查看简历投递邮箱的垃圾箱；\\n \\\\nStep3 如果确认没有收到笔试通知，可前往“候选人体验反馈平台”candidatefeedback.bytedance.com，发送详细信息说明情况，会有 HR 在五个工作日内回复。如需反馈，请参考以下内容：\\n\\\\n\\n  \\\\n【招聘流程类型】校园招聘\\n  \\\\n【反馈内容类型】咨询\\n  \\\\n标题：官网状态笔试中，未收到笔试邀请\\n  \\\\n内容：至少包含个人姓名，手机号，投递职位名称，投递邮箱以及可以接收邮件的正确邮箱。\\n\\\\n\\n\\\\n\\n\\\\n*简历状态为【笔试中】不足一周时间，且未收到任何笔试通知，此时HR正在安排笔试，请耐心等待笔试通知。\"},{\"question\":\"我的简历状态显示【面试中】，但却未收到任何通知，是什么原因？\",\"answer\":\"如你已经进入面试中还未收到面试通知，请留意邮件及手机短信，我们会在面试前与你沟通。\"},{\"question\":\"为什么投递的岗位和被邀请面试的岗位不一致？\",\"answer\":\"简历投递后，HR会根据你的过往经历来决定是否邀请你参与投递岗位面试，也可能邀请至其他合适的岗位面试，如果不想参与其他岗位的面试，可以直接拒绝。\"},{\"question\":\"我想调整面试时间或面试形式，应该联系谁呢？\",\"answer\":\"请尽量按时参与面试。如果临时有事或因不可抗力无法参加，不要着急，请提前联系面试邀请邮件中的 HR 说明情况，并让 HR 帮忙修改。\\n \\\\n\\n \\\\n若因特殊情况无法联系上 HR ，可前往“候选人体验反馈平台” candidatefeedback.bytedance.com，发送详细信息说明情况，会有 HR 在五个工作日内回复。如需反馈，请参考以下内容：\\n \\\\n【招聘流程类型】校园招聘\\n \\\\n【反馈内容类型】咨询\\n \\\\n标题：调整面试时间\\n \\\\n内容：至少包含个人姓名，手机号，投递职位名称，需要修改的面试时间和可面试的时间段。\"},{\"question\":\"面试后多长时间可以收到结果？\",\"answer\":\"登录字节跳动校园招聘官网，页面右上角「应聘记录」可实时查看招聘进展。【流程终止】外的其他状态请耐心等待后续通知。\"},{\"question\":\"选择加入字节跳动，你将有怎样的成长与收获？\",\"answer\":\" \\\\n- 挑战更高的目标：在 AI 时代有很多机会和挑战，我们希望不断攀登新的技术和业务高峰，持续探索，并在这一过程中鼓励新人大胆创新，做有价值、有难度、有高度的事，天花板足够高。\\n \\\\n- 充足的做事空间：我们相信人才潜力并充分授权，不论资排辈，新人也能主导重要项目，有潜力的人可以大胆想象，放手做事。同时，我们为校招生配备 Mentor 、开放的学习资源，让你获得成长所需要的支持。\\n \\\\n- 行业领先的回报发展：我们将为优秀人才提供领先行业头部的薪酬和激励，同时鼓励拉开激励区分度，让优秀的人得到充分的认可和回报。\"},{\"question\":\"针对新员工，字节跳动有哪些培养资源及培训计划助力？\",\"answer\":\"字节跳动关注大家的成长，为 ByteDancer 准备了开放的学习资源，为不同成长阶段提供所需要的支持。\\n \\\\n\\n\\\\n- 新员工必修课程为你开启职场第一课。通过学习，你可以全面了解公司文化、政策、办公系统等，快速融入公司；\\n\\\\n- 明确的成长计划帮你快速融入。入职后，Leader 和Mentor为你制定成长计划、明晰发展路径，帮助你更好地熟悉业务、融入团队，从校招小白快速成长为独当一面的职场人；\\n\\\\n- 开放的学习资源和平台，持续积累持续提升。知识库沉淀丰富的内部优秀实践；ByteLearning 提供丰富的学习资源，随时在线学习。技术新人还可以参加各类业务技术培训，和技术大牛零距离交流，了解字节跳动技术全景，提升专业技能，开拓技术视野。\"},{\"question\":\"字节跳动有什么员工福利呢？\",\"answer\":\"请点击校招官网【成长体验】页面查看字节跳动的员工福利，工作环境和更多企业相关信息。\"},{\"question\":\"若想咨询更多信息，如何联系？\",\"answer\":\"如果以上问题都没有解答你的疑惑，可发送详细信息至候选人体验反馈平台 candidatefeedback.bytedance.com 说明情况，我们会在五个工作日内回复。\\n\\\\n\\n\\\\n欢迎关注【字节跳动招聘】公众号，第一时间获取最新校招动态。\"}]}],\"peopleQuestion\":true,\"peopleAnswer\":true,\"_sectionTitle\":{\"caption\":{\"text\":\"字节跳动校园招聘 Q&A\",\"textHeading\":\"Heading 4\",\"fontSize\":\"var(--basic-fontSize-h4)\",\"textFontFamily\":\"HYYakuHei\",\"textBold
