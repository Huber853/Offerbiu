    <script>
        window.chinahr_cmp_json_data = {"isAdbc2025":true,"m":"","theme":{"jobBgColor":"#F4FAFA","textColor":"#EF8F35","selectColor":"#469590 ","selectedColor":"#EF8F35","arrowTrigIcon":"//pic1.58cdn.com.cn/nowater/jltx/n_v3e46a21e802544cefb87748e969643705.jpg","circleTrigIcon":"//pic1.58cdn.com.cn/nowater/jltx/n_v367b06c3a40ff4af3a25dbd66cdf0bc7a.jpg","applyIcon":"//pic1.58cdn.com.cn/nowater/jltx/n_v37cc8f7ac04c44c4384647f28856051f2.jpg","homeBackground":"https://pic1.58cdn.com.cn/nowater/chinahr/data/n_v3a5649b889575493887a6b78c7789b4b3.jpg","banner":"https://pic1.58cdn.com.cn/nowater/chinahr/data/n_v3f43c13bf40b04735b7ed8716c9a723c5.jpg","topIcon":"//pic1.58cdn.com.cn/nowater/jltx/n_v3b06fc91335cd45d3bcba72080459d267.jpg","directTrigColor":"#469590"},"aboutus":{"name":"机构简介","tabs":[{"name":"机构简介","title":"中国农业发展银行2027年度校园招聘宣传片","content":{"video":{"width":"100%","height":500,"src":"https://wos2.58cdn.com.cn/JkLgFeDcBJLq/cmpres/adbc2027xiaozhao.mp4","poster":"https://pic1.58cdn.com.cn/nowater/chinahr/data/n_v3e843288ddc16482ca9c3fb1d119939df.png"},"txt":["中国农业发展银行成立于1994年，是由国家出资设立、直属国务院领导、支持农业农村持续健康发展、具有独立法人地位的国有政策性银行。经营宗旨是紧紧围绕服务国家战略，建设定位明确、功能突出、业务清晰、资本充足、治理规范、内控严密、运营安全、服务良好、具备可持续发展能力的农业政策性银行。","","","","","","","",""]}}]},"gonggao":{"name":"招聘公告","title":"中国农业发展银行2027年度校园招聘公告","des":["中国农业发展银行是全球最大、全国唯一、直属国务院领导的农业政策性银行，主要职责是以国家信用为基础筹集资金，支持“三农”事业发展，全力服务国家粮食安全、乡村振兴等重点领域。目前，全国设有总、省、市、县四级机构共2000多个，在岗员工近5万人，在农村金融体系中发挥主力和骨干作用。","为更好地履行社会责任和服务国家战略，现面向境内外高等院校招聘2027年普通高校应届毕业生，有关事项公告如下："],"tabs":[{"name":"一、招聘机构及岗位","content":["招聘机构包括总行本部（含中央纪委国家监委驻中国农业发展银行纪检监察组，下同）、省级分行本级、二级分行本级和县级支行，具体招聘岗位见报名系统。","","",""]},{"name":"二、招聘条件","content":["招聘对象为境内外院校2027年应届毕业生。","（一）基本条件","1. 具有中华人民共和国国籍。","2. 遵纪守法，诚实守信，品行端正，无不良记录。","3. 境内外院校毕业生均须在2026年8月1日至2027年7月31日间毕业，并在2027年7月31日前取得毕业证、学位证或获得国家教育部学历学位认证。总行本部招聘的应届高校毕业生须符合人力资源和社会保障部、教育部留学服务中心关于在京就业落户的具体条件。","4. 身体健康，具体参照《公务员录用体检通用标准(试行)》和《公务员录用体检操作手册(试行)》执行。","5. 与中国农业发展银行及其控股子公司员工不存在夫妻关系、直系血亲关系、三代以内旁系血亲关系以及近姻亲关系。","（二）学历、专业条件和外语水平","1. 报考总行本部、省级分行本级岗位人员须具有硕士研究生及以上学历并取得相应学位，应通过大学英语六级考试（不低于426分），或提供具备相应外语能力的资格证明（如新托福不低于95分，或雅思不低于6.5分，或相应等级的小语种专业证书）；报考二级分行本级岗位人员原则上应具有硕士研究生及以上学历并取得相应学位；报考县级支行岗位人员须具有大学本科及以上学历并取得相应学位。","2. 报考人员的专业应为经济、金融、财会、法律、信息技术、人工智能、数据分析、数理统计、农业、生态、交通、水利、能源技术、建筑、土木工程等与我行业务发展密切相关的专业；少量招收保密、档案、马克思主义理论、人力资源管理等专业人员。","（三）其他条件","详见具体岗位要求。"]},{"name":"三、招聘流程","content":["（一）具体报名时间为2026年9月15日至10月11日24时。","（二）资格审查与简历筛选。我行将根据各岗位招聘条件对应聘人员进行资格审查，择优确定参加笔试人员。","（三）笔试。我行将于2026年11月初组织线下统一笔试，考试科目为综合测评（含性格测试）。具体考试方式和地点，届时将通过短信通知。","（四）面试、政审、体检及录用签约等后续工作安排将另行通知。"]},{"name":"四、有关事项","content":["（一）网上报名为本次招聘的唯一报名方式。应聘者在指定网站报名，在线填写个人简历，完成岗位申报。每个考生最多可以填报2个岗位（总行本部、同一省级分行限报1个岗位）。请应聘者准确、完整填写简历和相关资料信息，保证信息真实、准确，个人信息提交后不能更改；如与事实不符，我行有权取消其应聘资格，后果由应聘者本人承担。","（二）本次招聘，我行将组织线下统一笔试，考生应在考试指定时间到指定地点参加考试。","（三）招聘过程中，我行将通过应聘者在线报名时填写的联系方式（包括手机、E-mail等）与本人联系，请应聘者保持通讯畅通。如因联系方式发生变化、填写错误等无法获得笔试、面试及录用通知，责任自负。","（四）本次笔试不指定考试辅导用书，不举办也不委托任何机构举办考试辅导班，不向应聘者收取任何费用，请谨防受骗。","（五）根据岗位需求变化及报名等情况，我行有权调整或取消相应岗位的招聘工作，并享有最终解释权。","<p style=\"text-align: right\">中国农业发展银行</p >","<p style=\"text-align: right\"> 2026年9月15日</p >"]},{"content":[]}],"linkBtton":{"isShow":true,"backgroundImgUrl":"https://pic5.58cdn.com.cn/nowater/frs/n_v3911d42c401514293802aab36888c44b3.png","url":"https://campus.chinahr.com/pages/adbc2027/#/jobs"}},"jobs":{"token":"6fcc25f7-5df8-4f6f-b0d2-5853681ac662","firstId":"6a8fd915f6bf3d0ac213dd80","projectId":"6a8fd914f6bf3d0ac213dd5c","ignoreGuide":true,"name":"招聘职位","content":["*第一步：在左侧机构列表中，请选择您要应聘的一个分支机构；"],"isShowStatistics":false,"statisticsTipText":"数据后续上线，请保持关注"},"tongzhi":{"name":"宣传通知","tabs":[{"name":"宣传通知","content":["敬请期待"]},{"name":"招聘流程","image":""}]},"gsgw":{"name":"公司官网","url":"https://www.adbc.com.cn/"},"wechat":{"name":"人才招聘官微","content":""},"guide":{"backgroundImg":"//wos.58cdn.com.cn/cDazYxWcDHJ/picasso/ibpim5u4__w3840_h2160.png","center":"//wos.58cdn.com.cn/cDazYxWcDHJ/picasso/vkito7b5__w1880_h372.png","point":"//wos.58cdn.com.cn/cDazYxWcDHJ/picasso/pk6lce25__w256_h256.png","applyBtn":"//wos.58cdn.com.cn/cDazYxWcDHJ/picasso/5a1vsug5__w1180_h114.png","examLink":"https://userevl.chinahr.com/to/5036"}}
