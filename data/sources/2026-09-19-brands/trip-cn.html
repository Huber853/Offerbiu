recruit.overseasCareers.jobFamilyGroup.JFG_41":"Product management","recruit.overseasCareers.jobCategroy.Categroy_2":"Technical","recruit.overseasCareers.jobCategroy.Categroy_8":"Management level","recruit.overseasCareers.jobCategroy.Categroy_3":"Product","recruit.overseasCareers.jobCategroy.Categroy_1":"Functional","recruit.overseasCareers.jobCategroy.Categroy_6":"Services","recruit.overseasCareers.jobCategroy.Categroy_5":"Business","recruit.overseasCareers.jobCategroy.Categroy_7":"Affiliated company","recruit.overseasCareers.jobCategroy.Categroy_4":"Marketing & sales","recruit.overseasCareers.jobCategroy.Categroy_9":"Trip.com Group","recruit.overseasCareers.BUSource.25481":"Vacations","recruit.overseasCareers.BUSource.1000":"Other","recruit.overseasCareers.BUSource.29":"Trip.com Group","recruit.overseasCareers.BUSource.39":"Services","recruit.overseasCareers.BUSource.38":"Functional Departments","recruit.overseasCareers.BUSource.47":"Accommodation","recruit.overseasCareers.BUSource.5537":"International Business","recruit.overseasCareers.BUSource.55649":"Trains","recruit.overseasCareers.BUSource.45":"Flights","recruit.overseasCareers.BUSource.4052":"Finance","recruit.overseasCareers.BUSource.51":"Corporate Travel","recruit.overseasCareers.BUSource.46":"IT","recruit.overseasCareers.BUSource.52":"Marketing","recruit.overseasCareers.common.allJobs":"See Jobs","recruit.overseasCareers.common.campusHire":"Students","recruit.overseasCareers.common.home.Placeholder":"From: &lt;A job search&lt;","recruit.overseasCareers.common.locations":"Work location","recruit.overseasCareers.common.myInformation":"My info","recruit.overseasCareers.common.searchJobs":"e.g. project manager","recruit.overseasCareers.common.tripLife":"Working at Trip.com Group","recruit.overseasCareers.employeeStory.content11":"Ma Yuning, a recent graduate from Manchester University, is passionate about travel, and it was this passion which inspired her to join Trip.com Group. As a Trainee Accommodation Manager, she's constantly learning new things about the travel industry, and with the help of cutting edge technology and big data, providing hotel partners with precise insight and innovative solutions.","recruit.overseasCareers.employeeStory.content12":"Yuning says: \"Working at Trip.com Group, I have the chance to do what I love while broadening my skillset. I'm excited to be working at the forefront of the travel industry, and helping our hotel partners to achieve their goals. But most of all, I love meeting and learning from people from all walks of life.\"","recruit.overseasCareers.employeeStory.content13":"This is only the start of Yuning's journey, and we're confident that she'll continue to go from strength to strength and achieve her professional goals.","recruit.overseasCareers.employeeStory.content21":"Bettina Sanada puts her multilingual skills to good use in our International Business Dept., where she's responsible for marketing and operations.","recruit.overseasCareers.employeeStory.content23":"Trip.com Group creates a positive working environment where people are encouraged to achieve their potential. Mutual interaction and encouragement are central to what we do.","recruit.overseasCareers.employeeStory.content22":"Fluent in English, German, Japanese, and Chinese, she has no problem communicating with colleagues from different backgrounds. Bettina's role provides her with ample opportunities to express her ideas and engage in productive collaboration. \"Even if our personal backgrounds are not that similar,\" says Bettina, \"I still feel there is more \"we\" than \"me\" in the team here. We all want to expand our business on a global scale, so everyone listens to and respects the opinions of everyone else. I love being able to express myself and draw upon my strengths.\"","recruit.overseasCareers.employeeStory.content31":"At Trip.com Group, we want everyone to feel a real sense of purpose about what they do. This is a value that Wang Zhibo, who's responsible for providing our offices in Japan with reliable IT support, strongly endorses.","recruit.overseasCareers.employeeStory.content32":"Zhibo spends much of his time dashing back and forth between our two Tokyo offices and assisting our colleagues throughout Japan with their remote working needs. He was instrumental in building an intranet connecting the offices in Japan, a project which certainly kept him busy. In the space of just one month, he negotiated with over 30 companies and compared thousands of solutions before finally finding reaching an agreement with a suitable supplier. Thanks to Zhibo's hard work, the Japanese offices signed a contract with the new supplier to purchase an uninterruptible power supply, solving the connection issues which had disrupted their work for some time.","recruit.overseasCareers.experiencedHirePage.accommodationBusinessDetail":"Our Accommodation Department is the largest accommodation booking platform in mainland China, and the third largest globally. With 97 offices in mainland China and 21 overseas, the department provides around 400,000 hotels across mainland China and an additional 700,000 in over 300 countries and regions, amassing over 300 million room nights annually.","recruit.overseasCareers.experiencedHirePage.airTicketBusinessDetail":"Our Flights Department provides travelers all over the world with convenient, one-stop services for booking flight tickets, checking in for their flight, changing or canceling their tickets, and much more. Services are available in over 20 languages, and travelers can search for international flights with up to 6 segments, with a choice of over 200 countries and regions, over 5,000 cities, and over 450 airlines.","recruit.overseasCareers.employeeStory.update":"Posted at","recruit.overseasCareers.employeeStory.nextStory":"Next","recruit.overseasCareers.employeeStory.lastStory":"Previous","recruit.overseasCareers.employeeStory.content33":"Zhibo embodies the spirit of Trip.com Group, and we're incredibly grateful to him and all of our other employees who carry out their work with such amazing dedication!","recruit.overseasCareers.experiencedHirePage.financeBusinessDetail":"In 2017, Ctrip Finance was established with the goal of providing travel-related financial services. The department is committed to empowering the travel industry with comprehensive, data-driven financial technology, thereby assisting travelers and suppliers alike with their travel needs.","recruit.overseasCareers.experiencedHirePage.functionalDepartmentsDetail":"Our functional departments are responsible for the general running of Trip.com Group, covering marketing, PR, HR, user experience, legal, investment, investor relations, procurement, admin, internal control, auditing, strategic partnerships, and online card payments.","recruit.overseasCareers.experiencedHirePage.internationalBusinessDetail":"The International Business Department is responsible for the operation of our global travel brand—Trip.com. Its goal is to provide travelers throughout the world with one-stop travel booking services. Established in 2007, the department now operates across 27 countries and regions, spanning Asia, Europe, the Americas, and Oceania. Trip.com website content is available in 20 languages and 24/7 customer support is available in 18 languages, while payments can be made in 25 currencies.","recruit.overseasCareers.experiencedHirePage.marketingTeamDetail":"The Marketing Department integrates functions such as content production, public and governmental relations, live broadcasting, food and drink, global procurement, and foreign exchange. The department is committed to driving Trip.com Group's commercial growth across the travel industry by expanding its user base, creating high-quality content, and promoting popular products.","recruit.overseasCareers.experiencedHirePage.serviceTeamDetail":"Trip.com Group's Customer Support Department includes over 13,000 employees spread across global cities such as Shanghai, Tokyo, Edinburgh, Seoul, Nantong, and Guangzhou. The department provides 24/7 customer support in over 20 languages","recruit.overseasCareers.experiencedHirePage.technologyTeamDetail":"Our Technical Support team consists of thousands of expert engineers from all over the world, and provides comprehensive services to support the development and operations of Trip.com Group's many departments. With its creative and proactive approach to problem solving, the team adds considerable value to our products and services. Technical Support engineers have an in-depth knowledge of users' requirements and aim to produce an optimal experience through fast and stable systems, comprehensive products, and easy-to-use functions. A smooth and intuitive platform is key to the experience of our users.","recruit.overseasCareers.experiencedHirePage.trainTicketBusinessDetail":"Our Trains Department was established in 2013 and provides train ticket products and services covering over 40 routes in mainland China, and many more in countries and regions across Asia, Europe, and Oceania. The Trains Department has since expanded into other areas such as bus and boat tickets, and is one of Trip.com Group's fastest-growing departments.","recruit.overseasCareers.experiencedHirePage.vacationBusinessDetail":"The Vacations Department provides comprehensive services including group tours, free travel, tours and tickets, custom trips, cruises, themed travel, study trips, visas, insurance, car services, GlobalBuy, foreign exchange, and more. It offers users one-stop travel services with over 700,000 global travel products across 2,000 cities.","recruit.overseasCareers.experiencedHirePage.viewJob":"View All Jobs","recruit.overseasCareers.foot.about":"About us","recruit.overseasCareers.foot.aboutTrip":"About Trip.com Group","recruit.overseasCareers.foot.contact":"Contact us","recruit.overseasCareers.foot.news":"News","recruit.overseasCareers.foot.legalInformation":"Legal","recruit.overseasCareers.foot.privacyStatement":"Privacy Statement","recruit.overseasCareers.foot.sns":"Follow us","recruit.overseasCareers.foot.termsofUse":"Terms of Use","recruit.overseasCareers.foot.trip":"Trip.com","recruit.overseasCareers.foot.tripGroup":"Trip.com Group","recruit.overseasCareers.home.employeeStory":"Employee stories","recruit.overseasCareers.home.employeeStory1Headline":"I do what I love for a living","recruit.overseasCareers.home.employeeStory1Outline":"Most of all, I love meeting and learning from people from all walks of life.","recruit.overseasCareers.home.employeeStory2Headline":"More \"we\" than \"me\"","recruit.overseasCareers.home.employeeStory2Outline":"Even if we come from different backgrounds, I still feel there is more \"we\" than \"me\" in the team here.","recruit.overseasCareers.home.employeeStory3Outline":"Thanks to Zhibo's hard work, the Japanese offices signed a contract with the new supplier to purchase an uninterruptible power supply, solving the connection issues which had disrupted their work for some time.","recruit.overseasCareers.home.employeeStory3Headline":"The tech expert leading the charge","recruit.overseasCareers.home.group":"Trip.com Group","recruit.overseasCareers.home.introduction":"Trip.com Group provides travelers all over the world with a comprehensive suite of travel products, services, and content. Listed on NASDAQ in 2003 and HKEX in 2021, Trip.com Group's goal is to become the world's leading online travel brand.","recruit.overseasCareers.home.jobCategory":"Job type","recruit.overseasCareers.home.more":"Read more","recruit.overseasCareers.home.proposition":"Employer Value Proposition","recruit.overseasCareers.home.propositionIntro1Content":"Trip.com Group never stops dreaming big and aiming high. Our mission, vision, and focus on high quality enables us to pursue mastery of our craft to deliver the best possible solutions. By tackling challenges and pursuing excellence...","recruit.overseasCareers.home.propositionIntro1ContentFull":"Trip.com Group never stops dreaming big and aiming high. Our mission, vision, and focus on high quality enables us to pursue mastery of our craft to deliver the best possible solutions. By tackling challenges and pursuing excellence, we keep growing and bettering ourselves at the same time.","recruit.overseasCareers.home.propositionIntro1Title":"Strive for the top","recruit.overseasCareers.home.propositionIntro2Content":"We believe in creating a safe space, where discussion is open, ideas flourish and the best solutions win. Together as a team, we offer each other respect and support. In this way...","recruit.overseasCareers.home.propositionIntro2ContentFull":"We believe in creating a safe space, where discussion is open, ideas flourish, and the best solutions win. Together as a team, we respect and support each other. This allows us to build closer connections and make bigger achievements.","recruit.overseasCareers.home.propositionIntro2Title":"Create greatness together","recruit.overseasCareers.home.propositionIntro3Content":"Life is about much more than just work. Trip.com Group is here to support you in every aspect in and out of the workplace. At the same time, being in the travel industry allows us to harness our passion and embrace...","recruit.overseasCareers.home.propositionIntro3ContentFull":"Life is about much more than just work. Trip.com Group is here to support you in every aspect in and out of the workplace. At the same time, being in the travel industry allows us to harness our passion and embrace the traveler in our hearts to pursue the perfect lifetime trip for ourselves.","recruit.overseasCareers.home.propositionIntro3Title":"Celebrate a full life","recruit.overseasCareers.home.viewMoreJobs":"See more jobs","recruit.overseasCareers.jobDetail.requirement":"Requirement","recruit.overseasCareers.jobDetail.responsibility":"Job Description","recruit.overseasCareers.jobList.applyNow":"Apply","recruit.overseasCareers.jobList.businessUnit":"Department","recruit.overseasCareers.jobList.channel":"Contract Types","recruit.overseasCareers.jobList.city":"City","recruit.overseasCareers.jobList.confirmApply":"Confirm","recruit.overseasCareers.jobList.countryRegion":"Country/region","recruit.overseasCareers.jobList.emptySearch":"No results","recruit.overseasCareers.jobList.jobCategory":"Job Categories","recruit.overseasCareers.jobList.less":"Show less","recruit.overseasCareers.jobList.more":"Learn more","recruit.overseasCareers.jobList.otherSearch":"Try adjusting your filters and searching again","recruit.overseasCareers.jobList.noResult":"No matching jobs","recruit.overseasCareers.jobList.page":"Page","recruit.overseasCareers.jobList.recentlyPostedPositions":"Newest first","recruit.overseasCareers.tripLife.cultureLine10":"We recognize your contributions and accomplishments in your career journey by establishing result-driven performance assessments and various awards.","recruit.overseasCareers.tripLife.cultureLine12":"We believe that you're in charge of your own time. Therefore, we offer flexible working arrangements to allow you to have a more fulfilling life in and outside the workplace.","recruit.overseasCareers.jobList.search":"Filters","recruit.overseasCareers.tripLife.developmentLine1":"Channel your passion for travel","recruit.overseasCareers.tripLife.cultureLine4":"We provide employees with various benefits, including medical insurance, mental health support (EAP), vacation subsidies, along with competitive rewards, supporting our employees to live rich and fulfilling lives.","recruit.overseasCareers.tripLife.cultureLine3":"We offer financial and medical support","recruit.overseasCareers.tripLife.developmentLine2":"At Trip.com group, you can transform your love for travel into a career. We provide a wide range of OTA industry careers in our various departments, so you can get to choose the development opportunities that are best for you.","recruit.overseasCareers.jobList.searchCity":"Search cities","recruit.overseasCareers.tripLife.developmentLine3":"We're as passionate as you are about your development","recruit.overseasCareers.experiencedHirePage.viewAllJob":"View jobs","recruit.overseasCareers.common.present":"Present","recruit.overseasCareers.tripLife.cultureLine14":"We understand that it’s not easy to pursue a successful career while raising a family at the same time, so we provide benefits for working parents, such as childcare incentives, fertility benefits for female employees, and more.","recruit.overseasCareers.tripLife.cultureTitle":"Life at Trip.com Group","recruit.overseasCareers.common.NewFriend":"friend","recruit.overseasCareers.tripLife.cultureLine13":"We support working parents","recruit.overseasCareers.tripLife.cultureLine11":"Enjoy flexible working arrangements","recruit.overseasCareers.jobList.startYourNextJob":"Start your next job","recruit.overseasCareers.jobList.searchCountryRegion":"Search countries/regions","recruit.overseasCareers.tripLife.developmentLine4":"At Trip.com group, we have flexible performance management and assessment systems, a dual-channel promotion mechanism for rapid development, job rotation based on career development planning and internal hiring mechanisms that encourage the free movement of talent. We also have a rewarding incentive mechanism that helps us better discover, cultivate and retain top talents.","recruit.overseasCareers.jobList.reset":"Reset","recruit.overseasCareers.tripLife.developmentTitle":"Career development","recruit.overseasCareers.tripLife.cultureLine1":"Work alongside passionate and focused colleagues","recruit.overseasCareers.tripLife.cultureLine6":"We believe that maintaining a healthy lifestyle is important for the well-being of our employees, so we encourage you to take time away from your desk by providing team building, staff clubs, and other activities to keep you feeling productive and full of energy.","recruit.overseasCareers.tripLife.universityLine1":"We work together and learn together","recruit.overseasCareers.common.brands":"Brand and services","recruit.overseasCareers.tripLife.universityTitle":"Trip.com Group Growth Academy","recruit.overseasCareers.tripLife.universityLine2":"Get a step up at every stage of your career with access to industry-leading information and educational resources, from the company's latest strategy to professional skills, from personal competencies to team management practices. Trip.com Group Growth Academy has a range of exclusive training programs including our TMBA and TPMP courses.","recruit.overseasCareers.tripLife.cultureLine8":"We celebrate your special moments, whether it’s your birthday, work anniversary, or important cultural festivals. You'll feel right at home at Trip.com Group.","recruit.overseasCareers.tripLife.cultureLine7":"We celebrate important moments together","recruit.overseasCareers.tripLife.cultureLine2":"Trip.com Group fosters an environment where employees can give full reign to both their entrepreneurial spirit and attention to detail.","recruit.overseasCareers.tripLife.cultureLine5":"Embrace a healthy lifestyle","recruit.overseasCareers.tripLife.cultureLine9":"We reward your efforts","recruit.overseasCareers.home.whoWeAre":"About us","recruit.overseasCareers.home.about":"About","recruit.overseasCareers.common.experiencedHire":"Professionals","recruit.overseasCareers.experiencedHirePage.corporateTravelBusinessDetail":"Corporate Travel is mainland China's leading corporate travel management platform. It utilizes the latest technology to provide business travelers with a wide selection of flights, hotels, and more, as well as professional services and flexible management options. Trip.Biz is the platform of choice for over 11,000 large enterprises, including 250 of the Global Fortune 500 companies and over 100 of the Top 500 Enterprises of China. In addition, more than 360,000 small and medium-sized enterprises have registered with Trip.Biz, of which 37,000 are active users.","recruit.overseasCareers.jobDetail.share":"Share to","recruit.overseasCareers.jobDetail.update":"Update","recruit.overseasCareers.jobDetail.jobId":"Job ID","recruit.overseasCareers.recrEmployeeType.Regular":"Regular ","recruit.overseasCareers.recrEmployeeType.Intern_Long_Term":"Internship","recruit.overseasCareers.recrEmployeeType.Temporary":"Temporary ","recruit.overseasCareers.mobile.back":"Back","recruit.overseasCareers.mobile.Placeholder":"From：a job search","recruit.overseasCareers.employeeStory.content11all":"Ma Yuning, a recent graduate from Manchester University, is passionate about travel, and it was this passion which inspired her to join Trip.com Group. As an Accommodation General Trainee, she's constantly learning new things about the travel industry, and with the help of cutting edge technology and big data, providing hotel partners with precise insight and innovative solutions.\n\nYuning says: \"Working at Trip.com Group, I have the chance to do what I love while broadening my skillset. I'm excited to be working at the forefront of the travel industry, and helping our hotel partners to achieve their goals. But most of all, I love meeting and learning from people from all walks of life.\"\n\nThis is only the start of Yuning's journey, and we're confident that she'll continue to go from strength to strength and achieve her professional goals.","recruit.overseasCareers.employeeStory.content21all":"Bettina Sanada puts her multilingual skills to good use in our International Business Dept., where she's responsible for marketing and operations.\n\nFluent in English, German, Japanese, and Chinese, she has no problem communicating with colleagues from different backgrounds. Bettina's role provides her with ample opportunities to express her ideas and engage in productive collaboration. \"Even if our personal backgrounds are not that similar,\" says Bettina, \"I still feel there is more \"we\" than \"me\" in the team here. We all want to expand our business on a global scale, so everyone listens to and respects the opinions of everyone else. I love being able to express myself and draw upon my strengths.\"\n\nTrip.com Group creates a positive working environment where people are encouraged to achieve their potential. Mutual interaction and encouragement are central to what we do.","recruit.overseasCareers.employeeStory.content31all":"At Trip.com Group, we want everyone to feel a real sense of purpose about what they do. This is a value that Wang Zhibo, who's responsible for providing our offices in Japan with reliable IT support, strongly endorses.\r\n\r\nZhibo spends much of his time dashing back and forth between our two Tokyo offices and assisting our colleagues throughout Japan with their remote working needs. He was instrumental in building an intranet connecting the offices in Japan, a project which certainly kept him busy. In the space of just one month, he negotiated with over 30 companies and compared thousands of solutions before finally finding reaching an agreement with a suitable supplier. Thanks to Zhibo's hard work, the Japanese offices signed a contract with the new supplier to purchase an uninterruptible power supply, solving the connection issues which had disrupted their work for some time.\r\n\r\nZhibo embodies the spirit of Trip.com Group, and we're incredibly grateful to him and all of our other employees who carry out their work with such amazing dedication!","recruit.overseasCareers.employeeStory.content11title":"What really excites me is meeting and learning from people from all walks of life.","recruit.overseasCareers.employeeStory.content21title":"Even if we come from different backgrounds, I still feel there is more \"we\" than \"me\" in the team here.","recruit.overseasCareers.employeeStory.content31title":" Thanks to Zhibo's hard work, the Japanese offices signed a contract with the new supplier to purchase an uninterruptible power supply, solving the connection issues which had disrupted their work for some time.","recruit.overseasCareers.jobFamilyGroup.other_000":"Trainee","recruit.overseasCareers.commonProblem1":"FAQ","recruit.overseasCareers.commonProblem2":"1. Can I apply for multiple job positions at the same time?","recruit.overseasCareers.commonProblem3":"Yes, you can apply for multiple job positions at the same time, but we recommend that you apply for job positions that best match your skills, experience, and passion.","recruit.overseasCareers.commonProblem4":"2. When will I receive my interview invitation after I submit my application?","recruit.overseasCareers.commonProblem5":"If you're selected to advance to the interview stage, you'll usually receive a call from HR within 5–10 working days after submitting your application. Don't worry if they can't get through to you the first time, they'll keep trying, so remember to keep your phone on! If you don't hear from us within this time frame, it's probably because your experience doesn't quite match with the position you applied for. If that's the case, we encourage you to check out our other positions.","recruit.overseasCareers.commonProblem6":"If you don't hear from us within this time frame, it's probably because your experience doesn't quite match with the position you applied for. If that's the case, we encourage you to check out our other positions.","recruit.overseasCareers.commonProblem7":"3. How do I check my interview result?","recruit.overseasCareers.commonProblem10":"You'll receive a phone call from HR who'll give you details about your offer, including the rank and salary of the role. If you accept during the call, we'll send the finalized offer to you by email.","recruit.overseasCareers.commonProblem11":"5. If my application isn't successful, will I still be contacted?","recruit.overseasCareers.commonProblem12":"If you haven't heard back within 2 weeks of submitting your application, the chances are that the position has already been filled. We will keep your resume and interview notes on file. If there is a new position which is more suitable to you, we will reach out to you.","recruit.overseasCareers.commonProblem13":"6. Reminder to Candidates to Beware of Recruitment Scams","recruit.overseasCareers.commonProblem14":"We would like to draw your attention to recent incidents where candidates have fallen prey to recruitment scams. Scammers have been posing as employees of Trip.com Group or third-party recruiting agencies and sending interview and job offer information through text messages or online platforms in order to steal personal information or money.Please be advised that Trip.com Group never conducts a purely text-based interview through instant messaging apps. Formal job offers will be sent via official email, with all official emails originating from the @trip.com or @jobs.trip.com domain. Additionally, Trip.com Group never charges candidates any fees at any stage of the recruitment process.Should you have any questions, please do not hesitate to contact us at careers@trip.com. We encourage you to remain vigilant and report any suspicious activity to us promptly.","recruit.overseasCareers.commonProblem8":"You can click on the top right corner of the Trip.com Group Careers website to access your personal profile. From here, you can see a record of your applications, track the progress of interviews, and contact your HR if you have any questions.","recruit.overseasCareers.commonProblem9":"4. How will I hear about any offers I receive?","recruit.overseasCareers.leadership1":"Our competency model shows the profile of a great Trip.com Group employee: Critical Thinking, Pursuit of Excellence, and Self Motivation.","recruit.overseasCareers.leadership10":"Trip.com Group is a leading one-stop travel service provider comprising of Trip.com, Ctrip, Skyscanner, and Qunar. Founded in 1999 and listed on Nasdaq in 2003 and HKEX in 2021, Trip.com Group has become one of the most popular and influential travel companies in the world.","recruit.overseasCareers.leadership11":"Scan the QR code to apply","recruit.overseasCareers.leadership12":"For more information about this role, head on over to careers.trip.com","recruit.overseasCareers.leadership2":"Leadership Competency Model","recruit.overseasCareers.leadership3":"Values","recruit.overseasCareers.leadership4":"Reflection","recruit.overseasCareers.leadership6":"Action","recruit.overseasCareers.leadership7":" ","recruit.overseasCareers.leadership8":"Motivation","recruit.overseasCareers.leadership9":" ","recruit.overseasCareers.process1":"Recruitment Process","recruit.overseasCareers.process10":"Complete HR interview (there may be multiple rounds, depending on the role)","recruit.overseasCareers.process11":"Join Trip.com","recruit.overseasCareers.process13":"Complete a background check","recruit.overseasCareers.process2":"We're always on the lookout for reliable, bright, and talented individuals who can help us deliver the perfect trip for travelers all over the world. Interested in joining us? Here's how it works:","recruit.overseasCareers.process3":"Apply","recruit.overseasCareers.process4":"Search for job positions","recruit.overseasCareers.process6":"Apply","recruit.overseasCareers.process7":"Interviews","recruit.overseasCareers.process8":"Receive your interview invitation","recruit.overseasCareers.process9":"Complete professional interview","recruit.overseasCareers.values1":"Here at Trip.com, we share a set of core values: CTRIP. It reflects the most recognized code of conduct, which is used to guide all aspects of our daily work behavior.","recruit.overseasCareers.values10":"Integrity","recruit.overseasCareers.values11":"Truthfulness is everything","recruit.overseasCareers.values12":"Speak your mind","recruit.overseasCareers.values14":"Seek for the win-win","recruit.overseasCareers.values4":"Teamwork","recruit.overseasCareers.values6":"Transparency builds trust","recruit.overseasCareers.values7":"Embrace the differences","recruit.overseasCareers.values8":"Responsibility","recruit.overseasCareers.values9":"Break all boundaries","recruit.overseasCareers.leadership5":" ","recruit.overseasCareers.process14":"Join Trip.com","recruit.overseasCareers.process5":"Finalize your resume","recruit.overseasCareers.values13":"Partner","recruit.overseasCareers.values5":"Put we before me","recruit.overseasCareers.process12":"Receive your offer","recruit.overseasCareers.values2":"Customer Centric","recruit.overseasCareers.values3":"Be the customer","recruit.overseasCareers.jobDetail.nojob":"The job you have viewed has been removed, you can view other open jobs and apply.","recruit.overseasCareers.jobNeed":"Name of requisition","recruit.overseasCareers.leadership13":"Our Team","recruit.overseasCareers.process15":"Step1","recruit.overseasCareers.process16":"Step2","recruit.overseasCareers.process17":"Step3","recruit.overseasCareers.process18":"Complete HR interview","recruit.overseasCareers.add2":"Critical Thinking, Pursuit of Excellence, Self-motivation","recruit.overseasCareers.add1":"Leadership competency model","recruit.overseasCareers.add3":"Our Leadership Model provides the blueprint for being an excellent Trip.com employee.","recruit.overseasCareers.locationCountry.TUR":"Turkey","recruit.overseasCareers.locationCity.CO0060":"Zhengzhou","recruit.overseasCareers.locationCity.Kaifeng_Hier":"Kaifeng","recruit.overseasCareers.locationCity.Luoyang_Hier":"Luoyang","recruit.overseasCareers.locationCity.Pingdingshan_Hier":"Pingdingshan","recruit.overseasCareers.locationCity.Xinxiang_Hier":"Xinxiang","recruit.overseasCareers.locationCity.Nanyang_Hier":"Nanyang","recruit.overseasCareers.locationCity.CO0012":"Wuhan","recruit.overseasCareers.locationCity.Huangshi_Hier":"Huangshi","recruit.overseasCareers.locationCity.Shiyan_Hier":"Shiyan","recruit.overseasCareers.locationCity.Yichang_Hier":"Yichang","recruit.overseasCareers.locationCity.Xiangyang_Hier":"Xiangyang","recruit.overseasCareers.locationCity.Jingzhou_Hier":"Jingzhou","recruit.overseasCareers.loc onCity.CO0006":"Nantong","recruit.overseasCareers.locationCity.CO0063":"Rugao","recruit.overseasCareers.locationCity.CO0062":"Nanchang","recruit.overseasCareers.locationCity.Jiujiang_Hier":"Jiujiang","recruit.overseasCareers.locationCity.Ganzhou_Hier":"Ganzhou","recruit.overseasCareers.locationCity.CO0015":"Chongqing","recruit.overseasCareers.locationCity.CO0050":"Guiyang","recruit.overseasCareers.locationCity.Zunyi_Hier":"Zunyi","recruit.overseasCareers.locationCity.CO0038":"Kunming","recruit.overseasCareers.locationCity.CO0026":"Lijiang","recruit.overseasCareers.locationCity.Lasa_Hier":"Lhasa","recruit.overseasCareers.locationCity.CO0032":"Xi'an","recruit.overseasCareers.locationCity.CO0051":"Lanzhou","recruit.overseasCareers.locationCity.CO0102":"Xining","recruit.overseasCareers.locationCity.CO0053":"Yinchuan","recruit.overseasCareers.locationCity.CO0049":"Urumqi","recruit.overseasCareers.locationCity.CO0010":"Shenzhen","recruit.overseasCareers.employeeStory.NewContent1":"We’re delighted to introduce Gulce Karsli Rozenveld, one of our Regional Directors for Europe. Let’s see how working at Trip.com Group allows her to feel inspired.\n\n“I work with people from all over the world, from different cultures. Every day you learn something new about an area or product and this pushes me towards being the best version of myself. It enables me to expand my perspective, knowledge and efficiency. That empowers me! Trip.com Group really enabled me to see that no matter where you are in the world and which culture you belong to, it is possible to harness great relationships at work, feel like you are part of a team, and find many people who will help you on your day-to-day endeavors and keep your day lively and busy! At Trip.com Group, you never feel alone.”\n\nAt Trip.com Group, we embrace the differences and every employee here can speak his or her mind. From talented colleagues to supportive mangers, you are part of a team that learns and wins together.","recruit.overseasCareers.employeeStory.NewContent2":"Meet Edmund Weng, our Regional Director for Singapore and Malaysia market, who joined Trip.com Group in 2014. \n\nAs he said, “Joining Trip was one of the best career decisions I made in my life. Over here in Trip, the culture is very inclusive which means the ideas are always discussed and tested out regardless of your position.\n\nIn Singapore and Malaysia, we came a long way since about 6 years ago and I am personally proud as to how Trip have grown in serving the travel needs of customers in both countries. Trip is a dynamic world-class OTA platform and equal opportunity employer for your career to take off!”\n\nAt Trip.com Group, we like things simple and straight forward. We nurture a safe space and encourage all employees to express their thoughts. We embrace diversity and inclusion to ensure every individual here is respected, valued and supported.","recruit.overseasCareers.employeeStory.NewContent3":"Ori Richter joined Trip.com Group in August 2018 as he wanted to get familiar with the customer service world. Starting as a customer service agent in the European hub of Trip.com Group provided Ori the basis for learning and developing within the business while providing first class support to Trip’s customers.\n\nWithin 4.5 years Ori progressed within Trip.com Group, he has become the European Operations manager for the flight department in charge of our European customer service providing support in 12 languages covered by our 18 teams across 3 continents.\n\nOri says: “Trip.com Group is an amazing school! Working in a global business like this, allows one to get familiar with different kinds of operations, methods of work, various cultures and a large level of support and opportunities. With every day that passes, my skillset broadens and allows me to grow professionally and personally. Since day one at Trip I really enjoyed my job, which for me is the key to succeed in whatever you do.”","recruit.overseasCareers.employeeStory.NewSummary1":"Trip.com Group really enabled me to see that no matter where you are in the world and which culture you belong to, it is possible to harness great relationships at work and feel like you are part of a team.","recruit.overseasCareers.employeeStory.NewSummary2":"Trip is a dynamic world-class OTA platform and equal opportunity employer for your career to take off","recruit.overseasCareers.employeeStory.NewSummary3":"Trip.com Group is an amazing school! Working in a global business like this, allows one to get familiar with\ndifferent kinds of operations, methods of work, various cultures and a large level of support and opportunities.","recruit.overseasCareers.employeeStory.NewTitle2":"Take off in an inclusive organization","recruit.overseasCareers.employeeStory.NewTitle1":"Thrive in a supportive team","recruit.overseasCareers.employeeStory.NewTitle3":"Grow in a world-class platform","recruit.overseasCareers.locationCity.Abu_Dhabi_Hier":"Abu Dhabi","recruit.overseasCareers.homgpageIdentityVerification.verificationCode":"Verification code","recruit.overseasCareers.homgpageIdentityVerification.emailHelpText":"Fill in your email address","recruit.overseasCareers.homgpageIdentityVerification.emailEditButton":"Maintain email address","recruit.overseasCareers.homgpageIdentityVerification.email":"Email Address","recruit.overseasCareers.homgpageIdentityVerification.phoneHelpText":"Fill in your phone number","recruit.overseasCareers.homgpageIdentityVerification.phoneEditButton":"Maintain phone number","recruit.overseasCareers.homgpageIdentityVerification.phone":"Phone Number","recruit.overseasCareers.homgpageIdentityVerification.nameHelpText":"Fill in your full name","recruit.overseasCareers.homgpageIdentityVerification.nameEditButton":"Maintain full name","recruit.overseasCareers.homgpageIdentityVerification.name":"Full Name","recruit.overseasCareers.locations.france":"France","recruit.overseasCareers.locations.europe":"Europe","recruit.overseasCareers.loca st well-known travel brands in China. Headquartered in Shanghai, it has over 30,000 employees based in offices in 95 locations in China and 22 international branches. Ctrip’s integrated offering provides its members with a wide range of digital applications, hotel and air ticket reservations, attractions, tour packages, business travel management and travel-related content.","recruit.overseasCareers.brand.3.content":"Founded in 2003, Skyscanner is a leading travel marketplace dedicated to putting travellers first. Skyscanner helps millions of people in 52 countries and over 30 languages find the best travel options for flights, hotels and car hire every month. Skyscanner is available on desktop, mobile web and its highly rated app has 100 million downloads. Working with 1,200 travel partners, Skyscanner’s mission is to lead the global transformation to modern and sustainable travel.","recruit.overseasCareers.brand.4.content":"Qunar is a leading travel services platform in China. It performs searches over 9,000 travel agency websites in real time, covering more than 680,000 domestic and international routes worldwide. The platform has wide search and reservation coverage worldwide including hotels, vacation routes, and destination tickets and entertainment listings.","recruit.overseasCareers.home.proposition.2.bgImg":"https://images3.c-ctrip.com/HrCareers/CareersHome/EVP2.jpg?__ares_maxage=0","recruit.overseasCareers.home.proposition.1.bgImg":"https://images3.c-ctrip.com/HrCareers/CareersHome/EVP3.jpg?__ares_maxage=0","recruit.overseasCareers.home.proposition.3.bgImg":"https://images3.c-ctrip.com/HrCareers/CareersHome/EVP1.jpg?__ares_maxage=0","recruit.overseasCareers.home.proposition.1.bgcolor":"#287DFA","recruit.overseasCareers.home.proposition.2.bgcolor":"#00C3D2","recruit.overseasCareers.home.proposition.3.bgcolor":"#7378E6","recruit.overseasCareers.home.DomesticRecruitment":"Global Recruitment","recruit.overseasCareers.home.OverseasRecruitment":"中国大陆招聘","recruit "recruit.overseasCareers.locations.unitedKingdom.content":"thailandthailandthailandthailandthailandthailandthailandthailandthailandthailandthailandthailandthailandthailandthailand","recruit.overseasCareers.locations.unitedKingdom.img":"https://pages.ares.ctripcorp.com/HrCareers/test/location.png","recruit.overseasCareers.locations.japan.content":"thailandthailandthailandthailandthailandthailandthailandthailandthailandthailandthailandthailandthailandthailandthailand","recruit.overseasCareers.locations.japan.img":"https://pages.ares.ctripcorp.com/HrCareers/test/location.png","recruit.overseasCareers.locations.title":"Featured Offices","recruit.overseasCareers.locations.data.title":"Start your Trip","recruit.overseasCareers.locations.1":"Shanghai,China","recruit.overseasCareers.locations.2":"Beijing,China","recruit.overseasCareers.locations.3":"London & Edinburgh,United Kingdom","recruit.overseasCareers.locations.4":"Tokyo,Japan","recruit.overseasCareers.locations.5":"Manila & Cebu,Philippines","recruit.overseasCareers.locations.6":"Seoul,South Korea","recruit.overseasCareers.locations.7":"Kuala Lumpur,Malaysia","recruit.overseasCareers.locations.8":"Bangkok,Thailand","recruit.overseasCareers.locations.9":"Nantong,China","recruit.overseasCareers.locations.10":"Guangzhou,China","recruit.overseasCareers.locations.11":"Chengdu,China","recruit.overseasCareers.locations.12":"Qingdao,China","recruit.overseasCareers.locations.1.content":"Trip.com Group was founded in 1999 at the Shanghai Tianwen Building, and it was here that our trip began. In 2015, we relocated, making our new home in the SOHO building - a Shanghai landmark that was renowned architect Zaha Hadid's first project in China. The streamlined exterior of our new headquarters resembles a high-speed train, symbolizing our relentless pursuit and rapid progress in all our business endeavors. Passionate, sincere, and rigorous, our dedicated employees use this modern space to create, innovate, and achieve their collective dreams!","recruit.overseasCareers.locations.2.content":"Beijing, with its glittering skyscrapers and rich ancient history, serves as China's center of politics, culture, international exchange, and technological innovation. It's also a place where passionate young people come to achieve their dreams. In 2000, Trip.com's regional headquarters for North China were founded in Beijing, injecting powerful momentum into the company's business lines in northern China and contributing greatly to our business development. Our employees in Beijing can achieve their goals while immersing themselves in the history and culture of this prosperous city - the perfect place for lovers of travel!","recruit.overseasCareers.locations.3.content":"Trip.com Group is expanding all across Europe, and the UK is at the heart of our operations in the region. We have hundreds of employees based in our UK offices in London and Edinburgh, supporting all areas of our business.\r<br>\r\n\r\r\nOur London Office is based at 70 St Mary Axe in the heart of The City of London and near the major railway station Liverpool Street. Informally our building is known as the Can of Ham due to its shape, which is easily recognizable amidst the London skyline. From site operations to business development, the London Office is powering Trip.com Group's growth in the region, and globally.\r<br>\r\n\r\r\nOur Edinburgh office is vibrant and dynamic, filled with talented individuals who are passionate about their work. It is known for its welcoming and inclusive atmosphere, where teamwork and collaboration are highly valued. As a multi-language call center, our Edinburgh team provides 12 spoken language services to meet the demands of global travelers. And as we expand our services globally, our Edinburgh customer support team continues to grow and serve more customers worldwide. ","recruit.overseasCareers.locations.4.content":"Our Japan branch was established in 2015 and we currently have 7 offices in 6 cities across the country, including Hokkaido, Tokyo, Nagoya, Osaka, Fukuoka, and Okinawa. To better serve Japanese travelers, we have a dedicated customer support center in Tokyo that provides 24/7 support in Japanese. In November 2022, we moved our Japan headquarters to a new building at Tokyo Station. The offices are bright, spacious, and equipped with advanced facilities, creating a comfortable, efficient, and healthy working environment for our employees. Here, every employee has the space they need to fully realize their potential, thrive, and grow.","recruit.overseasCareers.locations.5.content":"The Philippine offices are located in key Central Business Districts throughout the country - Taguig City, Makati City, and Cebu City. They house several business units with over 600 employees.\r<br>\r\n \r\r\nThe Taguig office, where the majority of the workforce is based, is dedicated to customer support and provides 24/7 services to English-speaking users all over the world. The Makati and Cebu offices host marketing teams that maintain strong hotel partnerships across the supply network. \r<br>\r\n\r\r\nAs part of its exciting global expansion strategy, Trip.com Group Philippines' growing workforce supports the group's vibrant presence in Asia while focusing on the mission to pursue the perfect trip for a better world.","recruit.overseasCareers.locations.6.content":"Welcome to the South Korea office! As you dig deeper into the lively and historical heart of Seoul, you will find yourself standing right in front of our offices, which are surrounded by many traditional and unique landmarks in Jongro.\r<br>\r\n  \r\r\nOur Guanghwamun office is located in D-Tower, and blends harmoniously with its surroundings to create a diverse urban landscape. Our Jonggak office, home to Trip.com Group's Korean Speaking Customer Support Center, stands at the crossroads of the two faces of Seoul. One way takes you to Insadong, where the narrow, cobblestoned streets are full of heritage, art galleries, and museums, while the other will take you to Eulji-ro, where you'll find stylish hangouts that represent the city's modern-retro side.\r<br>\r\n\r\r\nIf you have a thirst for travel, the best way to slake it is to pursue a perfect trip every day with Trip.com Group in South Korea. We're proud to provide a global platform for you to explore your career possibilities and make a worldwide impact.","recruit.overseasCareers.locations.7.content":"The Malaysia office is located at the Exchange 106. The newest of Kuala Lumpur's iconic buildings, it is 106 floors high, making it one of the tallest buildings in the world. And just as this building towers over the city, so Trip.com Group strives to reach the top by pursuing excellence in everything we do. \r<br>\r\n\r\r\nWe provide a platform to support our talent, enabling careers that celebrate success and nurture growth. Looking out over KL's iconic skyline from their workplace, the team in Malaysia aspire to embrace more possibilities and pursue the perfect trip for a better world.","recruit.overseasCareers.locations.8.content":"Welcome to Trip.com Group Thailand! As one of the top tourist destinations worldwide, Thailand has always been an important market for Trip.com Group. So far we have offices located in Bangkok, Chiang Mai, and Phuket.\r<br>\r\n\r\r\nOur Bangkok Office is strategically situated in the dynamic Ratchada-Rama 9 district (Bangkok's \"New CBD\"). The office is conveniently located, with direct access to the MRT Rama 9 station, expressways, and multiple other transport choices, meaning all employees can commute hassle-free.\r<br>\r\n\r\r\nJoin us in our Bangkok Office, a hub of innovation and collaboration, where diverse backgrounds converge to produce cutting-edge ideas. Experience the pulse of the \"New CBD\" as we shape the future together","recruit.overseasCareers.locations.9.content":"In December 2008, Trip.com's Nantong Customer Support Center was established, making it the company's 12th branch. With over 12,000 agents, it is currently the tourism industry's largest single-unit call center anywhere in the world. Here, a pair of headphones connects us with customers from all around the globe. We provide friendly, simple, proactive, and trustworthy support to each and every customer, and continuously strive to deliver a high-quality service that sets industry standards.","recruit.overseasCareers.locations.10.content":"In the year 2000, we established our South China regional headquarters in Guangzhou. This city holds great historical significance as an important port along the Maritime Silk Road and has been a bustling commercial hub for global trade and services for centuries. Here, the collective strength and wisdom of our business development, operations, services, and technology teams come together. There's nothing our Guangzhou team likes more than to enjoy a cup of tea in their downtime. The cooperation philosophy here is based on openness, inclusiveness, and mutual benefit. Together, we are deeply rooted in the Greater Bay Area, embracing the vibrant spirit of Guangzhou.","recruit.overseasCareers.locations.11.content":"Our Chengdu branch was established in 2001, making it one of our first. Over the past 23 years, this branch has grown into the headquarters of the West China region, with a self-built office space of 50,000 square meters located in Chengdu's High-tech Zone. Its business scope covers provinces and municipalities including Sichuan, Chongqing, Shaanxi, Gansu, Qinghai, Ningxia, Xinjiang, Yunnan, Guizhou, and Tibet. The branch is responsible for implementing Trip.com Group's domestic strategies within mainland China, with domestic teams being based here. At this vibrant location, thousands of enthusiastic team members from West China come together, driven by their passion and unwavering commitment. They remain true to their initial aspirations, strive to make progress, and deliver outstanding achievements.","recruit.overseasCareers.locations.12.content":"In 2001, Trip.com established our office in Qingdao, where a group of young individuals, driven by their passion for travel, set out to explore and showcase the natural landscapes, warm hospitality, and cultural heritage of Shandong Province. In the decades since, our commitment to excellence has not only revitalized the tourism industry in Shandong, but also in Zhejiang, Jiangsu, Fujian, Anhui, and beyond. We look forward to welcoming you to the forefront of China's eastern region, where we can grow and thrive together.","recruit.overseasCareers.locations.1.img":"https://images3.c-ctrip.com/HrCareers/CareersLocation/Shanghai.jpg?__ares_maxage=0","recruit.overseasCareers.locations.2.img":"https://images3.c-ctrip.com/HrCareers/CareersLocation/BeiJing.png?__ares_maxage=0","recruit.overseasCareers.locations.3.img":"https://images3.c-ctrip.com/HrCareers/CareersLocation/UnitedKingdom.png?__ares_maxage=0","recruit.overseasCareers.locations.4.img":"https://images3.c-ctrip.com/HrCareers/CareersLocation/Japan.jpg?__ares_maxage=0","recruit.overseasCareers.locations.5.img":"https://images3.c-ctrip.com/HrCareers/CareersLocation/Philippines.jpg?__ares_maxage=0","recruit.overseasCareers.locations.6.img":"https://images3.c-ctrip.com/HrCareers/CareersLocation/SouthKorea.jpg?__ares_maxage=0","recruit.overseasCareers.locations.7.img":"https://images3.c-ctrip.com/HrCareers/CareersLocation/Malaysia.png?__ares_maxage=0","recruit.overseasCareers.locations.8.img":"https://images3.c-ctrip.com/HrCareers/CareersLocation/Thailand.png?__ares_maxage=0","recruit.overseasCareers.locations.9.img":"https://images3.c-ctrip.com/HrCareers/CareersLocation/Nantong.png?__ares_maxage=0","recruit.overseasCareers.locations.10.img":"https://images3.c-ctrip.com/HrCareers/CareersLocation/Guangzhou.jpg?__ares_maxage=0","recruit.overseasCareers.locations.11.img":"https://images3.c-ctrip.com/HrCareers/CareersLocation/ChengDu.jpg?__ares_maxage=0","recruit.overseasCareers.locations.12.img":"htt
