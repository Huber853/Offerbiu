ailandthailandthailandthailandthailandthailandthailandthailandthailandthailandthailandthailandthailandthailandthailand","recruit.overseasCareers.locations.korea.img":"https://pages.ares.ctripcorp.com/HrCareers/test/location.png","recruit.overseasCareers.locations.malaysia.content":"thailandthailandthailandthailandthailandthailandthailandthailandthailandthailandthailandthailandthailandthailandthailand","recruit.overseasCareers.locations.malaysia.img":"https://pages.ares.ctripcorp.com/HrCareers/test/location.png","recruit.overseasCareers.locations.unitedKingdom.content":"thailandthailandthailandthailandthailandthailandthailandthailandthailandthailandthailandthailandthailandthailandthailand","recruit.overseasCareers.locations.unitedKingdom.img":"https://pages.ares.ctripcorp.com/HrCareers/test/location.png","recruit.overseasCareers.locations.japan.content":"thailandthailandthailandthailandthailandthailandthailandthailandthailandthailandthailandthailandthailandthailandthailand","recruit.overseasCareers.locations.japan.img":"https://pages.ares.ctripcorp.com/HrCareers/test/location.png","recruit.overseasCareers.locations.title":"Featured Offices","recruit.overseasCareers.locations.data.title":"Start your Trip","recruit.overseasCareers.locations.1":"Shanghai,China","recruit.overseasCareers.locations.2":"Beijing,China","recruit.overseasCareers.locations.3":"London & Edinburgh,United Kingdom","recruit.overseasCareers.locations.4":"Tokyo,Japan","recruit.overseasCareers.locations.5":"Manila & Cebu,Philippines","recruit.overseasCareers.locations.6":"Seoul,South Korea","recruit.overseasCareers.locations.7":"Kuala Lumpur,Malaysia","recruit.overseasCareers.locations.8":"Bangkok,Thailand","recruit.overseasCareers.locations.9":"Nantong,China","recruit.overseasCareers.locations.10":"Guangzhou,China","recruit.overseasCareers.locations.11":"Chengdu,China","recruit.overseasCareers.locations.12":"Qingdao,China","recruit.overseasCareers.locations.1.content":"Trip.com Group was founded in 1999 at the Shanghai Tianwen Building, and it was here that our trip began. In 2015, we relocated, making our new home in the SOHO building - a Shanghai landmark that was renowned architect Zaha Hadid's first project in China. The streamlined exterior of our new headquarters resembles a high-speed train, symbolizing our relentless pursuit and rapid progress in all our business endeavors. Passionate, sincere, and rigorous, our dedicated employees use this modern space to create, innovate, and achieve their collective dreams!","recruit.overseasCareers.locations.2.content":"Beijing, with its glittering skyscrapers and rich ancient history, serves as China's center of politics, culture, international exchange, and technological innovation. It's also a place where passionate young people come to achieve their dreams. In 2000, Trip.com's regional headquarters for North China were founded in Beijing, injecting powerful momentum into the company's business lines in northern China and contributing greatly to our business development. Our employees in Beijing can achieve their goals while immersing themselves in the history and culture of this prosperous city - the perfect place for lovers of travel!","recruit.overseasCareers.locations.3.content":"Trip.com Group is expanding all across Europe, and the UK is at the heart of our operations in the region. We have hundreds of employees based in our UK offices in London and Edinburgh, supporting all areas of our business.\r<br>\r\n\r\r\nOur London Office is based at 70 St Mary Axe in the heart of The City of London and near the major railway station Liverpool Street. Informally our building is known as the Can of Ham due to its shape, which is easily recognizable amidst the London skyline. From site operations to business development, the London Office is powering Trip.com Group's growth in the region, and globally.\r<br>\r\n\r\r\nOur Edinburgh office is vibrant and dynamic, filled with talented individuals who are passionate about their work. It is known for its welcoming and inclusive atmosphere, where teamwork and collaboration are highly valued. As a multi-language call center, our Edinburgh team provides 12 spoken language services to meet the demands of global travelers. And as we expand our services globally, our Edinburgh customer support team continues to grow and serve more customers worldwide. ","recruit.overseasCareers.locations.4.content":"Our Japan branch was established in 2015 and we currently have 7 offices in 6 cities across the country, including Hokkaido, Tokyo, Nagoya, Osaka, Fukuoka, and Okinawa. To better serve Japanese travelers, we have a dedicated customer support center in Tokyo that provides 24/7 support in Japanese. In November 2022, we moved our Japan headquarters to a new building at Tokyo Station. The offices are bright, spacious, and equipped with advanced facilities, creating a comfortable, efficient, and healthy working environment for our employees. Here, every employee has the space they need to fully realize their potential, thrive, and grow.","recruit.overseasCareers.locations.5.content":"The Philippine offices are located in key Central Business Districts throughout the country - Taguig City, Makati City, and Cebu City. They house several business units with over 600 employees.\r<br>\r\n \r\r\nThe Taguig office, where the majority of the workforce is based, is dedicated to customer support and provides 24/7 services to English-speaking users all over the world. The Makati and Cebu offices host marketing teams that maintain strong hotel partnerships across the supply network. \r<br>\r\n\r\r\nAs part of its exciting global expansion strategy, Trip.com Group Philippines' growing workforce supports the group's vibrant presence in Asia while focusing on the mission to pursue the perfect trip for a better world.","recruit.overseasCareers.locations.6.content":"Welcome to the South Korea office! As you dig deeper into the lively and historical heart of Seoul, you will find yourself standing right in front of our offices, which are surrounded by many traditional and unique landmarks in Jongro.\r<br>\r\n  \r\r\nOur Guanghwamun office is located in D-Tower, and blends harmoniously with its surroundings to create a diverse urban landscape. Our Jonggak office, home to Trip.com Group's Korean Speaking Customer Support Center, stands at the crossroads of the two faces of Seoul. One way takes you to Insadong, where the narrow, cobblestoned streets are full of heritage, art galleries, and museums, while the other will take you to Eulji-ro, where you'll find stylish hangouts that represent the city's modern-retro side.\r<br>\r\n\r\r\nIf you have a thirst for travel, the best way to slake it is to pursue a perfect trip every day with Trip.com Group in South Korea. We're proud to provide a global platform for you to explore your career possibilities and make a worldwide impact.","recruit.overseasCareers.locations.7.content":"The Malaysia office is located at the Exchange 106. The newest of Kuala Lumpur's iconic buildings, it is 106 floors high, making it one of the tallest buildings in the world. And just as this building towers over the city, so Trip.com Group strives to reach the top by pursuing excellence in everything we do. \r<br>\r\n\r\r\nWe provide a platform to support our talent, enabling careers that celebrate success and nurture growth. Looking out over KL's iconic skyline from their workplace, the team in Malaysia aspire to embrace more possibilities and pursue the perfect trip for a better world.","recruit.overseasCareers.locations.8.content":"Welcome to Trip.com Group Thailand! As one of the top tourist destinations worldwide, Thailand has always been an important market for Trip.com Group. So far we have offices located in Bangkok, Chiang Mai, and Phuket.\r<br>\r\n\r\r\nOur Bangkok Office is strategically situated in the dynamic Ratchada-Rama 9 district (Bangkok's \"New CBD\"). The office is conveniently located, with direct access to the MRT Rama 9 station, expressways, and multiple other transport choices, meaning all employees can commute hassle-free.\r<br>\r\n\r\r\nJoin us in our Bangkok Office, a hub of innovation and collaboration, where diverse backgrounds converge to produce cutting-edge ideas. Experience the pulse of the \"New CBD\" as we shape the future together","recruit.overseasCareers.locations.9.content":"In December 2008, Trip.com's Nantong Customer Support Center was established, making it the company's 12th branch. With over 12,000 agents, it is currently the tourism industry's largest single-unit call center anywhere in the world. Here, a pair of headphones connects us with customers from all around the globe. We provide friendly, simple, proactive, and trustworthy support to each and every customer, and continuously strive to deliver a high-quality service that sets industry standards.","recruit.overseasCareers.locations.10.content":"In the year 2000, we established our South China regional headquarters in Guangzhou. This city holds great historical significance as an important port along the Maritime Silk Road and has been a bustling commercial hub for global trade and services for centuries. Here, the collective strength and wisdom of our business development, operations, services, and technology teams come together. There's nothing our Guangzhou team likes more than to enjoy a cup of tea in their downtime. The cooperation philosophy here is based on openness, inclusiveness, and mutual benefit. Together, we are deeply rooted in the Greater Bay Area, embracing the vibrant spirit of Guangzhou.","recruit.overseasCareers.locations.11.content":"Our Chengdu branch was established in 2001, making it one of our first. Over the past 23 years, this branch has grown into the headquarters of the West China region, with a self-built office space of 50,000 square meters located in Chengdu's High-tech Zone. Its business scope covers provinces and municipalities including Sichuan, Chongqing, Shaanxi, Gansu, Qinghai, Ningxia, Xinjiang, Yunnan, Guizhou, and Tibet. The branch is responsible for implementing Trip.com Group's domestic strategies within mainland China, with domestic teams being based here. At this vibrant location, thousands of enthusiastic team members from West China come together, driven by their passion and unwavering commitment. They remain true to their initial aspirations, strive to make progress, and deliver outstanding achievements.","recruit.overseasCareers.locations.12.content":"In 2001, Trip.com established our office in Qingdao, where a group of young individuals, driven by their passion for travel, set out to explore and showcase the natural landscapes, warm hospitality, and cultural heritage of Shandong Province. In the decades since, our commitment to excellence has not only revitalized the tourism industry in Shandong, but also in Zhejiang, Jiangsu, Fujian, Anhui, and beyond. We look forward to welcoming you to the forefront of China's eastern region, where we can grow and thrive together.","recruit.overseasCareers.locations.1.img":"https://images3.c-ctrip.com/HrCareers/CareersLocation/Shanghai.jpg?__ares_maxage=0","recruit.overseasCareers.locations.2.img":"https://images3.c-ctrip.com/HrCareers/CareersLocation/BeiJing.png?__ares_maxage=0","recruit.overseasCareers.locations.3.img":"https://images3.c-ctrip.com/HrCareers/CareersLocation/UnitedKingdom.png?__ares_maxage=0","recruit.overseasCareers.locations.4.img":"https://images3.c-ctrip.com/HrCareers/CareersLocation/Japan.jpg?__ares_maxage=0","recruit.overseasCareers.locations.5.img":"https://images3.c-ctrip.com/HrCareers/CareersLocation/Philippines.jpg?__ares_maxage=0","recruit.overseasCareers.locations.6.img":"https://images3.c-ctrip.com/HrCareers/CareersLocation/SouthKorea.jpg?__ares_maxage=0","recruit.overseasCareers.locations.7.img":"https://images3.c-ctrip.com/HrCareers/CareersLocation/Malaysia.png?__ares_maxage=0","recruit.overseasCareers.locations.8.img":"https://images3.c-ctrip.com/HrCareers/CareersLocation/Thailand.png?__ares_maxage=0","recruit.overseasCareers.locations.9.img":"https://images3.c-ctrip.com/HrCareers/CareersLocation/Nantong.png?__ares_maxage=0","recruit.overseasCareers.locations.10.img":"https://images3.c-ctrip.com/HrCareers/CareersLocation/Guangzhou.jpg?__ares_maxage=0","recruit.overseasCareers.locations.11.img":"https://images3.c-ctrip.com/HrCareers/CareersLocation/ChengDu.jpg?__ares_maxage=0","recruit.overseasCareers.locations.12.img":"https://images3.c-ctrip.com/HrCareers/CareersLocation/QingDao.png?__ares_maxage=0","recruit.overseasCareers.locations.1.code":"https://careers.ctrip.com/index.html#/joblist?cityCode=CO0009","recruit.overseasCareers.locations.2.code":"https://careers.ctrip.com/index.html#/joblist?cityCode=CO0001","recruit.overseasCareers.locations.3.code":"https://careers.trip.com/index.html#/joblist?cityCode=London_Hier,Edinburgh_Hier","recruit.overseasCareers.locations.4.code":"https://careers.trip.com/index.html#/joblist?cityCode=Tokyo_Hier","recruit.overseasCareers.locations.5.code":"https://careers.trip.com/index.html#/joblist?cityCode=Manila_Hier,Cebu_Hier","recruit.overseasCareers.locations.6.code":"https://careers.trip.com/index.html#/joblist?cityCode=Seoul_Hier","recruit.overseasCareers.locations.7.code":"https://careers.trip.com/index.html#/joblist?cityCode=Kuala_Lumpur_Hier","recruit.overseasCareers.locations.8.code":"https://careers.trip.com/index.html#/joblist?cityCode=Bangkok_Hier","recruit.overseasCareers.locations.9.code":"https://careers.ctrip.com/index.html#/joblist?cityCode=CO0006","recruit.overseasCareers.locations.10.code":"https://careers.ctrip.com/index.html#/joblist?cityCode=CO0003","recruit.overseasCareers.locations.11.code":"https://careers.ctrip.com/index.html#/joblist?cityCode=CO0002","recruit.overseasCareers.locations.12.code":"https://careers.ctrip.com/index.html#/joblist?cityCode=CO0007","recruit.overseasCareers.locations.data.databar":"{positions:positions} in {cities:cities} across {countries:countries/regions}","recruit.overseasCareers.locations.data.databar.positions":"positions","recruit.overseasCareers.locations.data.databar.cities":"cities","recruit.overseasCareers.locations.data.databar.in":"in","recruit.overseasCareers.locationsH5.banner":"https://images3.c-ctrip.com/HrCareers/CareersLocationBanner/locationBanner2xH5EN.jpg?__ares_maxage=0","recruit.overseasCareers.employeeStory.shareTime.4":" ","recruit.overseasCareers.employeeStory.shareTime.5":" ","recruit.overseasCareers.employeeStory.shareTime.6":" ","recruit.overseasCareers.employeeStory.shareTime.7":" ","recruit.overseasCareers.employeeStory.shareTime.8":" ","recruit.overseasCareers.employeeStory.NewTitle.4":"Embracing Challenges Amidst Opportunities - Meet the Japan Hotel Team","recruit.overseasCareers.employeeStory.NewTitle.5":"Unveiling the Secrets of Stellar North Asian Marketing and Operations Team","recruit.overseasCareers.employeeStory.NewTitle.6":"Exploring Global Perspectives with Trip.com Group: Stories from the Amsterdam Team","recruit.overseasCareers.employeeStory.NewTitle.7":"Era's Calling - Embrace the Global Stage with the IBU Marketing Team","recruit.overseasCareers.employeeStory.NewTitle.8":"Unleashing the Power of Customer Support: A Vibrant Encounter with Korea Team","recruit.overseasCareers.employeeStory.homePicture.4":"https://images3.c-ctrip.com/HrCareers/ProEmployeeStory/summaryStory4.JPG?__ares_maxage=0","recruit.overseasCareers.employeeStory.homePicture.5":"https://images3.c-ctrip.com/HrCareers/ProEmployeeStory/summaryStory5.jpg?__ares_maxage=0","recruit.overseasCareers.employeeStory.homePicture.6":"https://images3.c-ctrip.com/HrCareers/ProEmployeeStory/summaryStory6.jpg?__ares_maxage=0","recruit.overseasCareers.employeeStory.homePicture.7":"https://images3.c-ctrip.com/HrCareers/ProEmployeeStory/summaryStory7.jpg?__ares_maxage=0","recruit.overseasCareers.employeeStory.homePicture.8":"https://images3.c-ctrip.com/HrCareers/ProEmployeeStory/summaryStory8.jpg?__ares_maxage=0","recruit.overseasCareers.employeeStory.NewSummary.4":"Exciting opportunities abound for our International Hotel Business Development in Japan, and we are actively seeking talented individuals who are up for unleashing potential in an inspiring and dynamic environment. We spoke to two members of our Japan team, Tomoyuki Takata and Sho Izaki, who shared their experience working in Trip.com Group and what motivates them to strive for the top.","recruit.overseasCareers.employeeStory.NewSummary.5":"Welcome to dive into the world of travel as we chat with Eddy Yip and Yoshitomo Fukasawa, two excellent individuals who play crucial roles in promoting Trip.com in North Asia. From their impressive achievements to the vibrant culture of their team, join us on this fun-filled journey of discovery and inspiration. So, buckle up, and let's get started!","recruit.overseasCareers.employeeStory.NewSummary.6":"Looking for an opportunity to explore the world and work with a global team? Look no further than Trip.com Group! In this blog, we'll get to know the Amsterdam team and learn about their experiences working on a global scale. From Henrique to Joseph, they play an international role, cooperating and communicating with colleagues worldwide. Let's listen to their stories together!","recruit.overseasCareers.employeeStory.NewSummary.7":"In the fast-paced world of global expansion, Trip.com Group stands out as a beacon of opportunity and excitement. We had the pleasure of sitting down with Chengjie Zhang, Head of Commercial Operation, Marketing for International Business Unit, to learn more about his experiences and feelings at Trip.com Group. Join us on an inspiring journey!","recruit.overseasCareers.employeeStory.NewSummary.8":"At Trip.com Group, we believe that customer service is not just a job, it's a journey! Our customer service team is the fearless crew that provides comprehensive assistance and resolves issues for customers. We catch up with Chloe Lim and Cathy Chung, two members of our Korea Team, who share their fun and exciting experiences with us. Get ready to be entertained by their tales of providing top-notch service with a smile and their unwavering commitment to ensuring customer satisfaction!","recruit.overseasCareers.employeeStory.titlePicture.4":"https://images3.c-ctrip.com/HrCareers/ProEmployeeStory/storyBanner4.JPG?__ares_maxage=0","recruit.overseasCareers.employeeStory.titlePicture.5":"https://images3.c-ctrip.com/HrCareers/ProEmployeeStory/storyBanner5.JPG?__ares_maxage=0","recruit.overseasCareers.employeeStory.titlePicture.6":"https://images3.c-ctrip.com/HrCareers/ProEmployeeStory/storyBanner6.JPG?__ares_maxage=0","recruit.overseasCareers.employeeStory.titlePicture.7":"https://images3.c-ctrip.com/HrCareers/ProEmployeeStory/storyBanner7.JPG?__ares_maxage=0","recruit.overseasCareers.employeeStory.titlePicture.8":"https://images3.c-ctrip.com/HrCareers/ProEmployeeStory/storyBanner8.JPG?__ares_maxage=0","recruit.overseasCareers.employeeStory.NewContent.4":"Exciting opportunities abound for our International Hotel Business Development in Japan, and we are actively seeking talented individuals who are up for unleashing potential in an inspiring and dynamic environment. We spoke to two members of our Japan team, Tomoyuki Takata and Sho Izaki, who shared their experience working in Trip.com Group and what motivates them to strive for the top.\r\n\r\n<strong>1.\tPlease describe your role. What does your team do?</strong>\r\n<strong>Tomoyuki Takata: </strong>\r\nI'm Tomoyuki, the Deputy General Manager of Trip.com Japan. My role involves overseeing marketing operations for Trip.com Group in Japan.\r\n<strong>Sho Izaki: </strong>\r\nI'm Sho, and I have recently transferred to the AB Team as the Senior Market Manager for the West Japan Region. Prior to this role, I worked in the ACE team, which is responsible for efficiently managing a larger quantity of smaller-scale guest rooms using internal sales methods, such as phone or email, to uncover more market potential and drive business growth.\r\n\r\n<strong>2.  What are some of your standout moments or accomplishments? </strong>\r\n<strong>Sho Izaki: </strong>\r\nWhen I worked in the ACE Team, we successfully expanded our business in Japan by signing new contracts with several hotels. Leveraging connections with the local government, ","recruit.overseasCareers.employeeStory.NewContent1.4":"we showcased our marketing prowess through a presentation to hotels in the area. The presentation was pivotal for us, as we successfully secured contracts with numerous new hotels and convinced them to join our sales channel. All of our efforts resulted in a remarkable increase in the growth rate compared to last year.\r\n\r\n<strong>3.  What sets Trip.com Group apart from other companies? </strong>\r\n<strong>Tomoyuki Takata: </strong>\r\nUnlike many other online travel agencies, the business scope of our company is diverse, encompassing not only hotels but also tickets, train tickets, flight tickets, and more. This means that I can continuously learn new knowledge and skills, exploring more possibilities. Trip.com Group is a young and fast-growing company that is constantly changing and progressing, which is what I enjoy.\r\n<strong>Sho Izaki:  </strong>\r\nAs Trip.com Group embarks on its journey in the Japanese market, there are boundless opportunities to explore new territories, push limits, and create greater value. This nascent phase presents an exceptional opportunity for me to assume a more pivotal role, leveraging my skills and expertise to drive meaningful impact and establish a strong presence in this new market.\r\n\r\n<strong>4.  How would you describe the culture of Trip.com Group? </strong>\r\n<strong>Tomoyuki Takata: </strong>\r\nOur ongoing pursuit of globalization and innovation fills me with pride. ","recruit.overseasCareers.employeeStory.NewContent2.4":"I can feel a strong signal that our company is committed to pursuing technological advancement, which has positioned us at the forefront of the travel industry. I believe that our constant evolution, particularly in terms of technology, will continue to gain recognition.\r\n<strong>Sho Izaki: </strong>\r\nOur company culture is very open and inclusive, strongly emphasizing diversity. There is no strict hierarchical system, and everyone is encouraged to express their thoughts and ideas, with each person's perspective receiving equal respect.\r\n\r\n<strong>5.  What advice would you give to someone interested in joining your team? </strong>\r\n<strong>Tomoyuki Takata: </strong>\r\nCultural adaptation is crucial. As a NASDAQ and Hong Kong-listed company, we're constantly striving to expand our business and explore new markets. We warmly welcome those who fearlessly tackle challenges and steadfastly face difficulties to join our team, as it aligns seamlessly with our innovative and progressive culture.\r\n<strong>Sho Izaki: </strong>\r\nIf you're interested in joining our team, it's crucial to have a mindset that embraces change. With the immense potential for growth in the global market, we seek individuals who are ambitious, ready to address global challenges and possess the courage to fight for them. Adaptability to constant change is a key attribute highly appreciate.","recruit.overseasCareers.employeeStory.NewContent.5":"Welcome to dive into the world of travel as we chat with Eddy Yip and Yoshitomo Fukasawa, two excellent individuals who play crucial roles in promoting Trip.com in North Asia. From their impressive achievements to the vibrant culture of their team, join us on this fun-filled journey of discovery and inspiration. So, buckle up, and let's get started!\r\n\r\n<strong>1.\tWhat is your role at Trip.com Group and what does your team do? </strong>\r\n<strong>Eddy Yip: </strong>\r\nI am Eddy, from the International Business Unit, serving as the Product & Marketing Director, HK & TW. Our team is responsible for promoting Trip.com in Hong Kong and Taiwan, optimizing and localizing our products, as well as identifying new opportunities in the local market. Additionally, I also hold the position of Territory Manager for Hong Kong, overseeing certain management responsibilities.\r\n<strong>Yoshitomo Fukasawa: </strong>\r\nI'm Yoshitomo, the Senior Marketing Partnership & Affiliate Specialist from the International Business Unit. Our team collaborates with well-known companies to provide benefits to their members and guide them to place orders on Trip.com. Through these collaborations, we establish a mutually beneficial model where their members can enjoy discounted prices and benefits. Additionally, we introduce our services in Japan through website content push. Our ultimate goal is to acquire more orders from external channels.\r\n\r\n<strong>2. What resources have been helpful for your career at Trip.com Group? </strong>\r\n<strong>Eddy Yip: </strong>\r\nAt Trip.com Group, we are encouraged to turn our ideas into reality. ","recruit.overseasCareers.employeeStory.NewContent1.5":"When we have good ideas, the company respects and trusts us. As long as we can provide evidence to demonstrate the value of our ideas, we can get full support in implementing them. We are free to think boldly and come up with new ideas to innovate.\r\n<strong>Yoshitomo Fukasawa: </strong>\r\nTrip.com Group provides opportunities for employees to transition and meet their personal development needs and career planning. I previously served as the Marketing Manager of Tokyo at the Hotel Business Unit, responsible for B2B business. Due to my interest, I transferred to my current position. I think the entire transition process was very smooth, and I received strong support and assistance from the company.\r\n\r\n<strong>3. Can you share any impressive achievements and how you made them happen?\r\n</strong>\r\nEddy Yip: </strong>\r\nLast year, we collaborated with different partners including financial institutes, local hotels, and theme park partners for a major promotion on August 8th. ","recruit.overseasCareers.employeeStory.NewContent2.5":"Through coordinated efforts with other internal business units and successful external resource integration, our campaign achieved excellent results, with the highest number of orders received in a single day throughout the year.\r\nDuring the Ching Ming Festival period, there was a high demand for high-speed rail tickets from Hong Kong to mainland China. We successfully met this challenge by collaborating with the Train Ticket Business Unit, conducting a series of successful marketing campaigns, and making targeted optimizations to our products. These efforts attracted more users to book high-speed rail tickets on our platform. We not only have achieved the highest number of orders received in one day so far this year, but also have helped a lot of users to have an easier journey to get their train tickets.\r\n<strong>Yoshitomo Fukasawa: </strong>\r\nWe previously collaborated with LINE Pay for a promotional campaign in the Japanese market. ","recruit.overseasCareers.employeeStory.NewContent3.5":"Our partners helped promote and raise awareness of the competitive products and excellent service quality provided by Trip.com. This promotional campaign achieved significant results, effectively increasing our transaction volume, and receiving positive feedback on social media sites in Japan.\r\n\r\n<strong>4. How do you feel about working at Trip.com Group? </strong>\r\n<strong>Eddy Yip: </strong>\r\nAgile - We are a highly flexible company that can quickly adapt and capture market changes and swiftly implement ideas.\r\nInnovative - Despite being a large company with numerous products, Trip.com Group is always willing to continuously experiment and innovate to create better products.\r\n<strong>Yoshitomo Fukasawa: </strong>\r\nRapid growth - I believe that the travel industry and our company are in an upward phase, which has provided me with many opportunities for rapid growth. ","recruit.overseasCareers.employeeStory.NewContent4.5":"I have gained tremendous growth and progress from this job.\r\nMeaningful - I am passionate about my work, and I believe that what I do can truly promote meaningful adjustments and upgrades to Japan's travel industry. This makes me feel that what I do has real value.\r\n\r\n<strong>5. How would you describe the culture of your team? </strong>\r\n<strong>Eddy Yip: </strong>\r\nOpen, everyone can freely express their ideas without being cautious when talking to leaders, our team members are encouraged to think independently, not just follow instructions from the boss blindly. We want everyone to think about why we are doing this and if there is room for optimization. Additionally, we don't just work for the sake of work but genuinely derive enjoyment from it.\r\n<strong>Yoshitomo Fukasawa: </strong>\r\nOur team is very diverse, with members from different nationalities and backgrounds. ","recruit.overseasCareers.employeeStory.NewContent5.5":"However, we are very united, and we have established a high level of trust among ourselves.  Led by the Director we share weekly highlights and challenges in our respective markets and also introduce each other to partners to facilitate progress in other markets.\r\n\r\n<strong>6. What attracted you to Trip.com Group? </strong>\r\n<strong>Eddy Yip: </strong>\r\nI highly recognize the brand reputation of Trip.com Group, as it is a well-known company in Hong Kong. Additionally, my previous experience in hotel and airline companies, coupled with my background in the travel industry, makes me a good fit in many aspects with Trip.com Group. Lastly, my previous focus was mainly on B2B, and joining Trip.com Group allows me to transition to B2C, providing me with more learning opportunities and the chance to actively participate and grow fast.\r\n<strong>Yoshitomo Fukasawa: </strong>\r\nI previously worked in the travel industry and loved this field. I believe that Japan's travel industry has enormous potential, with many opportunities worth exploring. Additionally, Trip.com Group has achieved tremendous success in China and has abundant resources and experience to leverage overseas markets, including many untapped blue ocean markets. I have many opportunities to try and challenge myself and do meaningful things.\r\n\r\n7. What advice would you give to someone interested in joining your team? </strong>\r\n<strong>Eddy Yip: </strong>\r\nWe hope you bring innovative ideas and are not afraid to express yourself.","recruit.overseasCareers.employeeStory.NewContent6.5":"When formulating big plans, pay attention to the details and be able to identify areas for optimization even in the smallest aspects. A small idea can evolve a big change!\r\n<strong>Yoshitomo Fukasawa: </strong>\r\nHigh coordination and adaptability - Our team is very diverse, and we have the opportunity to come into contact with different cultures. When dealing with colleagues from different cultures and backgrounds, we need to learn to embrace these differences and coordinate effectively.\r\nHigh proactivity - We encourage curiosity about new things and the ability to proactively learn about the company's culture and professional knowledge. Having good self-drive is also a trait that we highly value.","recruit.overseasCareers.employeeStory.NewContent.6":"Looking for an opportunity to explore the world and work with a global team? Look no further than Trip.com Group! In this blog, we'll get to know the Amsterdam team and learn about their experiences working on a global scale. From Henrique to Joseph, they play an international role, cooperating and communicating with colleagues worldwide. Let's listen to their stories together!\r\n\r\n<strong>1.\tTell us about your role. What do you do at Trip.com Group? </strong>\r\n<strong>Henrique de Castro Almeida: </strong>\r\nI am heading the Affiliate Marketing team, which is part of the Partnerships & Affiliates channel. My role involves overseeing the global operations of our Affiliate Network partnerships, driving strategies to increase our brand awareness, competitiveness, and market share worldwide.\r\n<strong>Joseph Payne:</strong>\r\nAs a Senior Content Copywriter, my main focus is collaborating with the UX Copywriter team to enhance the English source text for hotel and flight products. This includes improving the product's English source text and translating it into other languages. Additionally, I create copy for various campaigns, such as discounts and paid promotions. I also collaborate with the EU product team to develop content for UK social media platforms, with plans to expand to other European languages. Ensuring brand unity and consistency is a crucial aspect of my role.\r\n\r\n<strong>2. Describe your team and your work scope. </strong>\r\n<strong>Henrique de Castro Almeida: </strong>\r\nThe Affiliates team operates in three countries, with an area manager for APAC in Singapore, one for EMEA/Americas in Amsterdam, and one responsible for internal projects, tech developments, and monitoring and operations in the UK. ","recruit.overseasCareers.employeeStory.NewContent1.6":"Our main focus is constant data analysis, identifying growth opportunities, and delivering a top-notch affiliate program. We leverage successful cases to replicate them in other markets and collaborate with local teams to activate campaigns strategically in the affiliate channel. Despite being in different countries and time zones, our team is highly effective and collaborative, which is a true highlight of our work.\r\n<strong>Joseph Payne: </strong>\r\nMy team is the content department based primarily in Shanghai, we work closely on translating my written work. Our successful launch of social media platforms in the UK has been a notable achievement, greatly improving our APP downloads. Furthermore, our various campaigns across Europe have been successful in enhancing our presence in the European market, with copywriting playing a significant role in these accomplishments. As someone involved in both content creation and marketing, I consider both teams to be my own.\r\n\r\n<strong>3. Can you share one of your impactful projects while working at Trip.com Group?</strong>\r\n<strong>Henrique de Castro Almeida: </strong>\r\nThe highlight of my career was leading a global team and merging all affiliate operations. ","recruit.overseasCareers.employeeStory.NewContent2.6":"This experience required me to navigate between details and strategies and to understand the unique aspects of each region and partner. Clear communication, attention to detail, and the ability to see the big picture were crucial in optimizing our operations and taking timely actions.\r\n<strong>Joseph Payne: </strong>\r\nThe achievement that fills me with the greatest pride is my collaboration with the UED team to develop a comprehensive document outlining our company's desired tone and voice in customer communication. This document guides our copywriters, brand, and marketing teams, enabling effective engagement with our customers. ","recruit.overseasCareers.employeeStory.NewContent3.6":"This accomplishment, early in my career at Trip.com Group, is a significant milestone. Establishing a cohesive brand voice and vision has allowed us to cultivate a strong and consistent communication strategy that resonates with our target audience.\r\n\r\n<strong>4.\tUse three adjectives to accurately convey your feelings about working at Trip.com Group. </strong>\r\n<strong>Henrique de Castro Almeida: </strong>\r\nExciting, dynamic, and adventurous.\r\n<strong>Joseph Payne: </strong>\r\nExcited, inspired, motivated.\r\n\r\n<strong>5.\tHow would you describe the culture of your team? </strong>\r\n<strong>Henrique de Castro Almeida: </strong>\r\nCollaboration is central to our team's success. We value the collective input and observations of each team member, working together to define goals and projects. By leveraging our diverse perspectives and expertise, we make more informed decisions and achieve more effective outcomes.\r\n<strong>Joseph Payne: </strong>\r\nThe open culture at Trip.com Group, with frequent communication from directors and high-level bosses, is something I appreciate. It's wonderful to not only hear from them but also have the chance to see them during their regular visits. Working in the Amsterdam office is particularly exciting due to the diverse nationalities represented among employees. ","recruit.overseasCareers.employeeStory.NewContent4.6":"This diversity fosters a positive company culture and emphasizes the importance of inclusivity, which is a valuable asset to our organization. \r\n\r\n<strong>6.\tWhat was it about Trip.com Group that attracted you here? </strong>\r\n<strong>Henrique de Castro Almeida: </strong>\r\nHaving previous experience in the travel industry, I have always felt a strong connection to this sector. Joining the Trip.com Group was an exciting opportunity for me to be a part of people's journeys. Being part of our customers planning holidays, exploring different destinations, or simply visiting friends and family, that gives me purpose.\r\n<strong>Joseph Payne: </strong>\r\nTrip.com Group has tremendous growth potential and provides limitless opportunities for personal and professional development, allowing me to make a significant impact.","recruit.overseasCareers.employeeStory.NewContent5.6":" I am thrilled to grow alongside the company, while Trip.com Group was initially unknown to many in Europe, I take pride in the role I played in raising our profile, and we are now well-known among many people.\r\n\r\n<strong>7.\tWhat advice would you give to someone interested in joining your team? </strong>\r\n<strong>Henrique de Castro Almeida: </strong>\r\nIf you’re looking for a dynamic and fast-growing company, Trip.com Group is the right place. You’ll find all the opportunities to learn, grow and work with great individuals here.\r\n<strong>Joseph Payne: </strong>\r\nTo collaborate effectively with individuals across different countries and time zones, one must be adaptable and able to transition between projects quickly. For instance, I work closely with colleagues in Shanghai to achieve specific objectives and then switch to collaborate with colleagues in Europe on different tasks, all within the same day. Flexibility is a crucial skill in navigating diverse and dynamic work scenarios. Moreover, having a passion for travel is essential.","recruit.overseasCareers.employeeStory.NewContent.7":"In the fast-paced world of global expansion, Trip.com Group stands out as a beacon of opportunity and excitement. We had the pleasure of sitting down with Chengjie Zhang, Head of Commercial Operation, Marketing for International Business Unit, to learn more about his experiences and feelings at Trip.com Group. Join us on an inspiring journey!\r\n\r\n<strong>1.\tTell us about your role. What does your team do at Trip.com Group? </strong>\r\n<strong>Chengjie Zhang: </strong>\r\nIn a nutshell, my team connects the dots in people and business, acts like the bridge and information hub between headquarter and our regional offices across the globe. We are responsible for initiating, developing strategic project, exploring opportunities of business enhancement via collaboration. ","recruit.overseasCareers.employeeStory.NewContent1.7":"Given the global nature of our work, we deal with a significant amount of information/communication and overseas channels, requiring us to focus on stakeholder management, standardizing workflows, and establishing frameworks to continuously drive our operation efficiency and commercial excellence, in a sustainable and scalable way. \r\n\r\n<strong>2.\tWhat was it about Trip.com Group that attracted you here? </strong>\r\n<strong>Chengjie Zhang: </strong>\r\nTrip.com Group is strategically expanding its global market, and I am genuinely thrilled to be actively involved in supporting this exceptional company's global development. While I understand this will undoubtedly present various challenges, I view them as valuable opportunities for growth. ","recruit.overseasCareers.employeeStory.NewContent2.7":"Meanwhile I am greatly thankful for the openness and transparency that the company provides every since I joined, allowing me to contribute to the globalization journey with the insights and experiences from my career experiences. \r\n\r\n<strong>3.\tUse three words to convey your feelings about working at Trip.com Group. </strong>\r\n<strong>Chengjie Zhang: </strong>\r\nAmbition- When the company is determined to accomplish something, I can feel the generous investment of resources and everyone's down-to-earth attitude. This unwavering commitment helps us achieve great results.\r\nEmpowerment - Trip.com Group trusts us and provides ample freedom and resources to pursue our goals. Our ideas and judgments are recognized and valued, as long as we can provide compelling evidence to support them.\r\nFast-changing - Our company is rapidly growing and constantly evolving. ","recruit.overseasCareers.employeeStory.NewContent3.7":"Employees have the opportunity to explore new business areas and collaborate with exceptional colleagues, which creates valuable learning experiences for all of us. \r\n\r\n<strong>4.\tHow would you describe your team culture？</strong>\r\n<strong>Chengjie Zhang: </strong>\r\nI believe a High Performing Team comes with high level of transparency and ownership. Each member actively contributes and receives ample respect. I often glean novel and valuable insights from these positive contributions. Additionally, I place great value on trust in managing the team, seeing myself being a supporter on the team’s development, balancing the interest between the people and business when needed.\r\n<strong>5.\tWhat advice would you give to someone interested in joining your team? </strong>\r\n<strong>Chengjie Zhang: </strong>\r\nKnow what you want and be open to what comes along – Trip.com Group is a significant company with the capability to provide numerous opportunities. Meanwhile, be hungry, curious and open to what comes along – things don’t happen as planned, but there is always something interesting and valuable in the journey. ","recruit.overseasCareers.employeeStory.NewContent.8":"At Trip.com Group, we believe that customer service is not just a job, it's a journey! Our customer service team is the fearless crew that provides comprehensive assistance and resolves issues for customers. We catch up with Chloe Lim and Cathy Chung, two members of our Korea Team, who share their fun and exciting experiences with us. Get ready to be entertained by their tales of providing top-notch service with a smile and their unwavering commitment to ensuring customer satisfaction!\r\n\r\n<strong>1.\tTell us about your role. What do you do at Trip.com Group? </strong>\r\n<strong>Chloe Lim: </strong>\r\nMy role as the Inbound Group Leader of Flight CSC (Customer Support Center) in Korea involves maintaining the team's performance and managing the team members. To achieve this, I set clear and achievable goals for the team, establish KPI metrics and attainable targets, track monthly results, and discuss any necessary adjustments with Team Leaders. \r\n<strong>Cathy Chung: </strong>\r\nMy role as the Group Leader involves facilitating effective collaboration and communication and fostering personal growth and satisfaction among team members to contribute to the team's performance. I establish goals and strategies to achieve success, develop team members, promote communication and collaboration, and resolve issues.","recruit.overseasCareers.employeeStory.NewContent1.8":" I’m also responsible for evaluating team members' performance and providing feedback for improvement. \r\n\r\n<strong>2.\tDescribe your team and your work scope. </strong>\r\n<strong>Chloe Lim: </strong>\r\nOur Flight CSC (Customer Support Center) team assists customers with flight-related inquiries and issues, striving to provide exceptional service. We track and analyze customer feedback to identify areas for improvement and focus on metrics such as response time and FCR (first-call resolution) rate. Our efforts have led to significant accomplishments, including resolving complex issues, improving satisfaction ratings, streamlining operations, and receiving positive feedback.\r\n<strong>Cathy Chung: </strong>\r\nOur Hotel CSC (Customer Support Center) team's main focus is on improving customer satisfaction through data analysis and feedback, as well as providing input for technical research and development.","recruit.overseasCareers.employeeStory.NewContent2.8":" We achieve this by analyzing customer feedback to enhance quality and providing accurate, friendly, and timely responses to inquiries and requests. Additionally, we collaborate with relevant teams to enhance the functionality and performance of procedures and modules.\r\n\r\n<strong>3.\tCan you describe what career growth can look like at Trip.com Group and what resources are useful to help with that? </strong>\r\n<strong>Chloe Lim: </strong>\r\nTrip.com Group offers employees various career development and promotion opportunities. Starting as Customer Advisors, employees can progress to Assistant Team Leader, Team Leader, and Group Leader. Other positions like QC and KA are also available for employees to explore different business fields. Throughout my career development, the guidance and support from previous team leaders and colleagues have been crucial to my growth. Our company culture encourages employees to take on new challenges and offers cross-departmental work opportunities, allowing us to gain experience and skills in various areas. \r\n<strong>Cathy Chung: </strong>\r\nTrip.com Group offers diverse career growth opportunities, enabling employees to assume various roles like team leader or quality practitioner. By showcasing our abilities and achieving outstanding results, we can unlock new career development prospects and more demanding positions. As a global enterprise, our company provides us with the opportunity to gain international exposure and expand our professional networks by engaging with overseas branches.","recruit.overseasCareers.employeeStory.NewContent3.8":" Through this, I explore different experiences and domains, further honing my capabilities.\r\n\r\n<strong>4.\tCan you share one of your impactful projects while working at Trip.com Group and how you made it happen? </strong>\r\n<strong>Chloe Lim: </strong>\r\nWhile working at Trip.com Group, my most impactful project was gathering and disseminating information about the rapidly evolving flight industry during the COVID-19 pandemic. My primary objective was to keep my team members and customers informed about the latest developments. To achieve this, I conducted extensive research and stayed up-to-date with the latest news and trends in the industry. I collaborated closely with other departments to ensure that the information I provided was accurate and relevant, building trust and loyalty among our customers and team members.\r\n<strong>Cathy Chung: </strong>\r\nI believed that fostering loyal customers within the customer support center necessitated friendly employees, accurate explanations, and prompt responses. To enhance this aspect, I conducted a 'self-call monitoring project' and calibration exercises with the team.","recruit.overseasCareers.employeeStory.NewContent4.8":" By enabling advisors to assess and compare their call quality, we identified areas for improvement and achieved higher customer satisfaction.\r\n\r\n<strong>5.\tUse three adjectives to accurately convey your feelings about working at Trip.com Group. </strong>\r\n<strong>Chloe Lim: </strong>\r\nChallenging, dynamic, and amazing.\r\n<strong>Cathy Chung: </strong>\r\nPassionate, challenging, and collaborative. \r\n\r\n<strong>6.\tHow would you describe the culture of your team? </strong>\r\n<strong>Chloe Lim:  </strong>\r\nFriendly and collaborative. The close relationships among team members go beyond just working together, indicating that open communication, mutual respect, and a supportive work environment are highly valued. We have become more than just colleagues - we are friends. This sense of camaraderie is a driving force behind our shared commitment to achieving common goals and serves as a cornerstone of our collective success.\r\n<strong>Cathy Chung: </strong>\r\nOur team strongly emphasizes collaboration and openness. We believe in working together and supporting each other, valuing the sharing of ideas and opinions. In addition to our weekly meetings, we have an open communication and feedback culture, where team members are encouraged to freely express their thoughts and ideas, which are respected and actively worked upon for improvement.","recruit.overseasCareers.employeeStory.NewContent5.8":" Furthermore, our team fosters a culture based on respect and diversity, and we embrace the unique experiences and backgrounds that each team member brings.\r\n\r\n<strong>7.\tWhat was it about Trip.com Group that attracted you here? </strong>\r\n<strong>Chloe Lim:  </strong>\r\nI chose to work at Trip.com Group because I believed it was an adaptable workplace that could meet the challenges of COVID-19. I was seeking a job that would allow me to utilize my experience in the travel industry and language skills while also connecting with people. When I saw the opportunity to become a CS Advisor, I knew it was the perfect fit for me. Additionally, Trip.com Group's reputation as the leading online travel company and its growth potential attracted me. Working with talented and experienced professionals is a great opportunity for me.\r\n<strong>Cathy Chung: </strong>\r\nI was attracted to Trip.com Group due to its global impact and horizontal culture and I respectfully applied to this company, firmly believing that my service experience would allow me to make a substantial contribution. The culture values collaboration, open communication, and teamwork, which resonated with me. I appreciate that our company encourages us to contribute our ideas and skills, promoting innovation and diversity. \r\n\r\n<strong>8.\tWhat advice would you give to someone interested in joining your team? </strong>\r\n<strong>Chloe Lim:  </strong>\r\nIf you have a passion for travel and enjoy helping others and finding solutions to challenges, I think this is the place for you. Working at Trip.com is a fulfilling experience that brings a sense of satisfaction to every day.\r\n<strong>Cathy Chung: </strong>\r\nIf you are interested in joining our team, it is important to demonstrate your passion and interest by showcasing your desire and motivation for the specific field. In addition, we value individuals who are motivated and show a desire to learn and grow. Collaboration and teamwork are also crucial to achieving success as a member of our CS team. ","recruit.overseasCareers.employeeStory.NewTitle.3":"Grow in a world-class platform","recruit.overseasCareers.employeeStory.NewTitle.2":"Take off in an inclusive organization","recruit.overseasCareers.employeeStory.NewTitle.1":" ","recruit.overseasCareers.employeeStory.NewSummary.3":"Trip.com Group is an amazing school! Working in a global business like this, allows one to get familiar with\r\r\ndifferent kinds of operations, methods of work, various cultures and a large level of support and opportunities.","recruit.overseasCareers.employeeStory.NewSummary.2":"Trip is a dynamic world-class OTA platform and equal opportunity employer for your career to take off","recruit.overseasCareers.employeeStory.NewSummary.1":" ","recruit.overseasCareers.employeeStory.NewContent.3":"Ori Richter joined Trip.com Group in August 2018 as he wanted to get familiar with the customer service world. Starting as a customer service agent in the European hub of Trip.com Group provided Ori the basis for learning and developing within the business while providing first class support to Trip’s customers.\r\r\nWithin 4.5 years Ori progressed within Trip.com Group, he has become the European Operations manager for the flight department in charge of our European customer service providing support in 12 languages covered by our 18 teams across 3 continents.\r\r\nOri says: “Trip.com Group is an amazing school! Working in a global business like this, allows one to get familiar with different kinds of operations, methods of work, various cultures and a large level of support and opportunities. With every day that passes, my skillset broadens and allows me to grow professionally and personally. Since day one at Trip I really enjoyed my job, which for me is the key to succeed in whatever you do.”","recruit.overseasCareers.employeeStory.NewContent.2":"Meet Edmund Weng, our Regional Director for Singapore and Malaysia market, who joined Trip.com Group in 2014.\r\nAs he said, “Joining Trip was one of the best career decisions I made in my life. Over here in Trip, the culture is very inclusive which means the ideas are always discussed and tested out regardless of your position.\r\nIn Singapore and Malaysia, we came a long way since about 6 years ago and I am personally proud as to how Trip have grown in serving the travel needs of customers in both countries. Trip is a dynamic world-class OTA platform and equal opportunity employer for your career to take off!\"\r\nAt Trip.com Group, we like things simple and straight forward. We nurture a safe space and encourage all employees to express their thoughts. We embrace diversity and inclusion to ensure every individual here is respected, valued and supported.","recruit.overseasCareers.employeeStory.NewContent.1":" ","recruit.overseasCareers.employeeStory.homePicture.3":"https://images3.c-ctrip.com/HrCareers/ProEmployeeStory/summaryStory3.jpg?__ares_maxage=0" 在开源社区有自己做得比较出色的地方，各方面的资源和发展都是紧跟互联网脚步的。在这里，没有阶级感，团队中的每一个人都能平等地交流，像朋友一样相处。","recruit.campusCareers.jobType.employeeStories.picture.1":"https://images3.c-ctrip.com/HrCareers/CampusCareers/employeeStory/1.jpg?__ares_maxage=0","recruit.campusCareers.jobType.employeeStories.title.2":"Steve 华中科技大学 2019届 旅游事业群 高级后端开发工程师","recruit.campusCareers.jobType.employeeStories.desc.2":"来到携程三年，我已经从一个协助开发者变成了主要负责人。这里对我来说，是一个能实现自我价值的舞台。在携程，大声说出自己的想法很简单，个人成长的机会从不缺乏。","recruit.campusCareers.jobType.employeeStories.picture.2":"https://images3.c-ctrip.com/HrCareers/CampusCareers/employeeStory/2.jpg?__ares_maxage=0","recruit.campusCareers.jobType.employeeStories.title.3":"Sisi 伦敦艺术大学 2022届 国际事业部 创意设计师","recruit.campusCareers.jobType.employeeStories.desc.3":"我能在为公司创造价值的同时，充分发挥自己的特长。一个人的工作可以从中沉淀经验和结论，从而赋能整个团队，我觉得是非常有成就感的事情。携程是我的初心，氛围非常love & peace，在这里我能感受到归属感。","recruit.campusCareers.jobType.employeeStories.picture.3":"https://images3.c-ctrip.com/HrCareers/CampusCareers/employeeStory/3.jpg?__ares_maxage=0","recruit.campusCareers.followUs.title":"Scan to follow us","recruit.campusCareers.followUs.wechat":"https://images3.c-ctrip.com/HrCareers/CampusCareers/followUs/wechat.png?__ares_maxage=0","recruit.campusCareers.followUs.bilibili":"https://images3.c-ctrip.com/HrCareers/CampusCareers/followUs/bilibili.png?__ares_maxage=0","recruit.campusCareers.followUs.xiaohongshu":"https://images3.c-ctrip.com/HrCareers/CampusCareers/followUs/img_v3_02pg_c67e6e1f-0d83-4857-bad7-5950ade6c41g.png","recruit.campusCareers.QA.title.1":"1.\tWho is the target of the 2026 Autumn Campus Recruitment?","recruit.campusCareers.QA.desc.1":"This 2026 Autumn Campus Recruitment is open to candidates from the Class of 2026 (who graduates between September 1, 2025 and August 31, 2026).</br>\r\n* Mainland China is based on the graduation certificate; non-mainland China is based on the degree certification by the Ministry of Education.</br>","recruit.campusCareers.QA.title.2":"2.\tWhere can I submit my application?","recruit.campusCareers.QA.desc.2":"Channel 1: Official website (campus.ctrip.com).</br>\r\nChannel 2: “携程招聘” WeChat official account.</br>\r\nChannel 3: Employee Referral.</br>","recruit.campusCareers.QA.title.3":"3.\tHow many positions can each person apply for?","recruit.campusCareers.QA.desc.3":"Each student can only apply for one position (including talent programs), so make sure to think carefully before submitting your application.","recruit.campusCareers.QA.title.4":"4.\tWhere is the workplace for the job of campus recruitment?","recruit.campusCareers.QA.desc.4":"The primary location for most positions is Shanghai, China, with a few positions available in other cities. For details, please refer to the job description.","recruit.campusCareers.QA.title.5":"5.\tHow is the schedule arranged for the written tests of 2026 Autumn Campus Recruitment?","recruit.campusCareers.QA.desc.5":"Written Test Sessions for Research&Development Positions:</br>\nSeptember 4 | September 6 | September 18 | October 11 | October 23 | November 6</br>\nWritten Test Sessions for Design Positions:</br>\nSeptember 4 | September 18 | October 11 | October 23 | November 6</br>\nThe written test schedules for other positions may vary. Please pay attention to your application email and SMS notifications for updates.</br>","recruit.campusCareers.QA.title.6":"6.\tHow will I conduct the interview?","recruit.campusCareers.QA.desc.6":"We conduct interviews both online and offline; please refer to the email you receive for details.","recruit.campusCareers.QA.title.7":"7.\tAre there any restrictions on academic qualifications and majors for recruitment?","recruit.campusCareers.QA.desc.7":"The eligibility criteria for positions may differ, with the pertinent academic and vocational prerequisites delineated within the respective job descriptions.","recruit.campusCareers.QA.title.8":"8.\tHow to check my recruitment progress?","recruit.campusCareers.QA.desc.8":"Method 1: Self-check through the \"携程招聘\" WeChat official account.</br>\r\nMethod 2: Contact the internal referrer for inquiries.</br>","recruit.campusCareers.QA.title.9":"9.\tWhat should I do if I receive an ability assessment invitation SMS but no email notification?","recruit.campusCareers.QA.desc.9":"Please check your subscription mailbox, spam, or archived mailbox first. If you still have not received the email, you can <a href=\"https://mokahr.udesk.cn/im_client/?web_plugin_id=177101\" target=\"_blank\"><strong>click here</strong></a> to contact customer service for a resolution.","recruit.campusCareers.QA.title.10":"10.\tIf my resume status has been stuck at a certain stage for a long time (more than 10 working days), does it mean the process is over?","recruit.campusCareers.QA.desc.10":"If the resume status shows [Entered Talent Pool], it means the recruitment process for this position has ended. For other statuses, please wait patiently for further notifications.","recruit.campusCareers.QA.title.11":"11.\tIf my resume status shows [Entered Talent Pool], does it mean the process is over?","recruit.campusCareers.QA.desc.11":"Yes, it means that there is no further progress for the student under the current applied position.","recruit.campusCareers.QA.title.12":" ","recruit.campusCareers.QA.desc.12":" ","recruit.campusCareers.QA.title.13":" ","recruit.campusCareers.QA.desc.13":" ","recruit.campusCareers.QA.title.14":" ","recruit.campusCareers.QA.desc.14":" ","recruit.campusCareers.QA.title.15":" ","recruit.campusCareers.QA.desc.15":" ","recruit.campusCareers.project.title":"招聘项目","recruit.campusCareers.project.description":"注意：每位同学每个项目仅可投递一个职位（集团培训生项目、AGT、旅行官星辰计划、商旅程英会共享一个网申投递名额）","recruit.campusCareers.project.title.1":" ","recruit.campusCareers.project.summary.1":" ","recruit.campusCareers.project.banner.1":" ","recruit.campusCareers.project.text1.1":" ","recruit.campusCareers.project.text1.2":" ","recruit.campusCareers.project.text1.3":" ","recruit.campusCareers.project.title.2":" ","recruit.campusCareers.project value","recruit.campus.homepage.SeniorStudentsTitle3":"Technical depth, profound growth","recruit.campus.homepage.SeniorStudentsTitle4":"Unleash your power, chase what you love","recruit.campus.homepage.SeniorStudentsContent1":"After joining the team, I took ownership of a module. In a culture of trust, I moved from solving specific issues to leading broader refactoring, which expanded my perspective. I learned that code isn’t just academic—it creates real impact. Now, with a stronger product mindset, I believe true success stems from close teamwork.","recruit.campus.homepage.SeniorStudentsContent2":"I officially joined Trip.com Group after my summer internship, which helped me build concrete and strong connections with my team and the company. Here, I evolved from a \"value absorber\" to a \"value creator\" with a sense of ownership——focusing on doing things well, not just finishing them, for long-term value.","recruit.campus.homepage.SeniorStudentsContent3":"The team's healthy culture drew me in and made me stay. With my supervisor's mentorship, I transitioned from student to professional. Working on the listing page project, I solved real business challenges and felt the thrill of driving impact. The team's supportive culture allowed me to focus on technical depth, enriching my growth.","recruit.campus.homepage.SeniorStudentsContent4":"After graduated from Stanford, I joined train ticketing unit, blending my passion for travel with expertise to build Italy's business from scratch. This hands-on experience sharpened my holistic view and coordination skills. With a supportive team and broad platform, I aim to craft seamless journeys for travelers alongside talented peers.","recruit.campus.homepage.SeniorStudentsImage1":"https://images3.c-ctrip.com/HrCareers/CampusCareersNew/SeniorStudents/MaXun.png?__ares_maxage=3","recruit.campus.homepage.SeniorStudentsImage2":"https://images3.c-ctrip.com/HrCareers/CampusCareersNew/SeniorStudents/XiaoYiXu.png?__ares_maxage=3","rec 11":"Class of 2023｜Campus Recruitment HR","recruit.campus.homepage.SeniorStudentsTitle5":"Break boundaries and become that \"creator\"","recruit.campus.homepage.SeniorStudentsTitle6":"Deep within the scene, let technology take root","recruit.campus.homepage.SeniorStudentsTitle7":"Growth begins with permission","recruit.campus.homepage.SeniorStudentsTitle8":"Like the osmanthus tree, take root steadily and blossom","recruit.campus.homepage.SeniorStudentsTitle9":"Every step of growth is firm and powerful","recruit.campus.homepage.SeniorStudentsTitle10":"Permitted growth, recognized value","recruit.campus.homepage.SeniorStudentsTitle11":"Bridge the gap for kindred spirits","recruit.campus.homepage.SeniorStudentsContent5":"Since joining, I've pushed boundaries in an inclusive team that encourages bold tech exploration. This transformed me from a passive executor to an independent problem-solver. Focused on pragmatism and innovation, I address business pain points to create real value—evolving from a tool user to a solution creator.","recruit.campus.homepage.SeniorStudentsContent6":"Transitioning from traditional algorithms to intelligent agents, I now see how tech drives business. With a focused team and rich AI resources, I explore integrating large models with real scenarios. I believe true solutions stem from deep business pain points. I aim to solve real problems and drive service innovation with my team.","recruit.campus.homepage.SeniorStudentsContent7":"From optimizing projects to leading complex designs, I've grown in a supportive team culture. Bold experimentation enhanced my technical skills and expanded my thinking, while strengthening system design and communication abilities. Here, reviews focus on improvement, not blame, and innovation is always encouraged.","recruit.campus.homepage.SeniorStudentsContent8":"With mentorship and hands-on practice, I grew from a newcomer to an independent developer—sharpening skills, communication, and problem-solving under pressure. I found my rhythm and learned that true growth comes from collective effort. I aspire to be like the osmanthus tree—rooted deep, blooming quietly.","recruit.campus.homepage.SeniorStudentsContent9":"The Tiger Program drew me to Trip.com Group. Through hands-on rotations, I grew from a doer to a thinker. Resolving global emergencies honed my systematic thinking via cross-functional teamwork. The open, encouraging culture empowered me to tackle challenges and build confidence.","recruit.campus.homepage.SeniorStudentsContent10":"Through the Eagle program, I quickly progressed from student to analyst at Trip.com Group. The open culture and supportive team empowered me to express ideas confidently and pursue excellence. Tackling real business scenarios, I've sharpened my analytical skills and learned to translate data insights into strategic value.","recruit.campus.homepage.SeniorStudentsContent11":"After rotations, I joined campus recruitment at Trip.com Group as an HR Management Trainee. Supported by my team, I confidently led an international pop-up project—a major leap in my growth. Now, I aim to recruit with genuine care and connect like-minded talent with Trip.com Group.","recruit.campus.homepage.SeniorStudentsImage5":"https://images3.c-ctrip.com/HrCareers/CampusCareersNew/SeniorStudents/YiZhang.png?__ares_maxage=3","recruit.campus.homepage.SeniorStudentsImage6":"https://images3.c-ctrip.com/HrCareers/CampusCareersNew/SeniorStudents/XianZhang.png?__ares_maxage=3","recruit.campus.homepage.SeniorStudentsImage7":"https://images3.c-ctrip.com/HrCareers/CampusCareersNew/SeniorStudents/DuZihao.png?__ares_maxage=3","recruit.campus.homepage.SeniorStudentsImage8":"https://images3.c-ctrip.com/HrCareers/CampusCareersNew/SeniorStudents/JinFuqi.png?__ares_maxage=3","recruit.campus.homepage.SeniorStudentsImage9":"https://images3.c-ctrip.com/HrCareers/CampusCareersNew/SeniorStudents/HuangJianan.png?__ares_maxage=3","recruit.campus.homepage.SeniorStudentsImage10":"https://imag
