ge=0","recruit.campus.homepage.banner4":"https://images3.c-ctrip.com/HrCareers/CampusCareersNew/CampusHomePage/2026New/HomeVFSTCH.png?__ares_maxage=0","recruit.campus.homepage.bannerLink1":"https://careers.ctrip.com/#/campus/jobList","recruit.campus.homepage.bannerLink2":"https://careers.ctrip.com/#/campus/jobList?jobCategoryType=108769","recruit.campus.homepage.bannerLink3":"https://careers.ctrip.com/#/campus/jobList?jobCategoryType=198408","recruit.campus.homepage.bannerLink4":"https://careers.ctrip.com/#/campus/jobList?jobCategoryType=75020","recruit.campus.joblistH5.banner3":"https://images3.c-ctrip.com/HrCareers/CampusCareersNew/CampusHomePage/New1/Tiger.jpg?__ares_maxage=0","recruit.campus.joblistH5.banner4":"https://images3.c-ctrip.com/HrCareers/CampusCareersNew/CampusHomePage/2026New/H5VFSTCH.png?__ares_maxage=0","recruit.campus.homepageH5.bannerLink1":"https://careers.ctrip.com/m/#/campus/joblist","recruit.campus.homepageH5.bannerLink2":"https://careers.ctrip.com/m/#/campus/jobList?jobCategoryType=108769","recruit.campus.homepageH5.bannerLink3":"https://careers.ctrip.com/m/#/campus/joblist?jobCategoryType=198408","recruit.campus.homepageH5.bannerLink4":"https://careers.ctrip.com/m/#/campus/joblist?jobCategoryType=75020","recruit.campus.homepage.SeniorStudentsName5":"Eva","recruit.campus.homepage.SeniorStudentsName6":"吉米尼","recruit.campus.homepage.SeniorStudentsName7":"大水怪","recruit.campus.homepage.SeniorStudentsName8":"更更","recruit.campus.homepage.SeniorStudentsName9":"Charlie","recruit.campus.homepage.SeniorStudentsName10":"Mia","recruit.campus.homepage.SeniorStudentsName11":"小航","recruit.campus.homepage.SeniorStudentsIntroduction5":"2021届｜技术中心｜数据仓库工程师","recruit.campus.homepage.SeniorStudentsIntroduction6":"2021届｜金融事业部｜算法工程师","recruit.campus.homepage.SeniorStudentsIntroduction7":"2023届｜商旅事业部｜后端开发工程师","recruit.campus.homepage.SeniorStudentsIntroduction8":"2022届｜市场营销部｜后端开发工程师","recruit.campus.homepage.SeniorStudentsIntroduction9":"2023届｜IBU｜Senior E&E Lead","recruit.campus.homepage.SeniorStudentsIntroduction10":"2023届｜IBU｜Marketing Analysis","recruit.campus.homepage.SeniorStudentsIntroduction11":"2023届｜人力资源部｜校园招聘HR","recruit.campus.homepage.SeniorStudentsTitle5":"突破边界，成为那个“创造者”","recruit.campus.homepage.SeniorStudentsTitle6":"在场景深处，让技术生根","recruit.campus.homepage.SeniorStudentsTitle7":"成长，从被允许开始","recruit.campus.homepage.SeniorStudentsTitle8":"像桂花树一样，扎根绽放","recruit.campus.homepage.SeniorStudentsTitle9":"每一步成长，都坚定有力","recruit.campus.homepage.SeniorStudentsTitle10":"被允许的成长，被看见的价值","recruit.campus.homepage.SeniorStudentsTitle11":"做同频者的摆渡人","recruit.campus.homepage.SeniorStudentsContent5":"加入携程后，我在岗位上不断突破。包容的团队氛围鼓励我大胆尝试新技术，培养主动思考与结构化表达能力，让我从被动执行者转变为能独立解决问题的人。崇尚务实创新的理念，引导我聚焦业务痛点，用技术创造真实价值。在这里，我不断突破技能边界，实现了从工具使用者到解决方案创造者的蜕变。","recruit.campus.homepage.SeniorStudentsContent6":"作为算法工程师，我在传统算法转向智能Agent研发的过程中，通过实践重新理解了技术如何驱动业务。团队年轻而专注，公司丰富的AI资源与培训让我能持续探索大模型与场景的结合。我坚信最好的应用源于对业务痛点的深刻洞察，也期待继续深耕，成为用技术解决真问题的算法专家，与团队一起以创新提升服务体验。","recruit.campus.homepage.SeniorStudentsContent7":"从独立进行项目性能优化，到主导设计复杂系统架构，我在团队包容、认同、鼓励的文化下一步步成长。在大胆尝试的过程中，我不仅精进了技术、拓宽了思考维度，还长足提升了系统设计能力与沟通能力。在这里，故障复盘不为追责，而为改进；在这里，尝试创新不被设限，皆被鼓励。","recruit.campus.homepage.SeniorStudentsContent8":"在携程，通过导师和同事的帮助，以及不断实践、试错与复盘，我提升了专业能力，更学会高效沟通及压力下解决问题，找到了属于自己的职业节奏，并从职场新人成长为可独立负责的开发者。团队并肩作战、彼此支持，让我深知一个人可以走得很快，一群人才能走得更远。我愿如桂花树般，向下扎根、静静绽放。","recruit.campus.homepage.SeniorStudentsContent9":"全球化人才项目Tiger Program吸引我加入了携程。国际化平台、定制化培养与多岗轮岗，帮助我在实践中探索职业方向，从执行者快速成长为思考者。牵头处理全球突发事件，让我在跨部门协同中不断提升系统化思维。团队简单直接、鼓励发声，跨文化氛围开放包容，让我在挑战中突破自我、自信成长。","recruit.campus.homepage.SeniorStudentsContent10":"通过Eagle项目加入携程后，我在短时间内完成了从学生到职业分析师的转变。在这里，没有资历束缚、倡导坦诚沟通，让我敢于提问表达；团队伙伴给予的成长支持，主动赋能互助，让我专注做事、追求卓越。通过真实的业务场景，我不仅夯实了分析能力，还学会了将数据洞察转化为策略价值。","recruit.campus.homepage.SeniorStudentsContent11":"我以HR管培生的身份加入携程，历经1.5年的轮岗最终加入校园招聘团队。团队的温暖支持给予我创意落地的底气，独立操盘校招快闪项目让我实现能力跃迁。如今站在校招一线，希望以真诚态度输出更有温度的校招策略、持续发掘校招新可能，链接更多同频人才加入携程。","recruit.campus.homepage.SeniorStudentsImage5":"https://images3.c-ctrip.com/HrCareers/CampusCareersNew/SeniorStudents/YiZhang.png?__ares_maxage=3","recruit.campus.homepage.SeniorStudentsImage6":"https://images3.c-ctrip.com/HrCareers/CampusCareersNew/SeniorStudents/XianZhang.png?__ares_maxage=3","recruit.campus.homepage.SeniorStudentsImage7":"https://images3.c-ctrip.com/HrCareers/CampusCareersNew/SeniorStudents/DuZihao.png?__ares_maxage=3","recruit.campus.homepage.SeniorStudentsImage8":"https://images3.c-ctrip.com/HrCareers/CampusCareersNew/SeniorStudents/JinFuqi.png?__ares_maxage=3","recruit.campus.homepage.SeniorStudentsImage9":"https://images3.c-ctrip.com/HrCareers/CampusCareersNew/SeniorStudents/HuangJianan.png?__ares_maxage=3","recruit.campus.homepage.SeniorStudentsImage10":"https://images3.c-ctrip.com/HrCareers/CampusCareersNew/SeniorStudents/JiuYueWang.png?__ares_maxage=3","recruit.campus.homepage.SeniorStudentsImage11":"https://images3.c-ctrip.com/HrCareers/CampusCareersNew/SeniorStudents/LiuYuhang.png?__ares_maxage=3","recruit.Careers.CreateResume.addAwards":"添加获奖经历","recruit.experienced.homepage.banner1":"https://images3.c-ctrip.com/HrCareers/CampusCareersNew/Homepage/Experienced/PCCN.jpg?__ares_maxage=0","recruit.experienced.homepage.bannerLink1":"https://careers.ctrip.com/#/experienced/jobList","recruit.experienced.homepageH5.banner1":"https://images3.c-ctrip.com/HrCareers/CampusCareersNew/Homepage/Experienced/H5CN.jpg?__ares_maxage=0","recruit.experienced.homepageH5.bannerLink1":"https://careers.ctrip.com/m/#/experienced/joblist","recruit.campusCareers.project.title.904":"校招内推系统焕新升级！","recruit.campusCareers.project.text904.1":"<p>\n<span style=\"color: #333333; line-height: 160%;\">携程员工请通过公司内部平台“程里机会”进行推荐，操作路径如下：\n<span style=\"color: #333333; line-height: 160%;\">PC端：飞书Home页 - 程里机会 - 校招内推</span></span>\n<span style=\"color: #333333; line-height: 160%;\">移动端：飞书Home页 - 程里机会 - 右上角“≡” - 校招内推</span>\n</p> \n<p>\n<span style=\"color: #333333; line-height: 160%;\">如有任何问题，欢迎联系携程校招官方邮箱 campus@trip.com</span>\n<span style=\"color: #333333; line-height: 160%;\"> ":"From: &lt;A job search&lt;","recruit.overseasCareers.common.locations":"Work location","recruit.overseasCareers.common.myInformation":"My info","recruit.overseasCareers.common.searchJobs":"e.g. project manager","recruit.overseasCareers.common.tripLife":"Working at Trip.com Group","recruit.overseasCareers.employeeStory.content11":"Ma Yuning, a recent graduate from Manchester University, is passionate about travel, and it was this passion which inspired her to join Trip.com Group. As a Trainee Accommodation Manager, she's constantly learning new things about the travel industry, and with the help of cutting edge technology and big data, providing hotel partners with precise insight and innovative solutions.","recruit.overseasCareers.employeeStory.content12":"Yuning says: \"Working at Trip.com Group, I have the chance to do what I love while broadening my skillset. I'm excited to be working at the forefront of the travel industry, and helping our hotel partners to achieve their goals. But most of all, I love meeting and learning from people from all walks of life.\"","recruit.overseasCareers.employeeStory.content13":"This is only the start of Yuning's journey, and we're confident that she'll continue to go from strength to strength and achieve her professional goals.","recruit.overseasCareers.employeeStory.content21":"Bettina Sanada puts her multilingual skills to good use in our International Business Dept., where she's responsible for marketing and operations.","recruit.overseasCareers.employeeStory.content23":"Trip.com Group creates a positive working environment where people are encouraged to achieve their potential. Mutual interaction and encouragement are central to what we do.","recruit.overseasCareers.employeeStory.content22":"Fluent in English, German, Japanese, and Chinese, she has no problem communicating with colleagues from different backgrounds. Bettina's role provides her with ample opportunities to express her ideas and engage in productive collaboration. \"Even if our personal backgrounds are not that similar,\" says Bettina, \"I still feel there is more \"we\" than \"me\" in the team here. We all want to expand our business on a global scale, so everyone listens to and respects the opinions of everyone else. I love being able to express myself and draw upon my strengths.\"","recruit.overseasCareers.employeeStory.content31":"At Trip.com Group, we want everyone to feel a real sense of purpose about what they do. This is a value that Wang Zhibo, who's responsible for providing our offices in Japan with reliable IT support, strongly endorses.","recruit.overseasCareers.employeeStory.content32":"Zhibo spends much of his time dashing back and forth between our two Tokyo offices and assisting our colleagues throughout Japan with their remote working needs. He was instrumental in building an intranet connecting the offices in Japan, a project which certainly kept him busy. In the space of just one month, he negotiated with over 30 companies and compared thousands of solutions before finally finding reaching an agreement with a suitable supplier. Thanks to Zhibo's hard work, the Japanese offices signed a contract with the new supplier to purchase an uninterruptible power supply, solving the connection issues which had disrupted their work for some time.","recruit.overseasCareers.experiencedHirePage.accommodationBusinessDetail":"Our Accommodation Department is the largest accommodation booking platform in mainland China, and the third largest globally. With 97 offices in mainland China and 21 overseas, the department provides around 400,000 hotels across mainland China and an additional 700,000 in over 300 countries and regions, amassing over 300 million room nights annually.","recruit.overseasCareers.experiencedHirePage.airTicketBusinessDetail":"Our Flights Department provides travelers all over the world with convenient, one-stop services for booking flight tickets, checking in for their flight, changing or canceling their tickets, and much more. Services are available in over 20 languages, and travelers can search for international flights with up to 6 segments, with a choice of over 200 countries and regions, over 5,000 cities, and over 450 airlines.","recruit.overseasCareers.employeeStory.update":"Posted at","recruit.overseasCareers.employeeStory.nextStory":"Next","recruit.overseasCareers.employeeStory.lastStory":"Previous","recruit.overseasCareers.employeeStory.content33":"Zhibo embodies the spirit of Trip.com Group, and we're incredibly grateful to him and all of our other employees who carry out their work with such amazing dedication!","recruit.overseasCareers.experiencedHirePage.financeBusinessDetail":"In 2017, Ctrip Finance was established with the goal of providing travel-related financial services. The department is committed to empowering the travel industry with comprehensive, data-driven financial technology, thereby assisting travelers and suppliers alike with their travel needs.","recruit.overseasCareers.experiencedHirePage.functionalDepartmentsDetail":"Our functional departments are responsible for the general running of Trip.com Group, covering marketing, PR, HR, user experience, legal, investment, investor relations, procurement, admin, internal control, auditing, strategic partnerships, and online card payments.","recruit.overseasCareers.experiencedHirePage.internationalBusinessDetail":"The International Business Department is responsible for the operation of our global travel brand—Trip.com. Its goal is to provide travelers throughout the world with one-stop travel booking services. Established in 2007, the department now operates across 27 countries and regions, spanning Asia, Europe, the Americas, and Oceania. Trip.com website content is available in 20 languages and 24/7 customer support is available in 18 languages, while payments can be made in 25 currencies.","recruit.overseasCareers.experiencedHirePage.marketingTeamDetail":"The Marketing Department integrates functions such as content production, public and governmental relations, live broadcasting, food and drink, global procurement, and foreign exchange. The department is committed to driving Trip.com Group's commercial growth across the travel industry by expanding its user base, creating high-quality content, and promoting popular products.","recruit.overseasCareers.experiencedHirePage.serviceTeamDetail":"Trip.com Group's Customer Support Department includes over 13,000 employees spread across global cities such as Shanghai, Tokyo, Edinburgh, Seoul, Nantong, and Guangzhou. The department provides 24/7 customer support in over 20 languages","recruit.overseasCareers.experiencedHirePage.technologyTeamDetail":"Our Technical Support team consists of thousands of expert engineers from all over the world, and provides comprehensive services to support the development and operations of Trip.com Group's many departments. With its creative and proactive approach to problem solving, the team adds considerable value to our products and services. Technical Support engineers have an in-depth knowledge of users' requirements and aim to produce an optimal experience through fast and stable systems, comprehensive products, and easy-to-use functions. A smooth and intuitive platform is key to the experience of our users.","recruit.overseasCareers.experiencedHirePage.trainTicketBusinessDetail":"Our Trains Department was established in 2013 and provides train ticket products and services covering over 40 routes in mainland China, and many more in countries and regions across Asia, Europe, and Oceania. The Trains Department has since expanded into other areas such as bus and boat tickets, and is one of Trip.com Group's fastest-growing departments.","recruit.overseasCareers.experiencedHirePage.vacationBusinessDetail":"The Vacations Department provides comprehensive services including group tours, free travel, tours and tickets, custom trips, cruises, themed travel, study trips, visas, insurance, car services, GlobalBuy, foreign exchange, and more. It offers users one-stop travel services with over 700,000 global travel products across 2,000 cities.","recruit.overseasCareers.experiencedHirePage.viewJob":"View All Jobs","recruit.overseasCareers.foot.about":"About us","recruit.overseasCareers.foot.aboutTrip":"About Trip.com Group","recruit.overseasCareers.foot.contact":"Contact us","recruit.overseasCareers.foot.news":"News","recruit.overseasCareers.foot.legalInformation":"Legal","recruit.overseasCareers.foot.privacyStatement":"Privacy Statement","recruit.overseasCareers.foot.sns":"Follow us","recruit.overseasCareers.foot.termsofUse":"Terms of Use","recruit.overseasCareers.foot.trip":"Trip.com","recruit.overseasCareers.foot.tripGroup":"Trip.com Group","recruit.overseasCareers.home.employeeStory":"Employee stories","recruit.overseasCareers.home.employeeStory1Headline":"I do what I love for a living","recruit.overseasCareers.home.employeeStory1Outline":"Most of all, I love meeting and learning from people from all walks of life.","recruit.overseasCareers.home.employeeStory2Headline":"More \"we\" than \"me\"","recruit.overseasCareers.home.employeeStory2Outline":"Even if we come from different backgrounds, I still feel there is more \"we\" than \"me\" in the team here.","recruit.overseasCareers.home.employeeStory3Outline":"Thanks to Zhibo's hard work, the Japanese offices signed a contract with the new supplier to purchase an uninterruptible power supply, solving the connection issues which had disrupted their work for some time.","recruit.overseasCareers.home.employeeStory3Headline":"The tech expert leading the charge","recruit.overseasCareers.home.group":"Trip.com Group","recruit.overseasCareers.home.introduction":"Trip.com Group provides travelers all over the world with a comprehensive suite of travel products, services, and content. Listed on NASDAQ in 2003 and HKEX in 2021, Trip.com Group's goal is to become the world's leading online travel brand.","recruit.overseasCareers.home.jobCategory":"Job type","recruit.overseasCareers.home.more":"Read more","recruit.overseasCareers.home.proposition":"Employer Value Proposition","recruit.overseasCareers.home.propositionIntro1Content":"Trip.com Group never stops dreaming big and aiming high. Our mission, vision, and focus on high quality enables us to pursue mastery of our craft to deliver the best possible solutions. By tackling challenges and pursuing excellence...","recruit.overseasCareers.home.propositionIntro1ContentFull":"Trip.com Group never stops dreaming big and aiming high. Our mission, vision, and focus on high quality enables us to pursue mastery of our craft to deliver the best possible solutions. By tackling challenges and pursuing excellence, we keep growing and bettering ourselves at the same time.","recruit.overseasCareers.home.propositionIntro1Title":"Strive for the top","recruit.overseasCareers.home.propositionIntro2Content":"We believe in creating a safe space, where discussion is open, ideas flourish and the best solutions win. Together as a team, we offer each other respect and support. In this way...","recruit.overseasCareers.home.propositionIntro2ContentFull":"We believe in creating a safe space, where discussion is open, ideas flourish, and the best solutions win. Together as a team, we respect and support each other. This allows us to build closer connections and make bigger achievements.","recruit.overseasCareers.home.propositionIntro2Title":"Create greatness together","recruit.overseasCareers.home.propositionIntro3Content":"Life is about much more than just work. Trip.com Group is here to support you in every aspect in and out of the workplace. At the same time, being in the travel industry allows us to harness our passion and embrace...","recruit.overseasCareers.home.propositionIntro3ContentFull":"Life is about much more than just work. Trip.com Group is here to support you in every aspect in and out of the workplace. At the same time, being in the travel industry allows us to harness our passion and embrace the traveler in our hearts to pursue the perfect lifetime trip for ourselves.","recruit.overseasCareers.home.propositionIntro3Title":"Celebrate a full life","recruit.overseasCareers.home.viewMoreJobs":"See more jobs","recruit.overseasCareers.jobDetail.requirement":"Requirement","recruit.overseasCareers.jobDetail.responsibility":"Job Description","recruit.overseasCareers.jobList.applyNow":"Apply","recruit.overseasCareers.jobList.businessUnit":"Department","recruit.overseasCareers.jobList.channel":"Contract Types","recruit.overseasCareers.jobList.city":"City","recruit.overseasCareers.jobList.confirmApply":"Confirm","recruit.overseasCareers.jobList.countryRegion":"Country/region","recruit.overseasCareers.jobList.emptySearch":"No results","recruit.overseasCareers.jobList.jobCategory":"Job Categories","recruit.overseasCareers.jobList.less":"Show less","recruit.overseasCareers.jobList.more":"Learn more","recruit.overseasCareers.jobList.otherSearch":"Try adjusting your filters and searching again","recruit.overseasCareers.jobList.noResult":"No matching jobs","recruit.overseasCareers.jobList.page":"Page","recruit.overseasCareers.jobList.recentlyPostedPositions":"Newest first","recruit.overseasCareers.tripLife.cultureLine10":"We recognize your contributions and accomplishments in your career journey by establishing result-driven performance assessments and various awards.","recruit.overseasCareers.tripLife.cultureLine12":"We believe that you're in charge of your own time. Therefore, we offer flexible working arrangements to allow you to have a more fulfilling life in and outside the workplace.","recruit.overseasCareers.jobList.search":"Filters","recruit.overseasCareers.tripLife.developmentLine1":"Channel your passion for travel","recruit.overseasCareers.tripLife.cultureLine4":"We provide employees with various benefits, including medical insurance, mental health support (EAP), vacation subsidies, along with competitive rewards, supporting our employees to live rich and fulfilling lives.","recruit.overseasCareers.tripLife.cultureLine3":"We offer financial and medical support","recruit.overseasCareers.tripLife.developmentLine2":"At Trip.com group, you can transform your love for travel into a career. We provide a wide range of OTA industry careers in our various departments, so you can get to choose the development opportunities that are best for you.","recruit.overseasCareers.jobList.searchCity":"Search cities","recruit.overseasCareers.tripLife.developmentLine3":"We're as passionate as you are about your development","recruit.overseasCareers.experiencedHirePage.viewAllJob":"View jobs","recruit.overseasCareers.common.present":"Present","recruit.overseasCareers.tripLife.cultureLine14":"We understand that it’s not easy to pursue a successful career while raising a family at the same time, so we provide benefits for working parents, such as childcare incentives, fertility benefits for female employees, and more.","recruit.overseasCareers.tripLife.cultureTitle":"Life at Trip.com Group","recruit.overseasCareers.common.NewFriend":"friend","recruit.overseasCareers.tripLife.cultureLine13":"We support working parents","recruit.overseasCareers.tripLife.cultureLine11":"Enjoy flexible working arrangements","recruit.overseasCareers.jobList.startYourNextJob":"Start your next job","recruit.overseasCareers.jobList.searchCountryRegion":"Search countries/regions","recruit.overseasCareers.tripLife.developmentLine4":"At Trip.com group, we have flexible performance management and assessment systems, a dual-channel promotion mechanism for rapid development, job rotation based on career development planning and internal hiring mechanisms that encourage the free movement of talent. We also have a rewarding incentive mechanism that helps us better discover, cultivate and retain top talents.","recruit.overseasCareers.jobList.reset":"Reset","recruit.overseasCareers.tripLife.developmentTitle":"Career development","recruit.overseasCareers.tripLife.cultureLine1":"Work alongside passionate and focused colleagues","recruit.overseasCareers.tripLife.cultureLine6":"We believe that maintaining a healthy lifestyle is important for the well-being of our employees, so we encourage you to take time away from your desk by providing team building, staff clubs, and other activities to keep you feeling productive and full of energy.","recruit.overseasCareers.tripLife.universityLine1":"We work together and learn together","recruit.overseasCareers.common.brands":"Brand and services","recruit.overseasCareers.tripLife.universityTitle":"Trip.com Group Growth Academy","recruit.overseasCareers.tripLife.universityLine2":"Get a step up at every stage of your career with access to industry-leading information and educational resources, from the company's latest strategy to professional skills, from personal competencies to team management practices. Trip.com Group Growth Academy has a range of exclusive training programs including our TMBA and TPMP courses.","recruit.overseasCareers.tripLife.cultureLine8":"We celebrate your special moments, whether it’s your birthday, work anniversary, or important cultural festivals. You'll feel right at home at Trip.com Group.","recruit.overseasCareers.tripLife.cultureLine7":"We celebrate important moments together","recruit.overseasCareers.tripLife.cultureLine2":"Trip.com Group fosters an environment where employees can give full reign to both their entrepreneurial spirit and attention to detail.","recruit.overseasCareers.tripLife.cultureLine5":"Embrace a healthy lifestyle","recruit.overseasCareers.tripLife.cultureLine9":"We reward your efforts","recruit.overseasCareers.home.whoWeAre":"About us","recruit.overseasCareers.home.about":"About","recruit.overseasCareers.common.experiencedHire":"Professionals","recruit.overseasCareers.experiencedHirePage.corporateTravelBusinessDetail":"Corporate Travel is mainland China's leading corporate travel management platform. It utilizes the latest technology to provide business travelers with a wide selection of flights, hotels, and more, as well as professional services and flexible management options. Trip.Biz is the platform of choice for over 11,000 large enterprises, including 250 of the Global Fortune 500 companies and over 100 of the Top 500 Enterprises of China. In addition, more than 360,000 small and medium-sized enterprises have registered with Trip.Biz, of which 37,000 are active users.","recruit.overseasCareers.jobDetail.share":"Share to","recruit.overseasCareers.jobDetail.update":"Update","recruit.overseasCareers.jobDetail.jobId":"Job ID","recruit.overseasCareers.recrEmployeeType.Regular":"Regular ","recruit.overseasCareers.recrEmployeeType.Intern_Long_Term":"Internship","recruit.overseasCareers.recrEmployeeType.Temporary":"Temporary ","recruit.overseasCareers.mobile.back":"Back","recruit.overseasCareers.mobile.Placeholder":"From：a job search","recruit.overseasCareers.employeeStory.content11all":"Ma Yuning, a recent graduate from Manchester University, is passionate about travel, and it was this passion which inspired her to join Trip.com Group. As an Accommodation General Trainee, she's constantly learning new things about the travel industry, and with the help of cutting edge technology and big data, providing hotel partners with precise insight and innovative solutions.\n\nYuning says: \"Working at Trip.com Group, I have the chance to do what I love while broadening my skillset. I'm excited to be working at the forefront of the travel industry, and helping our hotel partners to achieve their goals. But most of all, I love meeting and learning from people from all walks of life.\"\n\nThis is only the start of Yuning's journey, and we're confident that she'll continue to go from strength to strength and achieve her professional goals.","recruit.overseasCareers.employeeStory.content21all":"Bettina Sanada puts her multilingual skills to good use in our International Business Dept., where she's responsible for marketing and operations.\n\nFluent in English, German, Japanese, and Chinese, she has no problem communicating with colleagues from different backgrounds. Bettina's role provides her with ample opportunities to express her ideas and engage in productive collaboration. \"Even if our personal backgrounds are not that similar,\" says Bettina, \"I still feel there is more \"we\" than \"me\" in the team here. We all want to expand our business on a global scale, so everyone listens to and respects the opinions of everyone else. I love being able to express myself and draw upon my strengths.\"\n\nTrip.com Group creates a positive working environment where people are encouraged to achieve their potential. Mutual interaction and encouragement are central to what we do.","recruit.overseasCareers.employeeStory.content31all":"At Trip.com Group, we want everyone to feel a real sense of purpose about what they do. This is a value that Wang Zhibo, who's responsible for providing our offices in Japan with reliable IT support, strongly endorses.\r\n\r\nZhibo spends much of his time dashing back and forth between our two Tokyo offices and assisting our colleagues throughout Japan with their remote working needs. He was instrumental in building an intranet connecting the offices in Japan, a project which certainly kept him busy. In the space of just one month, he negotiated with over 30 companies and compared thousands of solutions before finally finding reaching an agreement with a suitable supplier. Thanks to Zhibo's hard work, the Japanese offices signed a contract with the new supplier to purchase an uninterruptible power supply, solving the connection issues which had disrupted their work for some time.\r\n\r\nZhibo embodies the spirit of Trip.com Group, and we're incredibly grateful to him and all of our other employees who carry out their work with such amazing dedication!","recruit.overseasCareers.employeeStory.content11title":"What really excites me is meeting and learning from people from all walks of life.","recruit.overseasCareers.employeeStory.content21title":"Even if we come from different backgrounds, I still feel there is more \"we\" than \"me\" in the team here.","recruit.overseasCareers.employeeStory.content31title":" Thanks to Zhibo's hard work, the Japanese offices signed a contract with the new supplier to purchase an uninterruptible power supply, solving the connection issues which had disrupted their work for some time.","recruit.overseasCareers.jobFamilyGroup.other_000":"Trainee","recruit.overseasCareers.commonProblem1":"FAQ","recruit.overseasCareers.commonProblem2":"1. Can I apply for multiple job positions at the same time?","recruit.overseasCareers.commonProblem3":"Yes, you can apply for multiple job positions at the same time, but we recommend that you apply for job positions that best match your skills, experience, and passion.","recruit.overseasCareers.commonProblem4":"2. When will I receive my interview invitation after I submit my application?","recruit.overseasCareers.commonProblem5":"If you're selected to advance to the interview stage, you'll usually receive a call from HR within 5–10 working days after submitting your application. Don't worry if they can't get through to you the first time, they'll keep trying, so remember to keep your phone on! If you don't hear from us within this time frame, it's probably because your experience doesn't quite match with the position you applied for. If that's the case, we encourage you to check out our other positions.","recruit.overseasCareers.commonProblem6":"If you don't hear from us within this time frame, it's probably because your experience doesn't quite match with the position you applied for. If that's the case, we encourage you to check out our other positions.","recruit.overseasCareers.commonProblem7":"3. How do I check my interview result?","recruit.overseasCareers.commonProblem10":"You'll receive a phone call from HR who'll give you details about your offer, including the rank and salary of the role. If you accept during the call, we'll send the finalized offer to you by email.","recruit.overseasCareers.commonProblem11":"5. If my application isn't successful, will I still be contacted?","recruit.overseasCareers.commonProblem12":"If you haven't heard back within 2 weeks of submitting your application, the chances are that the position has already been filled. We will keep your resume and interview notes on file. If there is a new position which is more suitable to you, we will reach out to you.","recruit.overseasCareers.commonProblem13":"6. Reminder to Candidates to Beware of Recruitment Scams","recruit.overseasCareers.commonProblem14":"We would like to draw your attention to recent incidents where candidates have fallen prey to recruitment scams. Scammers have been posing as employees of Trip.com Group or third-party recruiting agencies and sending interview and job offer information through text messages or online platforms in order to steal personal information or money.Please be advised that Trip.com Group never conducts a purely text-based interview through instant messaging apps. Formal job offers will be sent via official email, with all official emails originating from the @trip.com or @jobs.trip.com domain. Additionally, Trip.com Group never charges candidates any fees at any stage of the recruitment process.Should you have any questions, please do not hesitate to contact us at careers@trip.com. We encourage you to remain vigilant and report any suspicious activity to us promptly.","recruit.overseasCareers.commonProblem8":"You can click on the top right corner of the Trip.com Group Careers website to access your personal profile. From here, you can see a record of your applications, track the progress of interviews, and contact your HR if you have any questions.","recruit.overseasCareers.commonProblem9":"4. How will I hear about any offers I receive?","recruit.overseasCareers.leadership1":"Our competency model shows the profile of a great Trip.com Group employee: Critical Thinking, Pursuit of Excellence, and Self Motivation.","recruit.overseasCareers.leadership10":"Trip.com Group is a leading one-stop travel service provider comprising of Trip.com, Ctrip, Skyscanner, and Qunar. Founded in 1999 and listed on Nasdaq in 2003 and HKEX in 2021, Trip.com Group has become one of the most popular and influential travel companies in the world.","recruit.overseasCareers.leadership11":"Scan the QR code to apply","recruit.overseasCareers.leadership12":"For more information about this role, head on over to careers.trip.com","recruit.overseasCareers.leadership2":"Leadership Competency Model","recruit.overseasCareers.leadership3":"Values","recruit.overseasCareers.leadership4":"Reflection","recruit.overseasCareers.leadership6":"Action","recruit.overseasCareers.leadership7":" ","recruit.overseasCareers.leadership8":"Motivation","recruit.overseasCareers.leadership9":" ","recruit.overseasCareers.process1":"Recruitment Process","recruit.overseasCareers.process10":"Complete HR interview (there may be multiple rounds, depending on the role)","recruit.overseasCareers.process11":"Join Trip.com","recruit.overseasCareers.process13":"Complete a background check","recruit.overseasCareers.process2":"We're always on the lookout for reliable, bright, and talented individuals who can help us deliver the perfect trip for travelers all over the world. Interested in joining us? Here's how it works:","recruit.overseasCareers.process3":"Apply","recruit.overseasCareers.process4":"Search for job positions","recruit.overseasCareers.process6":"Apply","recruit.overseasCareers.process7":"Interviews","recruit.overseasCareers.process8":"Receive your interview invitation","recruit.overseasCareers.process9":"Complete professional interview","recruit.overseasCareers.values1":"Here at Trip.com, we share a set of core values: CTRIP. It reflects the most recognized c er where you are in the world and which culture you belong to, it is possible to harness great relationships at work, feel like you are part of a team, and find many people who will help you on your day-to-day endeavors and keep your day lively and busy! At Trip.com Group, you never feel alone.”\n\nAt Trip.com Group, we embrace the differences and every employee here can speak his or her mind. From talented colleagues to supportive mangers, you are part of a team that learns and wins together.","recruit.overseasCareers.employeeStory.NewContent2":"Meet Edmund Weng, our Regional Director for Singapore and Malaysia market, who joined Trip.com Group in 2014. \n\nAs he said, “Joining Trip was one of the best career decisions I made in my life. Over here in Trip, the culture is very inclusive which means the ideas are always discussed and tested out regardless of your position.\n\nIn Singapore and Malaysia, we came a long way since about 6 years ago and I am personally proud as to how Trip have grown in serving the travel needs of customers in both countries. Trip is a dynamic world-class OTA platform and equal opportunity employer for your career to take off!”\n\nAt Trip.com Group, we like things simple and straight forward. We nurture a safe space and encourage all employees to express their thoughts. We embrace diversity and inclusion to ensure every individual here is respected, valued and supported.","recruit.overseasCareers.employeeStory.NewContent3":"Ori Richter joined Trip.com Group in August 2018 as he wanted to get familiar with the customer service world. Starting as a customer service agent in the European hub of Trip.com Group provided Ori the basis for learning and developing within the business while providing first class support to Trip’s customers.\n\nWithin 4.5 years Ori progressed within Trip.com Group, he has become the European Operations manager for the flight department in charge of our European customer service providing support in 12 languages covered by our 18 teams across 3 continents.\n\nOri says: “Trip.com Group is an amazing school! Working in a global business like this, allows one to get familiar with different kinds of operations, methods of work, various cultures and a large level of support and opportunities. With every day that passes, my skillset broadens and allows me to grow professionally and personally. Since day one at Trip I really enjoyed my job, which for me is the key to succeed in whatever you do.”","recruit.overseasCareers.employeeStory.NewSummary1":"Trip.com Group really enabled me to see that no matter where you are in the world and which culture you belong to, it is possible to harness great relationships at work and feel like you are part of a team.","recruit.overseasCareers.employeeStory.NewSummary2":"Trip is a dynamic world-class OTA platform and equal opportunity employer for your career to take off","recruit.overseasCareers.employeeStory.NewSummary3":"Trip.com Group is an amazing school! Working in a global business like this, allows one to get familiar with\ndifferent kinds of operations, methods of work, various cultures and a large level of support and opportunities.","recruit.overseasCareers.employeeStory.NewTitle2":"Take off in an inclusive organization","recruit.overseasCareers.employeeStory.NewTitle1":"Thrive in a supportive team","recruit.overseasCareers.employeeStory.NewTitle3":"Grow in a world-class platform","recruit.overseasCareers.locationCity.Abu_Dhabi_Hier":"Abu Dhabi","recruit.overseasCareers.homgpageIdentityVerification.verificationCode":"Verification code","recruit.overseasCareers.homgpageIdentityVerification.emailHelpText":"Fill in your email address","recruit.overseasCareers.homgpageIdentityVerification.emailEditButton":"Maintain email address","recruit.overseasCareers.homgpageIdentityVerification.email":"Email Address","recruit.overseasCareers.homgpageIdentityVerification.phoneHelpText":"Fill in your phone number","recruit.overseasCareers.homgpageIdentityVe sCareers.home.home":"Home","recruit.overseasCareers.common.place":"City","recruit.overseasCareers.home.index":"Job List","recruit.overseasCareers.home.readMore":"Show More","recruit.overseasCareers.employeeStory.banner":"https://images3.c-ctrip.com/HrCareers/ProEmployeeStory/storyBanner.jpg?__ares_maxage=0","recruit.overseasCareers.brand.1.icon":"https://images3.c-ctrip.com/HrCareers/CareersHome/Trip.com.svg?__ares_maxage=0","recruit.overseasCareers.brand.2.icon":"https://images3.c-ctrip.com/HrCareers/CareersHome/CtripEN.svg?__ares_maxage=0","recruit.overseasCareers.brand.3.icon":"https://images3.c-ctrip.com/HrCareers/CareersHome/Skyscanner.svg?__ares_maxage=0","recruit.overseasCareers.brand.4.icon":"https://images3.c-ctrip.com/HrCareers/CareersHome/QunarEN.svg?__ares_maxage=0","recruit.overseasCareers.brand.1.bgImg":"https://images3.c-ctrip.com/HrCareers/CareersHome/brand-bg-trip-intl-0413.jpg?__ares_maxage=0","recruit.overseasCareers.brand.2.bgImg":"https://images3.c-ctrip.com/HrCareers/CareersHome/brand-bg-trip-doms.jpg?__ares_maxage=0","recruit.overseasCareers.brand.3.bgImg":"https://images3.c-ctrip.com/HrCareers/CareersHome/brand-bg-skyscanner-0413.jpg?__ares_maxage=0","recruit.overseasCareers.brand.4.bgImg":"https://images3.c-ctrip.com/HrCareers/CareersHome/brand-bg-qunar.jpg?__ares_maxage=0","recruit.overseasCareers.brand.1.title":"https://images3.c-ctrip.com/HrCareers/CareersHome/Trip.comLogoEN.png?__ares_maxage=0","recruit.overseasCareers.brand.2.title":"https://images3.c-ctrip.com/HrCareers/CareersHome/ctripLogoEN.png?__ares_maxage=0","recruit.overseasCareers.brand.3.title":"https://images3.c-ctrip.com/HrCareers/CareersHome/SkyscannerLogoEN.png?__ares_maxage=0","recruit.overseasCareers.brand.4.title":"https://images3.c-ctrip.com/HrCareers/CareersHome/qunarLogoEN.png?__ares_maxage=0","recruit.overseasCareers.brand.1.content":"Trip.com is an international one-stop travel service provider available in 24 languages across 39 countries and regions in 29 local currencies on 48 sites. Trip.com has an extensive hotel and flight network consisting of more than 1.2 million hotels and flights from over 480 airlines covering 2,600 airports in 200 countries and regions around the globe. Trip.com's world-class 24/7 multilingual customer service as well as additional centres in Edinburgh, Tokyo and Seoul, help to 'create the best travel experience' for its millions of customers worldwide.","recruit.overseasCareers.brand.2.content":"Ctrip was founded in 1999 and is one of the most well-known travel brands in China. Headquartered in Shanghai, it has over 30,000 employees based in offices in 95 locations in China and 22 international branches. Ctrip’s integrated offering provides its members with a wide range of digital applications, hotel and air ticket reservations, attractions, tour packages, business travel management and travel-related content.","recruit.overseasCareers.brand.3.content":"Founded in 2003, Skyscanner is a leading travel marketplace dedicated to putting travellers first. Skyscanner helps millions of people in 52 countries and over 30 languages find the best travel options for flights, hotels and car hire every month. Skyscanner is available on desktop, mobile web and its highly rated app has 100 million downloads. Working with 1,200 travel partners, Skyscanner’s mission is to lead the global transformation to modern and sustainable travel.","recruit.overseasCareers.brand.4.content":"Qunar is a leading travel services platform in China. It performs searches over 9,000 travel agency websites in real time, covering more than 680,000 domestic and international routes worldwide. The platform has wide search and reservation coverage worldwide including hotels, vacation routes, and destination tickets and entertainment listings.","recruit.overseasCareers.home.proposition.2.bgImg":"https://images3.c-ctrip.com/HrCareers/CareersHome/EVP2.jpg?__ares_maxage=0","recruit.overseasCareers.home.proposition.1.bgImg":"https://images3.
