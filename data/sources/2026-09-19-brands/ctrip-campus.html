ce.46":"技术团队","recruit.overseasCareers.BUSource.52":"市场团队","recruit.overseasCareers.common.allJobs":"查看职位","recruit.overseasCareers.common.campusHire":"校园招聘","recruit.overseasCareers.common.home.Placeholder":"从：&lt;一次职位的搜索&lt;","recruit.overseasCareers.common.locations":"工作地点","recruit.overseasCareers.common.myInformation":"我的信息","recruit.overseasCareers.common.searchJobs":"输入职位关键词","recruit.overseasCareers.common.tripLife":"在携程","recruit.overseasCareers.employeeStory.content11":"毕业于曼彻斯特大学的马宇宁非常热爱旅行，这是她加入携程集团的重要原因。作为大住宿管培生，马宇宁站在了携程集团而非旅行者的视角，看到了一个崭新的世界。我们最先进的技术和实时更新的大数据让马宇宁能够站在行业尖端，保持对业务的敏锐度，为合作伙伴提供明确的想法与见解。","recruit.overseasCareers.employeeStory.content12":"“在携程集团，我有很多机会去做我热爱的事情并展现我的优势，也很激动我总能站在行业的最前沿，和酒店合作伙伴实现互利共赢。然而，最让我愉悦的是我能够认识各行各业的人们，学习他们身上的闪光点。”马宇宁说道。","recruit.overseasCareers.employeeStory.content13":"这是马宇宁职业生涯的起点，希望她能够在我们的舞台上继续发光发热，实现她的职业目标。在携程集团，每个人都能尽情享受一段美好的职业生涯。","recruit.overseasCareers.employeeStory.content21":"Bettina Sanada精通数种语言，在国际业务部门负责市场和运营。让我们来认识一下Bettina，看看为什么我们的员工喜欢在这里工作。","recruit.overseasCareers.employeeStory.content23":"携程集团致力于让员工在包容的环境中发挥潜力，所以我们总会鼓励员工多多互动，而不仅仅是专注于个人事务。","recruit.overseasCareers.employeeStory.content22":"Bettina精通英语、德语、日语和中文，这让她能够和不同文化背景的同事进行无障碍的交流。 在包容的工作环境中，Bettina有许多机会去提出自己的想法，与团队成员一同合作。 “尽管我们的个人背景都不尽相同，但我在团队中感受到的是“我们”，不仅仅是“我”。带着在全球拓展业务的目标，我们每个人都愿意倾听并尊重自己的同事。因此，我十分乐于在这里表达自我，释放自己的力量。”","recruit.overseasCareers.employeeStory.content31":"携程集团非常重视工作中保持责任心。日本分公司IT部门的王志博认可我们的精神，坚持为我们在日本所有的办事处提供可靠的技术支持。","recruit.overseasCareers.employeeStory.content32":"在日常工作中，王志博总是在东京的两个办事处往返奔波，并为四个地区提供远程支持。在日本办事处的内网建设项目期间，虽然工作量很大，但王志博在一个月内和30多个供应商进行了协商，进行了数千次方案比较，最终与外部供应商成功建立了合作关系，为员工保障了稳定的网络环境。他的尽心尽力让日本办事处和新的合作伙伴签订了合同，购买了UPS一体机，解决了不少历史遗留问题。","recruit.overseasCareers.experiencedHirePage.accommodationBusinessDetail":"大住宿事业部是中国最大的酒店预订平台和世界第三大酒店预订平台，在国内有97个分公司办事处，海外有21个分公司办事处（国家/地区）。目前提供国内40万家、海外300+国家地区70万家酒店预订，年间夜量超过3亿。","recruit.overseasCareers.experiencedHirePage.airTicketBusinessDetail":"携程机票业务为全球旅行者提供自助机票预订、值机、退票、改签等一站式便捷服务，国际机票支持最多6段复杂行程在线查询。全球用户可使用20多种语言选择200多个国家、5000多个城市、450多家航空公司的机票。","recruit.overseasCareers.employeeStory.update":"分享于","recruit.overseasCareers.employeeStory.nextStory":"下一段故事","recruit.overseasCareers.employeeStory.lastStory":"上一段故事","recruit.overseasCareers.employeeStory.content33":"王志博的付出让携程集团的价值观付诸实践。在这里，我们想向所有全心全意履行职责的员工致以最衷心的感谢！","recruit.overseasCareers.experiencedHirePage.financeBusinessDetail":"携程金融始于2017年，以“金融助力旅行”为使命，以场景为基础，以大数据为角色，致力于以金融科技赋能旅行产业，帮助旅行客户和供应商解决各类金融需求。携程金融，让您的旅行与众不同！","recruit.overseasCareers.experiencedHirePage.functionalDepartmentsDetail":"携程集团职能部门包含了人力资源部、财务部、法务部、携程投资部、投资者关系部、采购管理部、行政部、内控管理部、审计部、战略合作部以及预付卡业务部，为公司的日常运营保驾护航。","recruit.overseasCareers.experiencedHirePage.internationalBusinessDetail":"国际事业部是我们的全球品牌-Trip.com的主要运营部门。我们的愿景是为全球的客户提供一站式旅行预订服务。自2007年创建以来，部门业务已在包括亚洲、欧洲、美洲和大洋洲的27个国家和地区开展。网站提供超过20种语言的在线产品，18种语言的24/7客户服务，以及25种汇率的支付服务。","recruit.overseasCareers.experiencedHirePage.marketingTeamDetail":"大市场是集市场营销、用户和内容产品中心、PRGR、携程直播、携程美食、携程全球购和携程外汇多维于一体的大家庭。致力于通过聚合流量、内容、商品三大板块，打造开放的营销生态循环系统，助力携程打造泛旅游商业体。","recruit.overseasCareers.experiencedHirePage.serviceTeamDetail":"携程服务部在全球拥有近13000名员工，分布在上海、南通、广州、东京、首尔、爱丁堡、泰国等国内外城市，我们以超过20种语言，7*24的暖心服务，业界领先的服务设计水平，致力于为全世界的超过4亿的集团品牌用户提供高品质和国际化的服务体验。","recruit.overseasCareers.experiencedHirePage.technologyTeamDetail":"携程技术团队由数千名来自海内外的精英工程师组成，为集团各业务线的运作和开拓提供全面技术支持，并以技术创新源源不断地为产品和服务创造价值。携程技术人深入了解用户需求，以高速稳定的系统、丰富全面的产品、轻简便捷的功能、流畅贴心的体验，力求用技术去改变旅行者的生活。","recruit.overseasCareers.experiencedHirePage.trainTicketBusinessDetail":"火车票事业部成立于2013年，提供国内、国际火车票领域产品服务及相关平台化建设，业务覆盖国内火车40余万条线路，国际业务覆盖亚洲，欧洲和大洋洲的多个国家和地区。火车票事业部还孵化了汽车票和船票等业务，是集团增长最快的战略业务单元之一。","recruit.overseasCareers.experiencedHirePage.vacationBusinessDetail":"携程集团旅游事业群拥有跟团游、自由行、私家团、定制游、高端奢游（鸿鹄逸游）、主题游、 周边游、门票、活动、邮轮、游学、签证、保险、租车、用车以及香港永安旅游和台湾易游网等最为全面的产品线，拥有全球共计70多万条度假产品，覆盖 2000 多个城市，为全球用户提供旅游一站式服务。","recruit.overseasCareers.experiencedHirePage.viewJob":"查看全部职位","recruit.overseasCareers.foot.about":"关于我们","recruit.overseasCareers.foot.aboutTrip":"关于携程","recruit.overseasCareers.foot.contact":"联系我们","recruit.overseasCareers.foot.news":"Trip.com","recruit.overseasCareers.foot.legalInformation":"法律信息","recruit.overseasCareers.foot.privacyStatement":"隐私政策","recruit.overseasCareers.foot.sns":"关注我们","recruit.overseasCareers.foot.termsofUse":"用户协议","recruit.overseasCareers.foot.trip":"携程旅行网","recruit.overseasCareers.foot.tripGroup":"携程集团","recruit.overseasCareers.home.employeeStory":"员工故事","recruit.overseasCareers.home.employeeStory1Headline":"享受工作，尽情热爱","recruit.overseasCareers.home.employeeStory1Outline":"最让我愉悦的是我能够认识各行各业的人们，学习他们身上的闪光点。","recruit.overseasCareers.home.employeeStory2Headline":"“我们”的力量","recruit.overseasCareers.home.employeeStory2Outline":"尽管我们的个人背景都不尽相同，但我在团队中感受到的是“我们”，不仅仅是“我”。","recruit.overseasCareers.home.employeeStory3Outline":"他的尽心尽力让日本办事处和新的合作伙伴签订了合同，购买了UPS一体机，解决了不少历史遗留问题。","recruit.overseasCareers.home.employeeStory3Headline":"独当一面的技术达人","recruit.overseasCareers.home.group":"携程集团","recruit.overseasCareers.home.introduction":"携程集团（Trip.com Group）是全球领先的一站式旅行平台，公司旗下的平台，包括携程旅行、Trip.com、去哪儿、天巡等，可面向全球用户提供一套完整的旅行产品、服务及差异化的旅行内容。携程于2003年在美国纳斯达克交易所上市，并于2021年在香港联合交易所上市。未来几年，携程致力于成为具有全球影响力和受人尊敬的在线旅游企业。","recruit.overseasCareers.home.jobCategory":"职位类型","recruit.overseasCareers.home.more":"了解更多","recruit.overseasCareers.home.proposition":"雇主价值主张","recruit.overseasCareers.home.propositionIntro1Content":"携程集团是一家志存高远的公司，我们有着远大的使命和愿景，也始终坚定着一往无前的脚步。我也希望每一位员工都能在全力以赴追求卓越、迎接挑战的路上，不断激发潜能、突破自我、收获成长、成就辉煌 ···","recruit.overseasCareers.home.propositionIntro1ContentFull":"携程集团是一家志存高远的公司，我们有着远大的使命和愿景，也始终坚定着一往无前的脚步。我也希望每一位员工都能在全力以赴追求卓越、迎接挑战的路上，不断激发潜能、突破自我、收获成长、成就辉煌。携手迈向世界之巅的征途是鼓舞人心的，星辰和大海，我们一同奔赴。","recruit.overseasCareers.home.propositionIntro1Title":"全力以赴，攀登世界之巅","recruit.overseasCareers.home.propositionIntro2Content":"我们一直相信，一个自由开放的环境有助于激发每个人的创造力。在携程，无论职级和职位，每个人真诚的声音都值得被尊重。简单直接的交流、亲密无间的合作，不仅可以让我们更好地凝聚成更强大的力量 ···","recruit.overseasCareers.home.propositionIntro2ContentFull":"我们一直相信，一个自由开放的环境有助于激发每个人的创造力。在携程，无论职级和职位，每个人真诚的声音都值得被尊重。简单直接的交流、亲密无间的合作，不仅可以让我们更好地凝聚成更强大的力量，还可以让你收获珍贵的情谊和杰出的成就。","recruit.overseasCareers.home.propositionIntro2Title":"简单直接，共创自由之域","recruit.overseasCareers.home.propositionIntro3Content":"我们的人生不应该只有工作，我希望我们的员工都有一个充盈精彩的人生。在这里，你可以灵活把控自己的时间，在有张有弛的节奏中，看到自己更多的可能性。同时，身处旅游行业的我们，也要释放心中那个“旅行家” ···","recruit.overseasCareers.home.propositionIntro3ContentFull":"我们的人生不应该只有工作，我希望我们的员工都有一个充盈精彩的人生。在这里，你可以灵活把控自己的时间，在有张有弛的节奏中，看到自己更多的可能性。同时，身处旅游行业的我们，也要释放心中那个“旅行家”，将那份热爱投入到这个厚重一生的事业中。追求完美旅程，为他人，更为自己。","recruit.overseasCareers.home.propositionIntro3Title":"精彩人生，拥抱完美之旅","recruit.overseasCareers.home.viewMoreJobs":"查看更多职位","recruit.overseasCareers.jobDetail.requirement":"职位描述","recruit.overseasCareers.jobDetail.responsibility":"职位描述","recruit.overseasCareers.jobList.applyNow":"立即申请","recruit.overseasCareers.jobList.businessUnit":"事业部","recruit.overseasCareers.jobList.channel":"工作性质","recruit.overseasCareers.jobList.city":"城市","recruit.overseasCareers.jobList.confirmApply":"确认申请","recruit.overseasCareers.jobList.countryRegion":"国家/地区","recruit.overseasCareers.jobList.emptySearch":"暂无搜索内容","recruit.overseasCareers.jobList.jobCategory":"职位类型","recruit.overseasCareers.jobList.less":"收起","recruit.overseasCareers.jobList.more":"了解更多","recruit.overseasCareers.jobList.otherSearch":"请尝试其他搜索条件","recruit.overseasCareers.jobList.noResult":"没有找到与你的搜索条件相符的结果","recruit.overseasCareers.jobList.page":"页","recruit.overseasCareers.jobList.recentlyPostedPositions":"最新发布排序","recruit.overseasCareers.tripLife.cultureLine10":"五周年、八周年、CEO杰出贡献、优秀奖、文化奖，在这里共同见证你的成长与荣耀。","recruit.overseasCareers.tripLife.cultureLine12":"每年120元，即可参与“游游互助计划”，给他人一份帮助，给自己一份保障。您也可以为自己和家人选择更完善的商业保险计划，我们帮助您用最优惠的方式享受优质的保险福利。（仅适用于工作地在中国的员工）","recruit.overseasCareers.jobList.search":"筛选职位","recruit.overseasCareers.tripLife.developmentLine1":"把对旅游的热爱赋予工作","recruit.overseasCareers.tripLife.cultureLine4":"我们为员工提供各种福利。出勤补贴，携程医务室，年度体检等样样齐全，我们还为热爱旅游的您提供了旅游福利金。","recruit.overseasCareers.tripLife.cultureLine3":"福利津贴样样齐全","recruit.overseasCareers.tripLife.developmentLine2":"在携程，你可以将对旅游的热爱变成工作。OTA行业的各类职位，各种业务条线，你都可以在这选择到合适的发展机会，携程将为你提供更好的平台。","recruit.overseasCareers.jobList.searchCity":"搜索城市","recruit.overseasCareers.tripLife.developmentLine3":"我们关注你的发展","recruit.overseasCareers.experiencedHirePage.viewAllJob":"查看职位","recruit.overseasCareers.common.present":"至今","recruit.overseasCareers.tripLife.cultureLine14":"携程为孕期的员工提供每日交通补贴；在您的宝宝出生时，可申请生育礼金和生育医疗补贴；各类育儿讲座不间断；儿童节我们将为您的宝贝送上六一贺礼。（仅适用于中国大陆员工）","recruit.overseasCareers.tripLife.cultureTitle":"文化、生活、福利","recruit.overseasCareers.common.NewFriend":"新朋友","recruit.overseasCareers.tripLife.cultureLine13":"安心做妈妈我们支持您","recruit.overseasCareers.tripLife.cultureLine11":"游游互助给您一份保障","recruit.overseasCareers.jobList.startYourNextJob":"开启下一个机遇","recruit.overseasCareers.jobList.searchCountryRegion":"搜索国家/地区","recruit.overseasCareers.tripLife.developmentLine4":"携程拥有多样灵活的绩效管理和考核体系，快速发展的双通道晋升机制，基于职业发展规划的轮岗和鼓励人才内部自由流动的市场，重视投入产出高回报的激励机制，以帮助我们更好地发现、培养和保留人才。","recruit.overseasCareers.jobList.reset":"重置","recruit.overseasCareers.tripLife.developmentTitle":"人才发展","recruit.overseasCareers.tripLife.cultureLine1":"和一群既激情纯真，又严谨专注的伙伴共同拼搏","recruit.overseasCareers.tripLife.cultureLine6":"健身房、俱乐部、周末户外运动出去浪，我们工作努力，我们运动同样精彩！","recruit.overseasCareers.tripLife.universityLine1":"是同事，也是同学","recruit.overseasCareers.common.brands":"品牌与服务","recruit.overseasCareers.tripLife.universityTitle":"程长学园","recruit.overseasCareers.tripLife.universityLine2":"从公司最新战略到专业技能，从个人能力提升到团队管理实践，你将获得行业领先的信息与课程资源。程长学园独有的TMBA、TPMP、高质量等专属培训项目，也将助力你职业发展的每一个阶段。","recruit.overseasCareers.tripLife.cultureLine8":"您的生日，入职纪念日，我们送上祝福；携程司庆、年会、运动会、客服节、极客节、家庭日、重要节假日，我们一起欢度；一年四季，我们同在。","recruit.overseasCareers.tripLife.cultureLine7":"每一个重要时刻我们一起庆祝","recruit.overseasCareers.tripLife.cultureLine2":"携程人的基因里，有着创业者的激情和纯真，又有着成功者必备的专注和严谨。","recruit.overseasCareers.tripLife.cultureLine5":"运动健身享受健康生活","recruit.overseasCareers.tripLife.cultureLine9":"见证你的每一份努力和荣耀","recruit.overseasCareers.home.whoWeAre":"关于我们","recruit.overseasCareers.home.about":"了解","recruit.overseasCareers.common.experiencedHire":"社会招聘","recruit.overseasCareers.experiencedHirePage.corporateTravelBusinessDetail":"携程商旅是中国领先的差旅管理公司，依靠强大的资源、先进的技术、优质的服务和专业的管理，为1万1千多家大型企业提供服务，包括250家世界五百强和100余家中国五百强企业。中小企业注册客户超过36万家，活跃 3.7万家。","recruit.overseasCareers.jobDetail.share":"分享至","recruit.overseasCareers.jobDetail.update":"更新于","recruit.overseasCareers.jobDetail.jobId":"职位ID","recruit.overseasCareers.recrEmployeeType.Regular":"全职","recruit.overseasCareers.recrEmployeeType.Intern_Long_Term":"实习","recruit.overseasCareers.recrEmployeeType.Temporary":"兼职","recruit.overseasCareers.mobile.back":"返回","recruit.overseasCareers.mobile.Placeholder":"从：一次职位的搜索","recruit.overseasCareers.employeeStory.content11all":"毕业于曼彻斯特大学的马宇宁非常热爱旅行，这是她加入携程集团的重要原因。作为大住宿管培生，马宇宁站在了携程集团而非旅行者的视角，看到了一个崭新的世界。我们最先进的技术和实时更新的大数据让马宇宁能够站在行业尖端，保持对业务的敏锐度，为合作伙伴提供明确的想法与见解。\r\r\r\n\r\r\r\n“在携程集团，我有很多机会去做我热爱的事情并展现我的优势，也很激动我总能站在行业的最前沿，和酒店合作伙伴实现互利共赢。然而，最让我愉悦的是我能够认识各行各业的人们，学习他们身上的闪光点。”马宇宁说道。\r\r\r\n\r\r\r\n这是马宇宁职业生涯的起点，希望她能够在我们的舞台上继续发光发热，实现她的职业目标。在携程集团，每个人都能尽情享受一段美好的职业生涯。","recruit.overseasCareers.employeeStory.content21all":"Bettina Sanada精通数种语言，在国际业务部门负责市场和运营。让我们来认识一下Bettina，看看为什么我们的员工喜欢在这里工作。\r\r\r\n\r\r\r\nBettina精通英语、德语、日语和中文，这让她能够和不同文化背景的同事进行无障碍的交流。 在包容的工作环境中，Bettina有许多机会去提出自己的想法，与团队成员一同合作。 “尽管我们的个人背景都不尽相同，但我在团队中感受到的是“我们”，不仅仅是“我”。带着在全球拓展业务的目标，我们每个人都愿意倾听并尊重自己的同事。因此，我十分乐于在这里表达自我，释放自己的力量。\r\r\r\n\r\r\r\n”携程集团致力于让员工在包容的环境中发挥潜力，所以我们总会鼓励员工多多互动，而不仅仅是专注于个人事务。","recruit.overseasCareers.employeeStory.content31all":"携程集团非常重视工作中保持责任心。日本分公司IT部门的王志博认可我们的精神，坚持为我们在日本所有的办事处提供可靠的技术支持。\r\r\r\n\r\r\r\n在日常工作中，王志博总是在东京的两个办事处往返奔波，并为四个地区提供远程支持。在日本办事处的内网建设项目期间，虽然工作量很大，但王志博在一个月内和30多个供应商进行了协商，进行了数千次方案比较，最终与外部供应商成功建立了合作关系，为员工保障了稳定的网络环境。他的尽心尽力让日本办事处和新的合作伙伴签订了合同，购买了UPS一体机，解决了不少历史遗留问题。\r\r\r\n\r\r\r\n王志博的付出让携程集团的价值观付诸实践。在这里，我们想向所有全心全意履行职责的员工致以最衷心的感谢！","recruit.overseasCareers.employeeStory.content11title":"最让我愉悦的是我能够认识各行各业的人们，学习他们身上的闪光点","recruit.overseasCareers.employeeStory.content21title":"尽管我们的个人背景都不尽相同，但我在团队中感受到的是“我们”，不仅仅是“我”","recruit.overseasCareers.employeeStory.content31title":"他的尽心尽力让日本办事处和新的合作伙伴签订了合同，购买了UPS一体机，解决了不少历史遗留问题","recruit.overseasCareers.jobFamilyGroup.other_000":"集团培训生","recruit.overseasCareers.commonProblem1":"常见问题","recruit.overseasCareers.commonProblem2":"1、我可以同时申请多个职位吗？","recruit.overseasCareers.commonProblem3":"可以，但我们建议您根据技能、过往经验和兴趣进行精准投递。","recruit.overseasCareers.commonProblem4":"2、申请职位后多久会收到面试邀约？","recruit.overseasCareers.commonProblem5":"正常需5-10个工作日，HR会电话进行邀约面试。如错过邀约，HR会尝试继续联系，请注意电话畅通，留意来电。若逾时没有联系，可能是您过往的经历与该职位的预期有所差异，而我们未能及时告知，敬请谅解，建议再尝试申请其他职位。","recruit.overseasCareers.commonProblem6":"若逾时没有联系，可能是您过往的经历与该岗位的预期有所差异，而我们未能及时告知，敬请谅解，建议再尝试申请其他职位。","recruit.overseasCareers.commonProblem7":"3、如何查看面试结果？","recruit.overseasCareers.commonProblem10":"您会先接到HR的电话，告知您offer职位的职级和薪资情况等。若您口头接受，我们会将最终offer以电子邮件的形式发送给您。","recruit.overseasCareers.commonProblem11":"5、如果面试的职位已有了合适人选，我会收到通知吗？","recruit.overseasCareers.commonProblem12":"若您在2周内没有收到我们进一步的邀约，则表示我们很可能已有了更为合适的人选。但您的履历和在面试中的表现仍会被妥善储存并记录在我们的人才库中，若有更匹配您的职位，我们会及时再与您取得联系！","recruit.overseasCareers.commonProblem13":"6. 提醒求职者注意招聘诈骗","recruit.overseasCareers.commonProblem14":"近期，我们注意到一些求职者遭遇了招聘诈骗。诈骗者冒充携程集团员工或第三方招聘机构，通过短信或网络平台发送面试和工作机会信息，以此窃取个人信息或骗取钱财。请注意，携程集团不会通过即时通讯App进行纯文字面试。正式的工作机会将会通过官方邮件发送，所有官方邮件都来自“@trip.com”或“@jobs.trip.com”域名。同时，携程集团在招聘全流程中都不会以任何理由、任何形式向求职者收取费用。如有任何疑问，请联系careers@trip.com。我们建议您保持警惕，并及时向我们报告任何可疑行为。","recruit.overseasCareers.commonProblem8":"您可以点击携程招聘官网右上角进入个人主页，查阅您的申请记录和面试过程；也可以联络与您对接的HR，询问相关面试进度。","recruit.overseasCareers.commonProblem9":"4、Offer会以怎样的形式告知？","recruit.overseasCareers.leadership1":"领导力模型展示了优秀程里人的画像——思考力、执行力、自驱力。","recruit.overseasCareers.leadership10":"携程集团（Trip.com Group）是全球领先的一站式旅行平台，公司旗下的平台，包括携程旅行、Trip.com、去哪儿、天巡等，可面向全球用户提供一套完整的旅行产品、服务及差异化的旅行内容。携程于2003年在美国纳斯达克交易所上市，并于2021年在香港联合交易所上市。未来几年，携程致力于成为具有全球影响力和受人尊敬的在线旅游企业。","recruit.overseasCareers.leadership11":"扫描二维码申请","recruit.overseasCareers.leadership12":"更多职位信息，请至携程招聘官网（careers.trip.com）查看","recruit.overseasCareers.leadership2":"领导力模型","recruit.overseasCa ":"成都","recruit.overseasCareers.locationCity.CO0036":"天津","recruit.overseasCareers.locationCity.CO0047":"石家庄","recruit.overseasCareers.locationCity.Qinhuangdao_Hier":"秦皇岛","recruit.overseasCareers.locationCity.Baoding_Hier":"保定","recruit.overseasCareers.locationCity.Zhangjiakou_Hier":"张家口","recruit.overseasCareers.locationCity.Chengde_Hier":"承德","recruit.overseasCareers.locationCity.CO0046":"太原","recruit.overseasCareers.locationCity.Huhehaote_Hier":"呼和浩特","recruit.overseasCareers.locationCity.Chifeng_Hier":"赤峰","recruit.overseasCareers.locationCity.CO0011":"沈阳","recruit.overseasCareers.locationCity.CO0048":"大连","recruit.overseasCareers.locationCity.LOCATION_HIERARCHY-3-353":"营口","recruit.overseasCareers.locationCity.CO0045":"长春","recruit.overseasCareers.locationCity.Jilin_Hier":"吉林","recruit.overseasCareers.locationCity.CO0044":"哈尔滨","recruit.overseasCareers.locationCity.CO0006":"南通","recruit.overseasCareers.locationCity.CO0063":"如皋","recruit.overseasCareers.locationCity.CO0062":"南昌","recruit.overseasCareers.locationCity.Jiujiang_Hier":"九江","recruit.overseasCareers.locationCity.Ganzhou_Hier":"赣州","recruit.overseasCareers.locationCity.CO0015":"重庆","recruit.overseasCareers.locationCity.CO0050":"贵阳","recruit.overseasCareers.locationCity.Zunyi_Hier":"遵义","recruit.overseasCareers.locationCity.CO0038":"昆明","recruit.overseasCareers.locationCity.CO0026":"丽江","recruit.overseasCareers.locationCity.Lasa_Hier":"拉萨","recruit.overseasCareers.locationCity.CO0032":"西安","recruit.overseasCareers.locationCity.CO0051":"兰州","recruit.overseasCareers.locationCity.CO0102":"西宁","recruit.overseasCareers.locationCity.CO0053":"银川","recruit.overseasCareers.locationCity.CO0049":"乌鲁木齐","recruit.overseasCareers.locationCity.CO0010":"深圳","recruit.overseasCareers.employeeStory.NewContent1":"Gulce Karsli Rozenveld是携程欧洲区域的一位资深总监，在携程工作的每一天对她来说都像是一段新的旅程，充满新奇与挑战。\n\n“我和来自世界各地、不同文化的伙伴们一起共事，每天都会学到关于某个领域或产品的新知识，这促使我不断扩大自己的视野、知识，提升效率，成为更好的自己。这让我充满了工作的动力”\n\n在携程，无论来自世界的哪个地方、属于哪种文化，都可以在工作中建立良好的关系，成为多元文化大家庭中的一员，并且找到许多在日常工作中热情友爱、活力满满的伙伴。\n\n在这里，我们拥抱差异，每个人都可以大声表达他的见解。从才华横溢的同事到支持帮助你的经理，每个人都是这个“一起进步、一起赢”的团队里不可缺少的力量。","recruit.overseasCareers.employeeStory.NewContent2":"Edmund Weng，是新加坡和马来西亚区域市场总监，他于2014年加入携程集团。\r\n\r\n他将 “加入携程”看作是一生中做出的最好的职业决定之一。原因是这里拥有非常开放包容的企业文化，这意味着”无论你的职位如何，你的想法都会被倾听、讨论和检验”。\r\n\r\n携程布局新加坡和马来西亚市场的6年来，在当地的发展取得了长足进步，Edmund对携程在满足两国客户旅行需求方面做出的贡献感到自豪。携程是一个充满活力和无限前景的全球OTA平台，也是让每位伙伴收获平等的事业腾飞机会的优秀雇主！\r\n\r\n在携程，我们提倡简单直接，大声说话。我们用安全的氛围鼓励所有伙伴大声表达自己的想法；用多元包容的态度确保每个人都得到尊重和支持。","recruit.overseasCareers.employeeStory.NewContent3":"Ori Richter于2018年8月加入携程集团，他从担任携程集团欧洲中心客户服务代理起步，逐步深耕在客户服务这一领域。在为携程的客户提供一流服务支持的同时，Ori在业务的学习和发展方面也打下了很好的基础。\n\n在携程集团的四年半时间里，Ori一步步成长为机票业务的欧洲区域运营经理，负责整个欧洲客户服务，通过遍布三大洲的18个客服团队为客户提供12种语言的服务支持。\n\nOri说:“携程集团是一所令人惊叹的学校。在这样一家全球性的企业中工作，可以让人快速熟悉各种不同的运作方式、工作方法、文化差异性，还可以获得大量的支持和机会。伴随着时间，我的技能范围越来越广，在专业领域和职业发展上都收获了很好的成长。从加入携程的第一天起，我就非常享受在这里的工作状态，对我来说无论做的是什么，这都是成功的关键。”","recruit.overseasCareers.employeeStory.NewSummary1":"在携程，无论来自世界的哪个地方、属于哪种文化，都可以在工作中建立良好的关系，成为多元文化大家庭中的一员。","recruit.overseasCareers.employeeStory.NewSummary2":"携程是一个充满活力和无限前景的全球OTA平台，也是让每位伙伴收获平等的事业腾飞机会的优秀雇主！","recruit.overseasCareers.employeeStory.NewSummary3":"携程集团是一所令人惊叹的学校!在这样一家全球性的企业中工作，可以让人快速熟悉各种不同的运作方式、工作方法、文化差异性，还可以获得大量的支持和机会。","recruit.overseasCareers.employeeStory.NewTitle2":"在开放包容型组织中腾飞","recruit.overseasCareers.employeeStory.NewTitle1":"在相互支持的团队中茁壮成长","recruit.overseasCareers.employeeStory.NewTitle3":"与全球化平台共同发展","recruit.overseasCareers.locationCity.Abu_Dhabi_Hier":"阿布扎比","recruit.overseasCareers.homgpageIdentityVerification.verificationCode":"填写验证码","recruit.overseasCareers.homgpageIdentityVerification.emailHelpText":"填写邮箱地址，例如abc@163.com","recruit.overseasCareers.homgpageIdentityVerification.emailEditButton":"点击绑定","recruit.overseasCareers.homgpageIdentityVerification.email":"邮箱","recruit.overseasCareers.homgpageIdentityVerification.phoneHelpText":"填写手机号","recruit.overseasCareers.homgpageIdentityVerification.phoneEditButton":"点击绑定","recruit.overseasCareers.homgpageIdentityVerific pg?__ares_maxage=0","recruit.overseasCareers.brand.2.bgImg":"https://images3.c-ctrip.com/HrCareers/CareersHome/brand-bg-trip-doms.jpg?__ares_maxage=0","recruit.overseasCareers.brand.3.bgImg":"https://images3.c-ctrip.com/HrCareers/CareersHome/brand-bg-skyscanner-0413.jpg?__ares_maxage=0","recruit.overseasCareers.brand.4.bgImg":"https://images3.c-ctrip.com/HrCareers/CareersHome/brand-bg-qunar.jpg?__ares_maxage=0","recruit.overseasCareers.brand.1.title":"https://images3.c-ctrip.com/HrCareers/CareersHome/Trip.comLogoCN.png?__ares_maxage=0","recruit.overseasCareers.brand.2.title":"https://images3.c-ctrip.com/HrCareers/CareersHome/ctripLogoCN.png?__ares_maxage=0","recruit.overseasCareers.brand.3.title":"https://images3.c-ctrip.com/HrCareers/CareersHome/SkyscannerLogoCN.png?__ares_maxage=0","recruit.overseasCareers.brand.4.title":"https://images3.c-ctrip.com/HrCareers/CareersHome/qunarLogoCN.png?__ares_maxage=0","recruit.overseasCareers.brand.1.content":"Trip.com是一间一站式国际旅游服务公司，在全球39个国家和地区设有48个站点，提供24种语言服务、接受29种当地货币交易。公司拥有广泛强大的酒店和航班网络，覆盖全球200个国家和地区的逾120万间酒店，为用户提供不同住宿选择，并与480多间航空公司合作，覆盖2,600个机场。Trip.com提供世界领先、全年无休的24小时多语言客户服务，并在爱丁堡、东京和首尔设有呼叫中心，为世界各地数以百万计用户打造优质旅行体验。","recruit.overseasCareers.brand.2.content":"携程旅行网（CTRIP）创立于1999年，是全球领先的综合性旅游服务公司，向用户提供无线应用、酒店预订、机票预订、旅游度假、商旅管理及旅游资讯在内的全方位旅行服务。携程于2003年12月在美国纳斯达克成功上市。携程旅行网客服人员超1万名，配备深度神经网络客服机器人，通过全天候、标准化、快捷性的服务可以做好全方位保障，充分满足消费者需求。此外，携程先后建立了“6重旅游保障”、“先行赔付”、“全球旅行SOS应急机制”、“阶梯退改”等创新举措，服务标准全行业最高。为应对全球新冠疫情并推动中国旅游业复苏，携程启动2亿重大自然灾害保障金，推出“同袍计划”，投入10亿元合作伙伴支持基金，发起“旅行复兴V计划”、“携程BOSS直播”，并推出多项致敬医护的公益措施。","recruit.overseasCareers.brand.3.content":"创立于2003年，是一家领先的旅游平台，在全球52个国家提供超过30种语言的服务，每月为数百万用户搜索最佳的机票、酒店和租车产品。天巡覆盖电脑和移动端，其应用下载量达到1亿。公司坚持用户至上，携手1200家旅游合作伙伴，践行引领全球向现代化和可持续旅游转型的使命。","recruit.overseasCareers.brand.4.content":"作为中国领先的一站式旅行平台，去哪儿可实时搜索约9000家旅游代理商网站，覆盖全球范围内超过68万条国内及国际航线，与国内外超过100家航空公司进行了深度合作。除此之外，平台的搜索预订还覆盖了全球范围内超过200余万家酒店、120万余条度假线路、2万余个目的地门票、玩乐。截至目前，去哪儿累计用户量近6亿，App累积下载量超过60亿。","recruit.overseasCareers.home.proposition.2.bgImg":"https://i .Bangkok_Hier.img":" ","recruit.overseasCareers.locationCity.Tokyo_Hier.content":" ","recruit.overseasCareers.locationCity.Tokyo_Hier.img":" ","recruit.overseasCareers.locations.banner":"https://images3.c-ctrip.com/HrCareers/CareersLocation/locationBanner2xPCCN.jpg?__ares_maxage=0","recruit.overseasCareers.locations.bannerColor":" #7378E6","recruit.overseasCareers.locationCity.CO0003.content":" ","recruit.overseasCareers.locationCity.CO0003.img":" ","recruit.overseasCareers.locationCity.CO0007.content":" ","recruit.overseasCareers.locationCity.CO0007.img":" ","recruit.overseasCareers.locationCity.CO0002.content":" ","recruit.overseasCareers.locationCity.CO0002.img":" ","recruit.overseasCareers.locationCity.CO0006.content":" ","recruit.overseasCareers.locationCity.CO0006.img":" ","recruit.overseasCareers.locations.philippines.content":" ","recruit.overseasCareers.locations.philippines.img":" ","recruit.overseasCareers.locations.korea.content":" ","recruit.overseasCareers.locations.korea.img":" ","recruit.overseasCareers.locations.malaysia.content":" ","recruit.overseasCareers.locations.malaysia.img":" ","recruit.overseasCareers.locations.unitedKingdom.content":" ","recruit.overseasCareers.locations.unitedKingdom.img":" ","recruit.overseasCareers.locations.japan.content":" ","recruit.overseasCareers.locations.japan.img":" ","recruit.overseasCareers.locations.title":"办公地点展示","recruit.overseasCareers.locations.data.title":"开启携程之旅","recruit.overseasCareers.locations.1":"上海,中国","recruit.overseasCareers.locations.2":"北京,中国","recruit.overseasCareers.locations.3":"南通,中国","recruit.overseasCareers.locations.4":"广州,中国","recruit.overseasCareers.locations.5":"成都,中国","recruit.overseasCareers.locations.6":"青岛,中国","recruit.overseasCareers.locations.7":"伦敦 & 爱丁堡,英国","recruit.overseasCareers.locations.8":"东京,日本","recruit.overseasCareers.locations.9":"马尼拉 & 宿务,菲律宾","recruit.overseasCareers.locations.10":"首尔,韩国","recruit.overseasCareers.locations.11":"吉隆坡,马来西亚","recruit.overseasCareers.locations.12":"曼谷,泰国","recruit.overseasCareers.locations.1.content":"1999年，携程集团诞生于上海天文大厦，那里承载了携程最初的梦想；2015年，携程总部迁入由世界知名建筑师扎哈·哈迪德在中国打造的首个建筑精品，SOHO大楼，开启新起点、新旅途。作为魔都上海的标志性建筑，携程新总部大楼的流线型外观酷似驰骋远方的高铁，寓意集团业务勇往直前，突飞猛进；激情、纯真、严谨，专注的程里人汇聚在这里，不断创造新的惊喜，一起奔赴梦想之旅！","recruit.overseasCareers.locations.2.content":"北京，有众多现代高楼大厦，也有悠久的古代历史。它是政治中心、文化中心、国际交往中心和科技创新中心，也是充满年轻梦想与激情的地方。\r\r\r\r<br>\r\n2000年，携程华北总部落地首都北京，这为集团在华北及东北八省的业务线的注入了强大动力，助力业务蓬勃发展。我们的员工在北京追逐梦想，沉浸在北京的历史与文化、繁华与烟火中。期待同样热爱旅行的你，在北京和我们一起have a good trip！","recruit.overseasCareers.locations.3.content":"2008年12月，携程南通联络服务中心作为携程设立的第12家分公司，在南通正式运行，拥有坐席超过1.2万个，是目前世界上旅游业内最大的单体式呼叫中心。在这里，一副耳麦连线着全球携程客人，提供“暖心、简单、主动、信任”的服务，持续输出业界高品质的服务。","recruit.overseasCareers.locations.4.content":"2000年，携程华南区域总部落地广州——这里是海上丝绸之路重要发祥地，是推动全球服务商贸往来的千年商都。我们集众力、汇众智，各大业务、运营、服务和技术团队凝聚在此蓬勃发展，务实奋进为梦想奔赴。得闲饮茶是广州程里人的生活方式，开放包容、互利共赢是我们的合作理念。携手深耕粤港澳大湾区，活力广州，“捞乜都掂”！","recruit.overseasCareers.locations.5.content":"2001年，成都分公司正式成立，是携程国内最早开始运营的分公司之一，迄今走过23年的历程。目前成都分公司已发展成为华西区域总部，在成都高新区拥有5W平米的自建办公场地，业务范畴包括四川、重庆、陕西、甘肃、青海、宁夏、新疆、云南、贵州、西藏等省份直辖市。作为西区总部，主要承接集团深耕国内战略，国内业务和团队都在此有落地。上千名充满激情的华西小伙伴汇聚在这里，不忘初心，砥砺前行，创造佳绩。","recruit.overseasCareers.locations.6.content":"2001年，携程筑梦青岛。一群怀揣旅游梦的青年着手深耕齐鲁大地，致力将“好客山东”的自然景观和人文底蕴展现到极致。数十载的匠心积淀，我们不仅在山东，也在浙江、江苏、福建、安徽旅游业发展注入无限活力与强劲动力。期待在中国东部的最前沿阵地，与你的双向奔赴。","recruit.overseasCareers.locations.7.content":"携程集团的业务遍布欧洲，而英国正是携程在欧洲的业务核心。我们在伦敦和爱丁堡均设有办公室，数百名员工在这里为全球各个业务板块提供强有力的支持。\r<br>\r\n携程伦敦办公室位于市中心，设立于伦敦圣玛丽阿克斯街70号（70 St Mary Axe），毗邻利物浦车站。这座大楼独特的圆弧形状让它被戏称为“火腿罐头”，在伦敦群楼间独树一帜。从站点运营到业务拓展，我们的伦敦团队也在这里，推动携程集团业务从伦敦走向欧洲，走向世界！\r<br>\r\n来到携程爱丁堡办公室，你一定能感受到浓浓的热情氛围！这里充满活力，到处洋溢着员工对工作的热情；这里开放包容，团队协作受到高度重视。作为一个多语言呼叫中心，爱丁堡团队提供12种口语服务，力求满足全球旅客的需求。随着我们全球业务的发展，爱丁堡客户支持团队将继续壮大，更好地服务全球客户！","recruit.overseasCareers.locations.8.content":"日本分公司成立于2015年，目前在日本全国的6个城市拥有7个办公室,分别位于北海道、东京、名古屋、大阪、福冈和冲绳。为了更好地服务日本旅客，我们在日本东京特设日语客服中心，为日语客人们提供7*24全天候的贴心服务。\r\r\r\r<br>\r\n2022年11月，我们的日本总部办公室搬入了位于东京站的新大楼。新办公空间色彩明亮、视野宽阔，设备先进，为我们的员工营造了一个舒适、高效、健康的工作环境。在这里，每一个员工都可以充分发挥自己的潜力，在奔赴梦想的旅途中享受成长与快乐。","recruit.overseasCareers.locations.9.content":"携程集团菲律宾办公室位于知名的中央商务区——达义市（Taguig City），马卡蒂市（Makati City）和宿务市（Cebu City），业务部门丰富，已拥有超过600名员工。\r<br>\r\n我们的达义办公室容纳了大部分员工，是客户服务团队的专用办公室。团队为全球英语客户提供7*24小时全天候服务。马卡蒂和宿务办公室则聚集着市场人才，他们维护着我们的酒店合作供应链。作为激动人心的全球发展战略的一部分，携程菲律宾办公室不断提升员工规模，支持集团在亚洲的蓬勃发展，同时坚守我们的使命——追求完美旅程，共建美好世界！","recruit.overseasCareers.locations.10.content":"欢迎来到韩国办公室！\r<br>\r\n当你来到充满活力而历史悠久的首尔市中心，逐步深入探索，你会发现在钟路区独特的地标建筑群之中，便是我们的韩国办公室。\r\r\n我们的光化门办公室坐落在D-Tower，办公室与周围环境协调一体，又提供了多样化的城市景观。\r<br>\r\n我们的钟阁办公室（韩语客户支持中心）位于首尔复古与前沿文化交汇的中心。一边是仁寺洞（Insadong）窄窄的石子街道，连接了传统文化旧址、艺术画廊和博物馆；另一边则是乙支路（Eulji-ro），带你来到前沿时尚与复古风情的聚集地，体会现代首尔的摩登风味。\r<br>\r\n如果你热爱旅行，那就加入携程集团韩国办公室，每一天都是愉快旅程！我们也很自豪能为你提供全球化平台，让你在世界舞台上探索更多的职业发展可能性！","recruit.overseasCareers.locations.11.content":"携程马来西亚办公室位于吉隆坡的全新地标式建筑106交易塔（the Exchange 106）内。这座大楼共106层，是吉隆坡第二高楼，也是全球最先进的建筑之一。就如同这耸入云霄的大楼一般，我们在业务上心向卓越，永攀高峰；在团队上鼓励成长，助力员工走向更高的职业成就。\n<br>\n\n欢迎加入马来西亚办公室，在这里俯瞰天际线美景，拥抱更多可能性，追求完美旅程，共建美好世界！","recruit.overseasCareers.locations.12.content":"欢迎来到携程集团泰国办公室！泰国作为全球最受欢迎的旅游目的地之一，一直是携程集团的重要市场。目前，携程在曼谷、清迈和普吉岛均设有办公室。\r<br>\r\n现在，请来探索我们的曼谷办公室吧！我们的办公室位于曼谷活力四射的新CBD拉差达拉玛9街区（Ratchada-Rama 9 district），地理位置优越，让您感受到现代便利与文化的碰撞。办公室可达MRT蓝线的拉玛9站（MRT Rama 9 station），还有高速公路和多种交通选择，让通勤变得轻松愉快。\r<br>\r\n携程曼谷办公室充满创新与协作，不同背景的员工聚集在这里，共同塑造尖端思想。加入我们，一起探索曼谷的新CBD脉搏，共同创造未来！","recruit.overseasCareers.locations.1.img":"https://images3.c-ctrip.com/HrCareers/CareersLocation/Shanghai.jpg?__ares_maxage=0","recruit.overseasCareers.locations.2.img":"https://images3.c-ctrip.com/HrCareers/CareersLocation/BeiJing.png?__ares_maxage=0","recruit.overseasCareers.locations.3.img":"https://images3.c-ctrip.com/HrCareers/CareersLocation/Nantong.png?__ares_maxage=0","recruit.overseasCareers.locations.4.img":"https://images3.c-ctrip.com/HrCareers/CareersLocation/Guangzhou.jpg?__ares_maxage=0","recruit.overseasCareers.locations.5.img":"https://images3.c-ctrip.com/HrCareers/CareersLocation/ChengDu.jpg?__ares_maxage=0","recruit.overseasCareers.locations.6.img":"https://images3.c-ctrip.com/HrCareers/CareersLocation/QingDao.png?__ares_maxage=0","recruit.overseasCareers.locations.7.img":"https://images3.c-ctrip.com/HrCareers/CareersLocation/Thailand.png?__ares_maxage=0","recruit.overseasCareers.locations.8.img":"https://images3.c-ctrip.com/HrCareers/CareersLocation/Japan.jpg?__ares_maxage=0","recruit.overseasCareers.locations.9.img":"https://images3.c-ctrip.com/HrCareers/CareersLocation/Philippines.jpg?__ares_maxage=0","recruit.overseasCareers.locations.10.img":"https://images3.c-ctrip.com/HrCareers/CareersLocation/SouthKorea.jpg?__ares_maxage=0","recruit.overseasCareers.locations.11.img":"https://images3.c-ctrip.com/HrCareers/CareersLocation/Malaysia.png?__ares_maxage=0","recruit.overseasCareers.locations.12.img":"https://images3.c-ctrip.com/HrCareers/CareersLocation/UnitedKingdom.png?__ares_maxage=0","recruit.overseasCareers.locations.1.code":"https://careers.ctrip.com/index.html#/joblist?cityCode=CO0009","recruit.overseasCareers.locations.2.code":"https://careers.ctrip.com/index.html#/joblist?cityCode=CO0001","recruit.overseasCareers.locations.3.code":"https://careers.ctrip.com/index.html#/joblist?cityCode=CO0006","recruit.overseasCareers.locations.4.code":"https://careers.ctrip.com/index.html#/joblist?cityCode=CO0003","recruit.overseasCareers.locations.5.code":"https://careers.ctrip.com/index.html#/joblist?cityCode=CO0002","recruit.overseasCareers.locations.6.code":"https://careers.ctrip.com/index.html#/joblist?cityCode=CO0007","recruit.overseasCareers.locations.7.code":"https://careers.trip.com/index.html#/joblist?cityCode=London_Hier,Edinburgh_Hier","recruit.overseasCareers.locations.8.code":"https://careers.trip.com/index.html#/joblist?cityCode=Tokyo_Hier","recruit.overseasCareers.locations.9.code":"https://careers.trip.com/index.html#/joblist?cityCode=Manila_Hier,Cebu_Hier","recruit.overseasCareers.locations.10.code":"https://careers.trip.com/index.html#/joblist?cityCode=Seoul_Hier","recruit.overseasCareers.locations.11.code":"https://careers.trip.com/index.html#/joblist?cityCode=Kuala_Lumpur_Hier","recruit.overseasCareers.locations.12.code":"https://careers.trip.com/index.html#/joblist?cityCode=Bangkok_Hier","recruit.overseasCareers.locations.data.databar":"我们在 {countries:个国家/地区} {cities:个城市}, 共 {positions:个职位} 热招中","recruit.overseasCareers.locations.data.databar.positions":" ","recruit.overseasCareers.locations.data.databar.cities":" ","recruit.overseasCareers.locations.data.databar.in":" ","recruit.overseasCareers.locationsH5.banner":"https://images3.c-ctrip.com/HrCareers/CareersLocation/locationBanner2xH5CN.jpg?__ares_maxage=0","recruit.overseasCareers.employeeStory.shareTime.4":" ","recruit.overseasCareers.employeeStory.shareTime.5":" ","recruit.overseasCareers.employeeStory.shareTime.6":" ","recruit.overseasCareers.employeeStory.shareTime.7":" ","recruit.overseasCareers.employeeStory.shareTime.8":" ","recruit.overseasCareers.employeeStory.NewTitle.4":" ","recruit.overseasCareers.employeeStory.NewTitle.5":" ","recruit.overseasCareers.employeeStory.NewTitle.6":" ","recruit.overseasCareers.employeeStory.NewTitle.7":" ","recruit.overseasCareers.employeeStory.NewTitle.8":" ","recruit.overseasCareers.employeeStory.homePicture.4":" ","recruit.overseasCareers.employeeStory.homePicture.5":" ","recruit.overseasCareers.employeeStory.homePicture.6":" ","recruit.overseasCareers.employeeStory.homePicture.7":" ","recruit.overseasCareers.employeeStory.homePicture.8":" ","recruit.overseasCareers.employeeStory.NewSummary.4":" ","recruit.overseasCareers.employeeStory.NewSummary.5":" ","recruit.overseasCareers.employeeStory.NewSummary.6":" ","recruit.overseasCareers.employeeStory.NewSummary.7":" ","recruit.overseasCareers.employeeStory.NewSummary.8":" ","recruit.overseasCareers.employeeStory.titlePicture.4":" ","recruit.overseasCareers.employeeStory.titlePicture.5":" ","recruit.overseasCareers.employeeStory.titlePicture.6":" ","recruit.overseasCareers.employeeStory.titlePicture.7":" ","recruit.overseasCareers.employeeStory.titlePicture.8":" ","recruit.overseasCareers.employeeStory.NewContent.4":" ","recruit.overseasCareers.employeeStory.NewContent1.4":"we showcased our marketing prowess through a presentation to hotels in the area. The presentation was pivotal for us, as we successfully secured contracts with numerous new hotels and convinced them to join our sales channel. All of our efforts resulted in a remarkable increase in the growth rate compared to last year.\r\n\r\n<strong>3.  What sets Trip.com Group apart from other companies? </strong>\r\n<strong>Tomoyuki Takata: </strong>\r\nUnlike many other online travel agencies, the business scope of our company is diverse, encompassing not only hotels but also tickets, train tickets, flight tickets, and more. This means that I can continuously learn new knowledge and skills, exploring more possibilities. Trip.com Group is a young and fast-growing company that is constantly changing and progressing, which is what I enjoy.\r\n<strong>Sho Izaki:  </strong>\r\nAs Trip.com Group embarks on its journey in the Japanese market, there are boundless opportunities to explore new territories, push limits, and create greater value. This nascent phase presents an exceptional opportunity for me to assume a more pivotal role, leveraging my skills and expertise to drive meaningful impact and establish a strong presence in this new market.\r\n\r\n<strong>4.  How would you describe the culture of Trip.com Group? </strong>\r\n<strong>Tomoyuki Takata: </strong>\r\nOur ongoing pursuit of globalization and innovation fills me with pride. ","recruit.overseasCareers.employeeStory.NewContent2.4":"I can feel a strong signal that our company is committed to pursuing technological advancement, which has positioned us at the forefront of the travel industry. I believe that our constant evolution, particularly in terms of technology, will continue to gain recognition.\r\n<strong>Sho Izaki: </strong>\r\nOur company culture is very open and inclusive, strongly emphasizing diversity. There is no strict hierarchical system, and everyone is encouraged to express their thoughts and ideas, with each person's perspective receiving equal respect.\r\n\r\n<strong>5.  What advice would you give to someone interested in joining your team? </strong>\r\n<strong>Tomoyuki Takata: </strong>\r\nCultural adaptation is crucial. As a NASDAQ and Hong Kong-listed company, we're constantly striving to expand our business and explore new markets. We warmly welcome those who fearlessly tackle challenges and steadfastly face difficulties to join our team, as it aligns seamlessly with our innovative and progressive culture.\r\n<strong>Sho Izaki: </strong>\r\nIf you're interested in joining our team, it's crucial to have a mindset that embraces change. With the immense potential for growth in the global market, we seek individuals who are ambitious, ready to address global challenges and possess the courage to fight for them. Adaptability to constant change is a key attribute highly appreciate.","recruit.overseasCareers.employeeStory.NewContent.5":" ","recruit.overseasCareers.employeeStory.NewContent1.5":"When we have good ideas, the company respects and trusts us. As long as we can provide evidence to demonstrate the value of our ideas, we can get full support in implementing them. We are free to think boldly and come up with new ideas to innovate.\r\n<strong>Yoshitomo Fukasawa: </strong>\r\nTrip.com Group provides opportunities for employees to transition and meet their personal development needs and career planning. I previously served as the Marketing Manager of Tokyo at the Hotel Business Unit, responsible for B2B business. Due to my interest, I transferred to my current position. I think the entire transition process was very smooth, and I received strong support and assistance from the company.\r\n\r\n<strong>3. Can you share any impressive achievements and how you made them happen?\r\n</strong>\r\nEddy Yip: </strong>\r\nLast year, we collaborated with different partners including financial institutes, local hotels, and theme park partners for a major promotion on August 8th. ","recruit.overseasCareers.employeeStory.NewContent2.5":"Through coordinated efforts with other internal business units and successful external resource integration, our campaign achieved excellent results, with the highest number of orders received in a single day throughout the year.\r\nDuring the Ching Ming Festival period, there was a high demand for high-speed rail tickets from Hong Kong to mainland China. We successfully met this challenge by collaborating with the Train Ticket Business Unit, conducting a series of successful marketing campaigns, and making targeted optimizations to our products. These efforts attracted more users to book high-speed rail tickets on our platform. We not only have achieved the highest number of orders received in one day so far this year, but also have helped a lot of users to have an easier journey to get their train tickets.\r\n<strong>Yoshitomo Fukasawa: </strong>\r\nWe previously collaborated with LINE Pay for a promotional campaign in the Japanese market. ","recruit.overseasCareers.employeeStory.NewContent3.5":"Our partners helped promote and raise awareness of the competitive products and excellent service quality provided by Trip.com. This promotional campaign achieved significant results, effectively increasing our transaction volume, and receiving positive feedback on social media sites in Japan.\r\n\r\n<strong>4. How do you feel about working at Trip.com Group? </strong>\r\n<strong>Eddy Yip: </strong>\r\nAgile - We are a highly flexible company that can quickly adapt and capture market changes and swiftly implement ideas.\r\nInnovative - Despite being a large company with numerous products, Trip.com Group is always willing to continuously experiment and innovate to create better products.\r\n<strong>Yoshitomo Fukasawa: </strong>\r\nRapid growth - I believe that the travel industry and our company are in an upward phase, which has provided me with many opportunities for rapid growth. ","recruit.overseasCareers.employeeStory.NewContent4.5":"I have gained tremendous growth and progress from this job.\r\nMeaningful - I am passionate about my work, and I believe that what I do can truly promote meaningful adjustments and upgrades to Japan's travel industry. This makes me feel that what I do has real value.\r\n\r\n<strong>5. How would you describe the culture of your team? </strong>\r\n<strong>Eddy Yip: </strong>\r\nOpen, everyone can freely express their ideas without being cautious when talking to leaders, our team members are encouraged to think independently, not just follow instructions from the boss blindly. We want everyone to think about why we are doing this and if there is room for optimization. Additionally, we don't just work for the sake of work but genuinely derive enjoyment from it.\r\n<strong>Yoshitomo Fukasawa: </strong>\r\nOur team is very diverse, with members from different nationalities and backgrounds. ","recruit.overseasCareers.employeeStory.NewContent5.5":"However, we are very united, and we have established a high level of trust among ourselves.  Led by the Director we share weekly highlights and challenges in our respective markets and also introduce each other to partners to facilitate progress in other markets.\r\n\r\n<strong>6. What attracted you to Trip.com Group? </strong>\r\n<strong>Eddy Yip: </strong>\r\nI highly recognize the brand reputation of Trip.com Group, as it is a well-known company in Hong Kong. Additionally, my previous experience in hotel and airline companies, coupled with my background in the travel industry, makes me a good fit in many aspects with Trip.com Group. Lastly, my previous focus was mainly on B2B, and joining Trip.com Group allows me to transition to B2C, providing me with more learning opportunities and the chance to actively participate and grow fast.\r\n<strong>Yoshitomo Fukasawa: </strong>\r\nI previously worked in the travel industry and loved this field. I believe that Japan's travel industry has enormous potential, with many opportunities worth exploring. Additionally, Trip.com Group has achieved tremendous success in China and has abundant resources and experience to leverage overseas markets, including many untapped blue ocean markets. I have many opportunities to try and challenge myself and do meaningful things.\r\n\r\n7. What advice would you give to someone interested in joining your team? </strong>\r\n<strong>Eddy Yip: </strong>\r\nWe hope you bring innovative ideas and are not afraid to express yourself.","recruit.overseasCareers.employeeStory.NewContent6.5":"When formulating big plans, pay attention to the details and be able to identify areas for optimization even in the smallest aspects. A small idea can evolve a big change!\r\n<strong>Yoshitomo Fukasawa: </strong>\r\nHigh coordination and adaptability - Our team is very diverse, and we have the opportunity to come into contact with different cultures. When dealing with colleagues from different cultures and backgrounds, we need to learn to embrace these differences and coordinate effectively.\r\nHigh proactivity - We encourage curiosity about new things and the ability to proactively learn about the company's culture and professional knowledge. Having good self-drive is also a trait that we highly value.","recruit.overseasCareers.employeeStory.NewContent.6":" ","recruit.overseasCareers.employeeStory.NewContent1.6":"Our main focus is constant data analysis, identifying growth opportunities, and delivering a top-notch affiliate program. We leverage successful cases to replicate them in other markets and collaborate with local teams to activate campaigns strategically in the affiliate channel. Despite being in different countries and time zones, our team is highly effective and collaborative, which is a true highlight of our work.\r\n<strong>Joseph Payne: </strong>\r\nMy team is the content department based primarily in Shanghai, we work closely on translating my written work. Our successful launch of social media platforms in the UK has been a notable achievement, greatly improving our APP downloads. Furthermore, our various campaigns across Europe have been successful in enhancing our presence in the European market, with copywriting playing a significant role in these accomplishments. As someone involved in both content creation and marketing, I consider both teams to be my own.\r\n\r\n<strong>3. Can you share one of your impactful projects while working at Trip.com Group?</strong>\r\n<strong>Henrique de Castro Almeida: </strong>\r\nThe highlight of my career was leading a global team and merging all affiliate operations. ","recruit.overseasCareers.employeeStory.NewContent2.6":"This experience required me to navigate between details and strategies and to understand the unique aspects of each region and partner. Clear communication, attention to detail, and the ability to see the big picture were crucial in optimizing our operations and taking timely actions.\r\n<strong>Joseph Payne: </strong>\r\nThe achievement that fills me with the greatest pride is my collaboration with the UED team to develop a comprehensive document outlining our company's desired tone and voice in customer communication. This document guides our copywriters, brand, and marketing teams, enabling effective engagement with our customers. ","recruit.overseasCareers.employeeStory.NewContent3.6":"This accomplishment, early in my career at Trip.com Group, is a significant milestone. Establishing a cohesive brand voice and vision has allowed us to cultivate a strong and consistent communication strategy that resonates with our target audience.\r\n\r\n<strong>4.\tUse three adjectives to accurately convey your feelings about working at Trip.com Group. </strong>\r\n<strong>Henrique de Castro Almeida: </strong>\r\nExciting, dynamic, and adventurous.\r\n<strong>Joseph Payne: </strong>\r\nExcited, inspired, motivated.\r\n\r\n<strong>5.\tHow would you describe the culture of your team? </strong>\r\n<strong>Henrique de Castro Almeida: </strong>\r\nCollaboration is central to our team's success. We value the collective input and observations of each team member, working together to define goals and projects. By leveraging our diverse perspectives and expertise, we make more informed decisions and achieve more effective outcomes.\r\n<strong>Joseph Payne: </strong>\r\nThe open culture at Trip.com Group, with frequent communication from directors and high-level bosses, is something I appreciate. It's wonderful to not only hear from them but also have the chance to see them during their regular visits. Working in the Amsterdam office is particularly exciting due to the diverse nationalities represented among employees. ","recruit.overseasCareers.employeeStory.NewContent4.6":"This diversity fosters a positive company culture and emphasizes the importance of inclusivity, which is a valuable asset to our organization. \r\n\r\n<strong>6.\tWhat was it about Trip.com Group that attracted you here? </strong>\r\n<strong>Henrique de Castro Almeida: </strong>\r\nHaving previous experience in the travel industry, I have always felt a strong connection to this sector. Joining the Trip.com Group was an exciting opportunity for me to be a part of people's journeys. Being part of our customers planning holidays, exploring different destinations, or simply visiting friends and family, that gives me purpose.\r\n<strong>Joseph Payne: </strong>\r\nTrip.com Group has tremendous growth potential and provides limitless opportunities for personal and professional development, allowing me to make a significant impact.","recruit.overseasCareers.employeeStory.NewContent5.6":" I am thrilled to grow alongside the company, while Trip.com Group was initially unknown to many in Europe, I take pride in the role I played in raising our profile, and we are now well-known among many people.\r\n\r\n<strong>7.\tWhat advice would you give to someone interested in joining your team? </strong>\r\n<strong>Henrique de Castro Almeida: </strong>\r\nIf you’re looking for a dynamic and fast-growing company, Trip.com Group is the right place. You’ll find all the opportunities to learn, grow and work with great individuals here.\r\n<strong>Joseph Payne: </strong>\r\nTo collaborate effectively with individuals across different countries and time zones, one must be adaptable and able to transition between projects quickly. For instance, I work closely with colleagues in Shanghai to achieve specific objectives and then switch to collaborate with colleagues in Europe on different tasks, all within the same day. Flexibility is a crucial skill in navigating diverse and dynamic work scenarios. Moreover, having a passion for travel is essential.","recruit.overseasCareers.employeeStory.NewContent.7":" ","recruit.overseasCareers.employeeStory.NewContent1.7":"Given the global nature of our work, we deal with a significant amount of information/communication and overseas channels, requiring us to focus on stakeholder management, standardizing workflows, and establishing frameworks to continuously drive our operation efficiency and commercial excellence, in a sustainable and scalable way. \r\n\r\n<strong>2.\tWhat was it about Trip.com Group that attracted you here? </strong>\r\n<strong>Chengjie Zhang: </strong>\r\nTrip.com Group is strategically expanding its global market, and I am genuinely thrilled to be actively involved in supporting this exceptional company's global development. While I understand this will undoubtedly present various challenges, I view them as valuable opportunities for growth. ","recruit.overseasCareers.employeeStory.NewContent2.7":"Meanwhile I am greatly thankful for the openness and transparency that the company provides every since I joined, allowing me to contribute to the globalization journey with the insights and experiences from my career experiences. \r\n\r\n<strong>3.\tUse three words to convey your feelings about working at Trip.com Group. </strong>\r\n<strong>Chengjie Zhang: </strong>\r\nAmbition- When the company is determined to accomplish something, I can feel the generous investment of resources and everyone's down-to-earth attitude. This unwavering commitment helps us achieve great results.\r\nEmpowerment - Trip.com Group trusts us and provides ample freedom and resources to pursue our goals. Our ideas and judgments are recognized and valued, as long as we can provide compelling evidence to support them.\r\nFast-changing - Our company is rapidly growing and constantly evolving. ","recruit.overseasCareers.employeeStory.NewContent3.7":"Employees have the opportunity to explore new business areas and collaborate with exceptional colleagues, which creates valuable learning experiences for all of us. \r\n\r\n<strong>4.\tHow would you describe your team culture？</strong>\r\n<strong>Chengjie Zhang: </strong>\r\nI believe a High Performing Team comes with high level of transparency and ownership. Each member actively contributes and receives ample respect. I often glean novel and valuable insights from these positive contributions. Additionally, I place great value on trust in managing the team, seeing myself being a supporter on the team’s development, balancing the interest between the people and business when needed.\r\n<strong>5.\tWhat advice would you give to someone interested in joining your team? </strong>\r\n<strong>Chengjie Zhang: </strong>\r\nKnow what you want and be open to what comes along – Trip.com Group is a significant company with the capability to provide numerous opportunities. Meanwhile, be hungry, curious and open to what comes along – things don’t happen as planned, but there is always something interesting and valuable in the journey. ","recruit.overseasCareers.employeeStory.NewContent.8":"At Trip.com Group, we believe that customer service is not just a job, it's a journey! Our customer service team is the fearless crew that provides comprehensive assistance and resolves issues for customers. We catch up with Chloe Lim and Cathy Chung, two members of our Korea Team, who share their fun and exciting experiences with us. Get ready to be entertained by their tales of providing top-notch service with a smile and their unwavering commitment to ensuring customer satisfaction!\r\n\r\n<strong>1.\tTell us about your role. What do you do at Trip.com Group? </strong>\r\n<strong>Chloe Lim: </strong>\r\nMy role as the Inbound Group Leader of Flight CSC (Customer Support Center) in Korea involves maintaining the team's performance and managing the team members. To achieve this, I set clear and achievable goals for the team, establish KPI metrics and attainable targets, track monthly results, and discuss any necessary adjustments with Team Leaders. \r\n<strong>Cathy Chung: </strong>\r\nMy role as the Group Leader involves facilitating effective collaboration and communication and fostering personal growth and satisfaction among team members to contribute to the team's performance. I establish goals and strategies to achieve success, develop team members, promote communication and collaboration, and resolve issues.","recruit.overseasCareers.employeeStory.NewContent1.8":" ","recruit.overseasCareers.employeeStory.NewContent2.8":" We achieve this by analyzing customer feedback to enhance quality and providing accurate, friendly, and timely responses to inquiries and requests. Additionally, we collaborate with relevant teams to enhance the functionality and performance of procedures and modules.\r\n\r\n<strong>3.\tCan you describe what career growth can look like at Trip.com Group and what resources are useful to help with that? </strong>\r\n<strong>Chloe Lim: </strong>\r\nTrip.com Group offers employees various career development and promotion opportunities. Starting as Customer Advisors, employees can progress to Assistant Team Leader, Team Leader, and Group Leader. Other positions like QC and KA are also available for employees to explore different business fields. Throughout my career development, the guidance and support from previous team leaders and colleagues have been crucial to my growth. Our company culture encourages employees to take on new challenges and offers cross-departmental work opportunities, allowing us to gain experience and skills in various areas. \r\n<strong>Cathy Chung: </strong>\r\nTrip.com Group offers diverse career growth opportunities, enabling employees to assume various roles like team leader or quality practitioner. By showcasing our abilities and achieving outstanding results, we can unlock new career development prospects and more demanding positions. As a global enterprise, our company provides us with the opportunity to gain international exposure and expand our professional networks by engaging with overseas branches.","recruit.overseasCareers.employeeStory.NewContent3.8":" Through this, I explore different experiences and domains, further honing my capabilities.\r\n\r\n<strong>4.\tCan you share one of your impactful projects while working at Trip.com Group and how you made it happen? </strong>\r\n<strong>Chloe Lim: </strong>\r\nWhile working at Trip.com Group, my most impactful project was gathering and disseminating information about the rapidly evolving flight industry during the COVID-19 pandemic. My primary objective was to keep my team members and customers informed about the latest developments. To achieve this, I conducted extensive research and stayed up-to-date with the latest news and trends in the industry. I collaborated closely with other departments to ensure that the information I provided was accurate and relevant, building trust and loyalty among our customers and team members.\r\n<strong>Cathy Chung: </strong>\r\nI believed that fostering loyal customers within the customer support center necessitated friendly employees, accurate explanations, and prompt responses. To enhance this aspect, I conducted a 'self-call monitoring project' and calibration exercises with the team.","recruit.overseasCareers.employeeStory.NewContent4.8":" By enabling advisors to assess and compare their call quality, we identified areas for improvement and achieved higher customer satisfaction.\r\n\r\n<strong>5.\tUse three adjectives to accurately convey your feelings about working at Trip.com Group. </strong>\r\n<strong>Chloe Lim: </strong>\r\nChallenging, dynamic, and amazing.\r\n<strong>Cathy Chung: </strong>\r\nPassionate, challenging, and collaborative. \r\n\r\n<strong>6.\tHow would you describe the culture of your team? </strong>\r\n<strong>Chloe Lim:  </strong>\r\nFriendly and collaborative. The close relationships among team members go beyond just working together, indicating that open communication, mutual respect, and a supportive work environment are highly valued. We have become more than just colleagues - we are friends. This sense of camaraderie is a driving force behind our shared commitment to achieving common goals and serves as a cornerstone of our collective success.\r\n<strong>Cathy Chung: </strong>\r\nOur team strongly emphasizes collaboration and openness. We believe in working together and supporting each other, valuing the sharing of ideas and opinions. In addition to our weekly meetings, we have an open communication and feedback culture, where team members are encouraged to freely express their thoughts and ideas, which are respected and actively worked upon for improvement.","recruit.overseasCareers.employeeStory.NewContent5.8":" Furthermore, our team fosters a culture based on respect and diversity, and we embrace the unique experiences and backgrounds that each team member brings.\r\n\r\n<strong>7.\tWhat was it about Trip.com Group that attracted you here? </strong>\r\n<strong>Chloe Lim:  </strong>\r\nI chose to work at Trip.com Group because I believed it was an adaptable workplace that could meet the challenges of COVID-19. I was seeking a job that would allow me to utilize my experience in the travel industry and language skills while also connecting with people. When I saw the opportunity to become a CS Advisor, I knew it was the perfect fit for me. Additionally, Trip.com Group's reputation as the leading online travel company and its growth potential attracted me. Working with talented and experienced professionals is a great opportunity for me.\r\n<strong>Cathy Chung: </strong>\r\nI was attracted to Trip.com Group due to its global impact and horizontal culture and I respectfully applied to this company, firmly believing that my service experience would allow me to make a substantial contribution. The culture values collaboration, open communication, and teamwork, which resonated with me. I appreciate that our company encourages us to contribute our ideas and skills, promoting innovation and diversity. \r\n\r\n<strong>8.\tWhat advice would you give to someone interested in joining your team? </strong>\r\n<strong>Chloe Lim:  </strong>\r\nIf you have a passion for travel and enjoy helping others and finding solutions to challenges, I think this is the place for you. Working at Trip.com is a fulfilling experience that brings a sense of satisfaction to every day.\r\n<strong>Cathy Chung: </strong>\r\nIf you are interested in joining our team, it is important to demonstrate your passion and interest by showcasing your desire and motivation for the specific field. In addition, we value individuals who are motivated and show a desire to learn and grow. Collaboration and teamwork are also crucial to achieving success as a member of our CS team. ","recruit.overseasCareers.employeeStory.NewTitle.3":"与全球化平台共同发展","recruit.overseasCareers.employeeStory.NewTitle.2":"在开放包容型组织中腾飞","recruit.overseasCareers.employeeStory.NewTitle.1":" ","recruit.overseasCareers.employeeStory.NewSummary.3":"携程集团是一所令人惊叹的学校!在这样一家全球性的企业中工作，可以让人快速熟悉各种不同的运作方式、工作方法、文化差异性，还可以获得大量的支持和机会。","recruit.overseasCareers.employeeStory.NewSummary.2":"携程是一个充满活力和无限前景的全球OTA平台，也是让每位伙伴收获平等的事业腾飞机会的优秀雇主！","recruit.overseasCareers.employeeStory.NewSummary.1":" ","recruit.overseasCareers.employeeStory.NewContent.3":"Ori Richter于2018年8月加入携程集团，他从担任携程集团欧洲中心客户服务代理起步，逐步深耕在客户服务这一领域。在为携程的客户提供一流服务支持的同时，Ori在业务的学习和发展方面也打下了很好的基础。\r\n在携程集团的四年半时间里，Ori一步步成长为机票业务的欧洲区域运营经理，负责整个欧洲客户服务，通过遍布三大洲的18个客服团队为客户提供12种语言的服务支持。\r\nOri说:“携程集团是一所令人惊叹的学校。在这样一家全球性的企业中工作，可以让人快速熟悉各种不同的运作方式、工作方法、文化差异性，还可以获得大量的支持和机会。伴随着时间，我的技能范围越来越广，在专业领域和职业发展上都收获了很好的成长。从加入携程的第一天起，我就非常享受在这里的工作状态，对我来说无论做的是什么，这都是成功的关键。”","recruit.overseasCareers.employeeStory.NewContent.2":"Edmund Weng，是新加坡和马来西亚区域市场总监，他于2014年加入携程集团。\r\n他将 “加入携程”看作是一生中做出的最好的职业决定之一。原因是这里拥有非常开放包容的企业文化，这意味着”无论你的职位如何，你的想法都会被倾听、讨论和检验”。\r\n携程布局新加坡和马来西亚市场的6年来，在当地的发展取得了长足进步，Edmund对携程在满足两国客户旅行需求方面做出的贡献感到自豪。携程是一个充满活力和无限前景的全球OTA平台，也是让每位伙伴收获平等的事业腾飞机会的优秀雇主！\r\n在携程，我们提倡简单直接，大声说话。我们用安全的氛围鼓励所有伙伴大声表达自己的想法；用多元包容的态度确保每个人都得到尊重和支持。","recruit.overseasCareers.employeeStory.NewContent.1":" ","recruit.overseasCareers.employeeStory.homePicture.3":"https://images3.c-ctrip.com/HrCareers/ProEmployeeStory/summaryStory3.jpg?__ares_maxage=4","recruit.overseasCareers.employeeStory.homePicture.2":"https://images3.c-ctrip.com/HrCareers/ProEmployeeStory/summaryStory2.jpg?__ares_maxage=4","recruit.overseasCareers.employeeStory.homePicture.1":" ","recruit.overseasCareers.employeeStory.titlePicture.1":" ","recruit.overseasCareers.employeeStory.titlePicture.2":"https://images3.c-ctrip.com/HrCareers/ProEmployeeStory/storyBanner2.jpg?__ares_maxage=0","recruit.overseasCareers.employeeStory.titlePicture.3":"https://images3.c-ctrip.com/HrCareers/ProEmployeeStory/storyBanner3.jpg?__ares_maxage=0","recruit.overseasCareers.locations.thailand.content":"thailandthailandthailandthailandthailandthailandthailandthailandthailandthailandthailandthailandthailandthailandthailand","recruit.overseasCareers.locations.CHN.code":"https://careers.ctrip.com/index.html#/joblist","recruit.overseasCareers.locations.KHM.code":"https://careers.trip.com/#/j ,https://campus.ctrip.com/#/jobs?zhineng%5B0%5D=161198&zhineng%5B1%5D=108614&zhineng%5B2%5D=180019&zhineng%5B3%5D=114421&zhineng%5B4%5D=180020&zhineng%5B5%5D=114422&zhineng%5B6%5D=152710&zhineng%5B7%5D=116589&zhineng%5B8%5D=116590&zhineng%5B9%5D=118404&zhineng%5B10%5D=180021&zhineng%5B11%5D=110418&zhineng%5B12%5D=108639&page=1&anchorName=jobsList,https://campus.ctrip.com/#/jobs?zhineng%5B0%5D=75020&zhineng%5B1%5D=198408&zhineng%5B2%5D=202493&page=1&anchorName=jobsList","recruit.campusCareers.jobType.employeeStories.Title":"学长学姐说","recruit.campusCareers.jobType.employeeStories.title.1":"Vicky 悉尼大学 2020届 技术中心 SRE工程师","recruit.campusCareers.jobType.employeeStories.desc.1":"携程能够给我提供更大、更自由的发展空间。它在开源社区有自己做得比较出色的地方，各方面的资源和发展都是紧跟互联网脚步的。在这里，没有阶级感，团队中的每一个人都能平等地交流，像朋友一样相处。","recruit.campusCareers.jobType.employeeStories.picture.1":"https://images3.c-ctrip.com/HrCareers/CampusCareers/employeeStory/1.jpg?__ares_maxage=0","recruit.campusCareers.jobType.employeeStories.title.2":"Steve 华中科技大学 2019届 旅游事业群 高级后端开发工程师","recruit.campusCareers.jobType.employeeStories.desc.2":"来到携程三年，我已经从一个协助开发者变成了主要负责人。这里对我来说，是一个能实现自我价值的舞台。在携程，大声说出自己的想法很简单，个人成长的机会从不缺乏。","recruit.campusCareers.jobType.employeeStories.picture.2":"https://images3.c-ctrip.com/HrCareers/CampusCareers/employeeStory/2.jpg?__ares_maxage=0","recruit.campusCareers.jobType.employeeStories.title.3":"Sisi 伦敦艺术大学 2022届 国际事业部 创意设计师","recruit.campusCareers.jobType.employeeStories.desc.3":"我能在为公司创造价值的同时，充分发挥自己的特长。一个人的工作可以从中沉淀经验和结论，从而赋能整个团队，我觉得是非常有成就感的事情。携程是我的初心，氛围非常love & peace，在这里我能感受到归属感。","recruit.campusCareers.jobType.employeeStories.picture.3":"https://images3.c-ctrip.com/HrCareers/CampusCareers/employeeStory/3.jpg?__ares_maxage=0","recruit.campusCareers.followUs.title":"关注我们","recruit.campusCareers.followUs.wechat":"https://images3.c-ctrip.com/HrCareers/CampusCareers/followUs/wechat.png?__ares_maxage=0","recruit.campusCareers.followUs.bilibili":"https://images3.c-ctrip.com/HrCareers/CampusCareers/followUs/bilibili.png?__ares_maxage=0","recruit.campusCareers.followUs.xiaohongshu":"https://images3.c-ctrip.com/HrCareers/CampusCareers/followUs/img_v3_02pg_c67e6e1f-0d83-4857-bad7-5950ade6c41g.png","recruit.campusCareers.QA.title.1":"1. 本次秋季校园招聘面向哪些同学开放？","recruit.campusCareers.QA.desc.1":"面向毕业时间在2025年9月1日至2026年8月31日且最高学历毕业后无全职工作经验的学生。</br>\r\n* 中国大陆以毕业证为准，非中国大陆地区以教育部学位认证的毕业时间为准</br>","recruit.campusCareers.QA.title.2":"2. 每人可以投递几个职位？","recruit.campusCareers.QA.desc.2":"每位同学仅可投递一个职位（包含人才项目），请认真选择并谨慎投递。","recruit.campusCareers.QA.title.3":"3. 投递过以往春/秋招但进入了人才库，今年秋招还能投递吗？","recruit.campusCareers.QA.desc.3":"可以投递，以往春/秋招结果不影响本次秋招投递。","recruit.campusCareers.QA.title.4":"4. 招聘职位的工作地点在哪里？","recruit.campusCareers.QA.desc.4":"每个招聘职位中都会注明工作地点，可以仔细阅读职位描述。","recruit.campusCareers.QA.title.5":"5. 本次秋季校园招聘什么时候结束？最晚可以在什么时间投递","recruit.campusCareers.QA.desc.5":"本次校园招聘招满即止，岗位需求会在招聘过程中不断得到满足，因此招聘后期机会越来越少，建议同学们尽早投递。","recruit.campusCareers.QA.title.6":"6. 出现网申岗位错误、简历上传错误、个人信息填写错误等情况该如何解决？","recruit.campusCareers.QA.desc.6":"网申完毕后，无特殊情况无法修改相关信息，如确需修改，请发送邮件至campus@trip.com，邮件标题注明“修改内容+姓名+网申手机号”，工作人员将会尽快处理","recruit.campusCareers.QA.title.7":"7. 本次秋季校园招聘的流程安排是什么？","recruit.campusCareers.QA.desc.7":"网申-能力测评-AI面试-笔试（技术/设计）-面试-Offer</br>\r\n* 不同岗位间流程存在差异，请及时关注邮箱及短信通知</br>","recruit.campusCareers.QA.title.8":"8. 如何查询应聘进展？","recruit.campusCareers.QA.desc.8":"（1）通过「携程招聘」微信公众号（菜单栏-校园招聘-进度查询）查询；</br>\r\n（2）联系内推人进行查询。</br>","recruit.campusCareers.QA.title.9":"9. 如果简历停留在某个阶段很久（超过 10 个工作日），代表流程已经结束了吗？","recruit.campusCareers.QA.desc.9":"若简历状态显示【进入人才池】，则表示该职位流程已结束；其他状态请耐心等待后续通知。","recruit.campusCareers.QA.title.10":"10. 简历投递后多久会收到能力测评？","recruit.campusCareers.QA.desc.10":"简历投递后2-3天会收到能力测评邀请邮件和短信。","recruit.campusCareers.QA.title.11":"11. 收到能力测评邀请短信但未收到邮件通知怎么办？","recruit.campusCareers.QA.desc.11":"请先查看订阅邮箱、垃圾箱或已归档邮箱，如仍未收到邮件可以<a href=\"https://mokahr.udesk.cn/im_client/?web_plugin_id=177101\" target=\"_blank\"><strong>点击此处</strong></a>联系第三方客服解决。","recruit.campusCareers.QA.title.12":"12. 本次秋季校园招聘的笔试安排是什么？","recruit.campusCareers.QA.desc.12":"研发类共安排6批笔试，具体时间如下：</br>\n9月4日、9月6日、9月18日、10月11日、10月23日、11月6日</br>\n设计类共安排5批笔试，具体时间如下：</br>\n9月4日、9月18日、10月11日、10月23日、11月6日</br>\n* 视情况灵活调整专业笔试场次，请以实际通知为准</br>","recruit.campusCareers.QA.title.13":"13. 没有时间参加笔试或错过笔试该怎么办？","recruit.campusCareers.QA.desc.13":"只要不在笔试时间点进笔试链接，无需任何额外操作，将自动顺延至下一批次，请在下次笔试前1-2天关注邮箱及短信通知。</br>","recruit.campusCareers.QA.title.14":"14. 本次秋季校园招聘的面试有几轮？形式是什么？","recruit.campusCareers.QA.desc.14":"通常情况下为1轮AI面试、2-3轮专业面试、1轮HR面试，具体以实际岗位情况为准。</br>\r\n面试形式大多以线上为主，仅研发类岗位设线下面试场次。</br>","recruit.campusCareers.QA.title.15":"15. 本次秋季校园招聘的线下面试安排是什么？","recruit.campusCareers.QA.desc.15":"本次秋招仅针对研发类岗位在上海、南京、武汉、西安开展4场线下面试，我们将综合考量同学情况后发起线下面试邀约。</br>","recruit.campusCareers.project.title":"招聘项目","recruit.campusCareers.project.description":"注意：每位同学每个项目仅可投递一个职位（集团培训生项目、AGT、旅行官星辰计划、商旅程英会共享一个网申投递名额）","recruit.campusCareers.project.title.1":"2026届秋季校园招聘","recruit.campusCareers.project.summary.1":"研发类｜产品类｜综合类","recruit.campusCareers.project.banner.1":"https://images3.c-ctrip.com/HrCareers/CampusCareers/project/List/1.jpg?__ares_maxage=0","recruit.campusCareers.project.text1.1":"<a href=\"https://campus.ctrip.com/#/jobs\"  target=\"_blank\"><img src=\"https://images3.c-ctrip.com/HrCareers/CampusCareers/project/detail/1Detail.png?__ares_maxage=0\" width=\"800\">\r\r\n</a>","recruit.campusCareers.project.text1.2":" ","recruit.campusCareers.project.text1.3":" ","recruit.campusCareers.project.title.2":" ","recruit.campusCareers.project.summary.2":" ","recruit.campusCareers.project.banner.2":"https://images3.c-ctrip.com/HrCareers/CampusCareers/project/List/2.jpg?__ares_maxage=0","recruit.campusCareers.project.text2.1":" ","recruit.campusCareers.project.text2.2":" ","recruit.campusCareers.project.text2.3":" ","recruit.campusCareers.project.title.3":"旅行官星辰计划","recruit.campusCareers.project.summary.3":"旅游业务运营｜旅游业务拓展","recruit.campusCareers.project.banner.3":"https://images3.c-ctrip.com/HrCareers/CampusCareers/project/List/3.jpg?__ares_maxage=0","recruit.campusCareers.proj 3.c-ctrip.com/HrCareers/Nantong/ReferralBanner.jpg?__ares_maxage=0) no-repeat center center; background-size: cover !important;\"></a>","recruit.campusCareers.project.text903.2":" ","recruit.campusCareers.project.text903.3":" ","recruit.campusCareers.project.text903.1":"<span style=\"color: #333333; line-height: 160%;\">携程员工内推请通过公司内部平台：【程里机会】——我要推荐，进行推荐。如您所在部门有另行规则，请联系部门人事工作人员。</span>\n\n<span style=\"color: #333333; line-height: 160%;\">如果您有任何问题也可以电话联系“人力资源部招聘组”0513-89186000-18050/104065。\n说明：本栏目仅限携程在职员工使用</span>","recruit.campusCareers.project.title.903":"内部推荐","recruit.campusCareers.project.bannerDetail.902":"<a href=\"javascript:;\" target=\"_blank\" style=\"display: block; width: 100%; height: 100%; background: url(https://images3.c-ctrip.com/HrCareers/Nantong/OnboardingGuideBanner.jpg?__ares_maxage=0) no-repeat center center; background-size: cover !important;\"></a> ","recruit.campusCareers.project.text902.2":"手续。</span>\n\n<span style=\"color: #333333; line-height: 160%;\">3、申请入住宿舍者须知：</span>\n<span style=\"color: #333333; line-height: 160%;\">申请住宿者请在入职日的前1天（10：00-12：00 13:00-18:00）在<strong>南通经济技术开发区复兴路“四海家园”16号楼107室</strong>进行住宿手续办理</span>\n<span style=\"color: #333333; line-height: 160%;\">1）申请宿舍在宿管办公室办理，无需到公司办理;</span>\n<span style=\"color: #333333; line-height: 160%;\">2）需要入住宿舍的新员工办理当天需要提交水电和钥匙押金总共150元的押金费用（搬离宿舍时，凭收据退还）;</span>\n<span style=\"color: #333333; line-height: 160%;\">3) 宿舍提供热水器、电视机、空调以及内置卫生间。请自备被褥和平时的洗漱用品及更替衣物等日常生活物资；</span>\n<span style=\"color: #333333; line-height: 160%;\">4) 宿舍到公司：步行15～20分钟，共享单车5-10分钟左右;</span>\n<span style=\"color: #333333; line-height: 160%;\">5) 宿舍管理员（联系电话：0513-81528352）</span>\n\n<span style=\"color: #333333; line-height: 160%;\"><img src=\"https://images3.c-ctrip.com/HrCareers/Nantong/OnboardingGuide.png?__ares_maxage=0\" width=\"800\"></a></span>\n\n<span style=\"color: #333333; line-height: 160%;\">如果您有任何问题也可以电话联系“人力资源部招聘组”0513-89186000-18050/104065。</span>","recruit.campusCareers.project.text902.3":" ","recruit.campusCareers.project.text902.1":"<span style=\"color: #333333; line-height: 160%;\">一、入职材料准备须知</span>\n\n<span style=\"color: #333333; line-height: 160%;\">1、学历证明：登陆学信网【http://www.chsi.com.cn/ 】查询本人学籍、学历信息，以完整截图形式保存;</span>\n<span style=\"color: #333333; line-height: 160%;\">\n2、体检报告：您需要前往二级以上公立医院或正规体检中心进行常规入职体检，或提供入职前3个月本人合格的体检报告，体检项目需至少包含心电图、胸透（无需出片）、谷丙转氨酶（肝功能中ALT）。体检材料以完整检查报告的图片形式保存。注意事项：体检需空腹检查;</span>\n\n<span style=\"color: #333333; line-height: 160%;\">3、身份证：有效期内身份证正反两面拍照图片形式保存;</span>\n\n<span style=\"color: #333333; line-height: 160%;\">4、工资卡：中国境内建设银行、浦发银行、招商银行任意一家银行储蓄卡;</span>\n\n<span style=\"color: #333333; line-height: 160%;\">5、白底半身电子照片，用于制作员工卡;</span>\n\n<span style=\"color: #333333; line-height: 160%;\">二、入职流程须知</span>\n\n<span style=\"color: #333333; line-height: 160%;\">1、入职材料提报：</span>\n<span style=\"color: #333333; line-height: 160%;\">请在入职当天前3个工作日，经过<strong>携程offer邮件链接</strong>或<strong>入职通知短信链接</strong>或<strong>微信小程序-携程HR-入职填报</strong>三种途径之一，上传以下符合要求的入职材料。\n（注意：所传材料均需要您分别拍摄清晰照片，姓名等重要信息不可模糊，体检报告每张都需要单独拍照。</span>\n<span style=\"color: #333333; line-height: 160%;\">1）身份证正反面照片;</span>\n<span style=\"color: #333333; line-height: 160%;\">2）学历证明，登陆学信网【http://www.chsi.com.cn/ 】查询本人学籍、学历信息，以完整截图形式上传;</span>\n<span style=\"color: #333333; line-height: 160%;\">3）检查报告原件【体检须三个月以内、二级以上公立医院或正规体检中心出具的常规检查报告，至少包含但不限于以下三项：胸透（无需出片）、心电图、谷丙转氨酶。\n（无体检报告均不可办理入职。通过门诊开单项检查可快速拿到报告）</span>\n<span style=\"color: #333333; line-height: 160%;\">4）白底半身电子照片，用于制作员工卡；</span>\n\n<span style=\"color: #333333; line-height: 160%;\"><strong>注意：如以上材料在入职前3个工作日无法上传，入职当天务必携带齐全。我们会对相关入职材料进行提前审核，如不符合公司要求，则入职手续无法正常办理;</strong></span>\n\n<span style=\"color: #333333; line-height: 160%;\">2、入职报到时间、地址：</span>\n<span style=\"color: #333333; line-height: 160%;\">入职当天9：00点请携带黑色签字笔及相关入职材料到携程公司南楼一楼面试间报道，届时会有工作人员统一办理","recruit.campusCareers.project.title.902":"入职指南","recruit.campusCareers.project.bannerDetail.901":"<a href=\"javascript:;\" target=\"_blank\" style=\"display: block; width: 100%; height: 100%; background: url(https://images3.c-ctrip.com/HrCareers/Nantong/InterviewNotesBanner.jpg?__ares_maxage=0) no-repeat center center; background-size: cover !important;\"></a>","recruit.campusCareers.project.text901.2":" ","recruit.campusCareers.project.text901.3":" ","recruit.campusCareers.project.text901.1":"<span style=\"color: #333333; line-height: 160%;\">面试时间：每周一到周五（国定假期除外）下午1:30-4:00为正常面试时间。具体以我司正式面试邀请邮件和短信内容为准。</span>\n\n<span style=\"color: #333333; line-height: 160%;\">面试地点：南通是开发区长川路1号携程信息技术大楼南楼1楼面试间。</span>\n\n<span style=\"color: #333333; line-height: 160%;\"><img src=\"https://images3.c-ctrip.com/HrCareers/Nantong/InterviewNotes.png?__ares_maxage=0\" width=\"800\">\n</a></span>\n\n<span style=\"color: #333333; line-height: 160%;\">面试安排：通过携程招聘官网投递简历预约面试的候选人，经过简历初筛通过后，会提前一个工作日收到面试邀请邮件和短信。</span>\n\n<span style=\"color: #333333; line-height: 160%;\">如果您有任何问题也可以电话联系“人力资源部招聘组”0513-89186000-18050/104065。</span>\n\n<span style=\"color: #333333; line-height: 160%;\">说明：我公司对外招聘严格遵循中华人民共和国法律法规的规定和要求，在招聘过程中，不会向求职者收取任何费用。</span>","recruit.campusCareers.project.title.901":"面试须知","recruit.campusCareers.project.bannerDetail.900":"<a href=\"javascript:;\" target=\"_blank\" style=\"display: block; width: 100%; height: 100%; background: url(https://images3.c-ctrip.com/HrCareers/Nantong/Group.jpg?__ares_maxage=0) no-repeat center center; background-size: cover !important;\"></a>","recruit.campusCareers.project.text900.2":" ","recruit.campusCareers.project.text900.3":" ","recruit.campusCareers.project.text900.1":"<span style=\"color: #333333; line-height: 160%;\">携程集团是全球领先的一站式旅游服务供货商，旗下品牌包括 Trip.com、携程、Skyscanner 及去哪儿网。携程集团于1999年创立，2003年在纳斯达克上市（NASDAQ: TCOM），2021年在香港交易所正式挂牌（HKEX: 09961）。携程集团为世界各地旅客全方位搜罗及整合旅游信息，让用户可以轻松预订旅游产品及服务，做出最精明的选择。集团品牌已构建先进成熟的交易平台，包括移动客户端、网页，以及24小时全球客户服务支持。通过携程集团丰富的产品及创新的营销策略，合作伙伴及供货商得以接触快速增长的全球用户。携程集团一直毋忘初衷，秉承「追求完美旅程，共建美好世界」的宗旨，致力为所有用户打造完美的旅行体验。</span> \n\n<span style=\"color: #333333; line-height: 160%;\">2008年12月，携程南通联络服务中心作为携程设立的第12家分公司，在南通正式运行，拥有坐席超过1.2万个，是目前世界上旅游业内最大的单体式呼叫中心。在这里，一副耳麦连线着全球携程客人，提供“暖心、简单、主动、信任”的服务，持续输出业界高品质的服务。</span> \n\n<span style=\"color: #333333; line-height: 160%;\">携程南通公司目前有员工超7000人。工作环境优越，公司拥有健全的培训、晋升、轮岗机制以及优秀的讲师队伍，为每位员工提供所需要的培训机会，以帮助员工更好的提升水平与能力。携程为员工提供全面的福利及富有竞争力的薪资。在职业生涯规划上，公司设有多个职业发展通道，员工可根据自己的兴趣特长进行选择与调整。同时，针对员工的不同特点及需求，开设近15个员工俱乐部。公司定期举办各类富有特色的文化活动，以丰富及提升员工的生活感受。公司内各种文体设施、健身娱乐器材、休闲娱乐场所提供给员工轻松的休闲环境，积极打造轻松和谐的携程一家人家人文化。</span> \n\n<span style=\"color: #333333; line-height: 160%;\">公司地址：南通市经济技术开发区长川路1号携程信息技术大楼</span>","recruit.campusCareers.project.title.900":"了解携程集团","recruit.Careers.NantongInterviewDate.New":" 2024-11-23","recruit.Careers.SearchJob":"查看职位","recruit.overseasCareers.locationCountry.HUN":"匈牙利","recruit.overseasCareers.locationCity.Budapest_Hier":"布达佩斯","recruit.overseasCareers.locationCity.yulin__Hier":"榆林","recruit.overseasCareers.locationCity.Almaty_Hier":"阿拉木图","recruit.overseasCareers.locationCity.Amman_Hier":"安曼","recruit.overseasCareers.locationCity.Anshan_Hier":"鞍山","recruit.overseasCareers.locationCity.Anyang_Hier":"安阳","recruit.overseasCareers.locationCity.Bangalore_Hier":"班加罗尔","recruit.overseasCareers.locationCity.Baoji_Hier":"宝鸡","recruit.overseasCareers.locationCity.Bijie_Hier":"毕节","recruit.overseasCareers.locationCity.Cancun_Hier":"坎昆","recruit.overseasCareers.locationCity.Cangzhou_Hier":"沧州","recruit.overseasCareers.locationCity.Dandong_Hier":"丹东","recruit.overseasCareers.locationCity.Dezhou_Hier":"德州","recruit.overseasCareers.locationCity.Dublin_Loc_Hier":"都柏林","recruit.overseasCareers.locationCity.Eerduosi_Hier":"鄂尔多斯","recruit.overseasCareers.locationCity.Guizhou_Hier":"凯里","recruit.overseasCareers.locationCity.Gurgaon_Hier":"古尔冈","recruit.overseasCareers.locationCity.Hanzhong_Hier":"汉中","recruit.overseasCareers.locationCity.Honghe_Hier":"红河","recruit.overseasCareers.locationCity.Huaian_Hier":"淮安","recruit.overseasCareers.locationCity.Hulunbeier_Hier":"呼伦贝尔","recruit.overseasCareers.locationCity.Jeddah_Hier":"吉达","recruit.overseasCareers.location :"8月26日起</br>\n\n招满即止","recruit.campus.homepage.process4":"Step2","recruit.campus.homepage.process5":"在线测评","recruit.campus.homepage.process7":"Step3","recruit.campus.homepage.process6":"网申后3天内</br>\n邮件邀请","recruit.campus.homepage.process8":"AI面试","recruit.campus.homepage.process9":"测评通过后3天内</br>邮件邀请","recruit.campus.homepage.process10":"Step4","recruit.campus.homepage.process11":"专业笔试","recruit.campus.homepage.process12":"研发&设计类岗位</br>设有专业笔试","recruit.campus.homepage.process13":"Step5","recruit.campus.homepage.process14":"面试","recruit.campus.homepage.process15":"9月中旬起</br>\n滚动安排","recruit.campus.homepage.process16":"Step6","recruit.campus.homepage.process17":"Offer","recruit.campus.homepage.process18":"10月起</br>\n陆续发放","recruit.campus.homepage.ads1":"校招资讯","recruit.campus.homepage.ads2":"了解更多","recruit.campus.homepage.ads3":"查看更多资讯","recruit.campus.homepage.SeniorStudents":"学长学姐说","recruit.campus.homepage.SeniorStudentsName1":"Machine","recruit.campus.homepage.SeniorStudentsName2":"小小","recruit.campus.homepage.SeniorStudentsName3":"Hailin","recruit.campus.homepage.SeniorStudentsName4":"KK","recruit.campus.homepage.SeniorStudentsIntroduction1":"2024届｜大住宿事业群｜后端开发工程师","recruit.campus.homepage.SeniorStudentsIntroduction2":"2023届｜机票事业群｜产品经理","recruit.campus.homepage.SeniorStudentsIntroduction3":"2023届｜旅游事业群｜算法工程师","recruit.campus.homepage.SeniorStudentsIntroduction4":"2022届｜火车票事业群｜产品经理","recruit.campus.homepage.SeniorStudentsTitle1":"在这里，每行代码都有意义，每个人都能被看见","recruit.campus.homepage.SeniorStudentsTitle2":"以主人翁心态，做长期价值的践行者","recruit.campus.homepage.SeniorStudentsTitle3":"技术有深度，成长有厚度","recruit.campus.homepage.SeniorStudentsTitle4":"所学为帆，所爱为岸","recruit.campus.homepage.SeniorStudentsContent1":"入职后我便有机会接手一个完整模块，在团队互信坦诚、全员共担问题的氛围中，我从解决一个具体问题，迈向由点及面的重构，逐步培养了全局性的泛化能力。我也逐渐体会到，写代码不再只是为了试卷上的分数，而是为了改变世界的一角。如今，我拥有了更多产品思维，深刻理解一个成功产品需要团队鼎力合作。","recruit.campus.homepage.SeniorStudentsContent2":"我通过暑期实习转正加入携程，不仅提前适应了职场节奏、明确了岗位匹配度，更被团队目标一致、彼此补位的氛围深深打动。在这里，我完成了从 “价值吸收者” 到 “价值创造者” 的转变，树立主人翁意识，在工作中有意识的沉淀技能、持续复盘提升，主动发现问题，以长期价值为导向，做好而不是做完。","recruit.campus.homepage.SeniorStudentsContent3":"最初被健康平衡的氛围吸引，如今因算法深耕、团队温暖而扎根。导师与主管的耐心引路，助我完成从学生到职场人的蜕变。在列表页排序项目中，我扎根复杂的旅游业务场景，以技术破解难题，真切体会到驱动业务的成就感。团队的温度让我专注技术深度，自在包容的氛围，更让我的成长稳步沉淀、更有厚度。","recruit.campus.homepage.SeniorStudentsContent4":"从斯坦福毕业后，我加入了携程，出于对旅游的热爱，我选择在这里将兴趣与专业结合，并有幸从0到1推动了意大利火车票业务，在实战中锻炼了全局视野与统筹能力。团队年轻而充满冲劲，公司更给予了校招生广阔的探索舞台。未来，我希望能持续深耕，与优秀伙伴一起，为更多旅行者打造完美旅程。","recruit.campus.homepage.SeniorStudentsImage1":"https://images3.c-ctrip.com/HrCareers/CampusCareersNew/SeniorStudents/MaXun.png?__ares_maxage=3","recruit.campus.homepage.SeniorStudentsImage2":"https://images3.c-ctrip.com/HrCareers/CampusCareersNew/SeniorStudents/XiaoYiXu.png?__ares_maxage=3","recruit.campus.homepage.SeniorStudentsImage3":"https://images3.c-ctrip.com/HrCareers/CampusCareersNew/SeniorStudents/1280X1280.PNG?__ares_maxage=3","recruit.campus.homepage.SeniorStudentsImage4":"https://images3.c-ctrip.com/HrCareers/CampusCareersNew/SeniorStudents/KunXu.png?__ares_maxage=3","recruit.campus.homepage.FollowUsImage1":"https://images3.c-ctrip.com/HrCareers/CampusCareersNew/FollowUs/WeChat.png?__ares_maxage=0","recruit.campus.homepage.FollowUsImage2":"https://images3.c-ctrip.com/HrCareers/CampusCareersNew/FollowUs/XiaoHongshu.png?__ares_maxage=0","recruit.campus.homepage.FollowUsImage3":"https://images3.c-ctrip.com/HrCareers/CampusCareersNew/FollowUs/BiliBili.png?__ares_maxage=0","recruit.campus.homepage.FollowUsImage4":"https://images3.c-ctrip.com/HrCareers/CampusCareersNew/FollowUs/in.png?__ares_maxage=0","recruit.campus.homepage.FollowUsQRCode1":"https://images3.c-ctrip.com/HrCareers/CampusCareersNew/FollowUs/weChatChannerQRCode.png?__ares_maxage=0","recruit.campus.homepage.FollowUsQRCode2":"https://images3.c-ctrip.com/HrCareers/CampusCareersNew/FollowUs/XiaoHongShuQRcode.png?__ares_maxage=0","recruit.campus.homepage.FollowUsQRCode3":"https://images3.c-ctrip.com/HrCareers/CampusCareersNew/FollowUs/weChatQRcode3.jpg?__ares_maxage=0","recruit.campu
